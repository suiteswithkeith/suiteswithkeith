ts."]],"k":[["It's a walk to the core sights.","About ten minutes to the Duomo. A gentle stroll for most, but worth noting if you want to be on top of the postcard."],["The palazzo rooms vary wonderfully.","Frescoes here, garden views there. Tell me what matters and I'll request the right one."],["A new, more modern wing is coming.","The hotel is building an entire new section of more modern rooms, set to open in spring 2027, and from what I understand it will add around 90 rooms. Four Seasons is already at the top of Florence prices, next to Villa San Michele, so I’ll be watching how the new rooms are priced. Ask me for the latest before you book."],["Families, this is your Florence hotel.","The garden and pool make it the city's easiest luxury stay with kids, which is rare and worth planning around."]],"img":"img/four-seasons-hotel-firenze.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-hotel-firenze.html"},{"s":"four-seasons-hualalai-hawaii","n":"Four Seasons Resort Hualalai","c":"Hawaii","a":"Hawaii","w":"Kailua-Kona, Hawaii","v":"The benchmark for service. The three words I wrote on my list are the whole review.","p":"Honeymoons, families, service perfectionists","st":"Luxury beach resort","r":"#12 on The Fifteen","vis":"","fh":0,"so":[["The benchmark for service.","The literal note on my list. It's the standard I measure other resorts against."],["Four Seasons consistency, Hawaii warmth.","The rare property where brand polish and genuine aloha coexist."],["Preferred-partner leverage.","One of the bookings where my Four Seasons relationship visibly pays for itself."]],"k":[["It's not a seclusion play.","For remote-and-private, my other Hawaii entry is the answer: Four Seasons Resort Lanai, #13 on the same list."],["Honeymooners share it with families.","The service absorbs it, but couples set on adults-only energy should tell me upfront."],["Pair the two Fifteens.","Hualalai plus Lanai is the two-island Hawaii honeymoon I build most happily."]],"img":"img/four-seasons-hualalai-hawaii.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-hualalai-hawaii.html"},{"s":"four-seasons-kuda-huraa-maldives","n":"Four Seasons Resort Maldives at Kuda Huraa","c":"Maldives","a":"Maldives","w":"North Malé Atoll, Maldives","v":"My easiest recommendation for first-time Maldives visitors. On this trip, nothing is your problem.","p":"First-time Maldives visitors, travelers who want easy logistics","st":"Classic island resort (Four Seasons)","r":"Opens my Four Seasons Collection itinerary","vis":"","fh":0,"so":[["The 25-minute arrival.","The shortest transfer in my proposal. You're at the pool before your jet lag notices."],["One brand for the whole trip.","A single Four Seasons team runs the whole trip, including the complimentary seaplane to Landaa."],["The polished classic.","Flawless, familiar service, the same trait that makes Hualalai my global benchmark."]],"k":[["It's the priciest collection.","My proposal says so plainly: the Four Seasons pairing costs more than my other two itineraries, and what you're paying for is ease."],["Larger and busier means less seclusion.","Classic rather than cutting-edge, and livelier than a private hideaway. That's the trade, stated upfront."],["The pairing is the product.","Kuda Huraa alone is lovely; Kuda Huraa into Landaa Giraavaru is the itinerary."]],"img":"img/four-seasons-kuda-huraa-maldives.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-kuda-huraa-maldives.html"},{"s":"four-seasons-lanai-hawaii","n":"Four Seasons Resort Lanai","c":"Hawaii","a":"Hawaii","w":"Lanai, Hawaii","v":"Remote, private, unmatched for couples. Lanai is the Hawaii I save for people who want it all to themselves.","p":"Honeymoons, privacy seekers, second-time Hawaii visitors","st":"Remote island resort","r":"#13 on The Fifteen","vis":"","fh":0,"so":[["The island is the moat.","One small island, one great resort. No beachfront room category can give you that kind of privacy."],["Unmatched for couples.","My exact note on The Fifteen. The pace, the quiet, and the scale all favor two people."],["Four Seasons execution, end to end.","The same consistency that makes Hualalai my service benchmark, transplanted somewhere far quieter."]],"k":[["Remote means remote.","Getting to Lanai takes an extra hop. I sequence it so the transit feels like part of the unwinding."],["Bring your own itinerary energy.","The island is quiet by design. Couples who want restaurant-hopping variety should split the trip with the Big Island."],["The two-Fifteen pairing.","Hualalai for the benchmark service, Lanai for the seclusion. It's my favorite Hawaii honeymoon structure."]],"img":"img/four-seasons-lanai-hawaii.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-lanai-hawaii.html"},{"s":"four-seasons-landaa-giraavaru-maldives","n":"Four Seasons Resort Maldives at Landaa Giraavaru","c":"Maldives","a":"Maldives","w":"Baa Atoll, Maldives","v":"Serious marine life with flawless, familiar service. This is the grand finale my Four Seasons Collection is named for.","p":"Marine-life lovers, first-time visitors, grand finales","st":"Flagship island resort (Four Seasons)","r":"The flagship finish of my Four Seasons Collection","vis":"","fh":0,"so":[["Hanifaru Bay at your doorstep.","One of the world's great manta and whale-shark aggregation sites, a short boat ride away."],["The marine research centre.","Conservation woven into the resort. It's the nature-rich half of the Four Seasons pairing."],["The complimentary seaplane arrival.","Scenic, easy, and included between the two Four Seasons islands."]],"k":[["Season drives the spectacle.","Hanifaru's manta season only runs part of the year. Tell me your dates and I'll tell you your odds."],["Grand means big.","Like its sibling, this is a larger, livelier resort, so seclusion-first couples should compare the Island Escape in my proposal."],["Book it as the second island.","The itinerary builds from polished Kuda Huraa to grand Landaa on purpose."]],"img":"img/four-seasons-landaa-giraavaru-maldives.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-landaa-giraavaru-maldives.html"},{"s":"four-seasons-mykonos","n":"Four Seasons Hotel Mykonos","c":"Greece","a":"Mykonos","w":"Mykonos, Greece","v":"A true Four Seasons on Mykonos, with a private beach, rooms big enough for families, and a team I trust with my clients.","p":"Families, couples, travelers who want resort calm on Mykonos","st":"Cliffside resort with a private beach","r":"New for 2026, Mykonos","vis":"Visited June 2026","fh":1,"so":[["Spacious Deluxe Sea-View Rooms.","The entry-level category is around 500 square feet with sea views, and big enough for a family of three without jumping to a suite."],["A private beach on Kalo Livadi Bay.","Beach days without the beach-club scramble, with the south coast’s energy close by when you want it."],["Two infinity pools and a kids club.","Both pools face the Aegean, and the Four Seasons kids club gives the kids their own program while you enjoy the beach."],["A spa set among gardens.","Four single treatment rooms and three couples’ suites, including a private VIP suite and an open-air pavilion, plus a sauna, a vitality pool, a spa garden, a fitness studio and a yoga pavilion."]],"k":[["It’s about 20 minutes from Mykonos Town.","That’s the trade for a private beach and a quieter setting. I arrange drivers for dinners in Chora."],["Families, start here.","Few Mykonos hotels fit a family this well, from the room sizes and the kids club to the villas. Tell me the kids’ ages and I’ll match you to the right room or villa."],["Comparing the south coast?","Fouquet’s is the more energetic choice near Paraga and Scorpios, and Kalesma sits above Ornos Bay, close to everything."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, private boat days along the south coast or to Delos, and private boat transfers to Paros or Naxos instead of the ferry."]],"img":"img/four-seasons-mykonos.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-mykonos.html"},{"s":"four-seasons-napa-valley","n":"Four Seasons Napa Valley","c":"Napa & Sonoma","a":"Napa Valley","w":"Calistoga, Napa Valley","v":"It's a great property that lends itself to a large swath of people.","p":"Families, girls trips, couples, groups","st":"Vineyard resort","r":"#02 in my Napa & Sonoma ranking","vis":"","fh":0,"so":[["Service at Four Seasons standard.","Genuinely what separates it from the hotels below it, and consistent across every stay I've had."],["A Michelin star on property.","The one-star restaurant is fantastic, and the pool bar is a favorite in its own right."],["The architecture.","Dark moody rooms or bright white farmhouse styles, set within a working vineyard."],["It fits almost everyone.","Families, couples, girls trips, and groups all genuinely work here, which is rare at this level."]],"k":[["Request an upper floor if shower privacy matters.","Some ground-floor outdoor showers face the pathways. That's easy to handle at booking, just tell me."],["Calistoga is the far end of the valley.","Beautiful, quieter, and a longer drive from the southern wineries, so plan tastings accordingly."],["Watch for the free-night offers.","Third or fourth night free shows up through preferred partner channels, and it changes the math on longer stays."]],"img":"img/four-seasons-napa-valley.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-napa-valley.html"},{"s":"four-seasons-punta-mita","n":"Four Seasons Resort Punta Mita","c":"Mexico","a":"Punta Mita","w":"Punta Mita, Mexico","v":"The resort that makes multigenerational trips easy. In my practice, that's among the highest compliments there is.","p":"Multigenerational trips, families, golfers","st":"Family luxury resort (Four Seasons)","r":"Featured · my Riviera Nayarit shortlist","vis":"","fh":0,"so":[["Two beaches, two golf courses.","The raw inventory that lets a big group split up all day and reunite at dinner."],["The consistency.","The Four Seasons trait I lean on hardest when three generations share one itinerary."],["Surf mornings at Punta Mita.","Private coaching on gentle breaks, back in time for lunch. It's the signature experience I attach here."]],"k":[["It's the dependable one.","Design-first couples will be more excited by Mandarina up the coast. This property's strength is dependability."],["Same peninsula, quieter neighbor.","The St. Regis Punta Mita is the more residential, butler-serviced base nearby. Ask me which fits your group."],["Whale season applies here too.","December through April, humpbacks calve in these waters, and a private boat beats the crowds every time."]],"img":"img/four-seasons-punta-mita.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-punta-mita.html"},{"s":"four-seasons-safari-lodge-serengeti","n":"Four Seasons Safari Lodge Serengeti","c":"Africa","a":"Tanzania","w":"Serengeti, Tanzania","v":"The most comfortable, family-friendly entry point into the Serengeti. It's the safari I book when the whole family is coming.","p":"First safaris, families, multigenerational groups","st":"Safari lodge (Four Seasons)","r":"Featured · my safari shortlist","vis":"","fh":0,"so":[["The year-round waterhole.","Elephants at the waterhole while you're at the pool. The game viewing is built into the architecture."],["Real resort infrastructure.","Spa, two pools, fitness. Traditional camps simply don't have these."],["The multigenerational solve.","The safari property I recommend when the group spans ages seven to seventy."]],"k":[["It's a lodge rather than a bush camp.","Travelers chasing canvas-and-campfire romance should weigh my Kenya picks, Angama Mara and Sanctuary Olonana."],["Book 9–12 months out.","Safari inventory is the tightest I work with, so the calendar is the strategy."],["Pair it with the coast.","Serengeti plus beach. The Serengeti-to-Indian-Ocean finish is a structure I build often."]],"img":"img/four-seasons-safari-lodge-serengeti.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-safari-lodge-serengeti.html"},{"s":"four-seasons-tamarindo","n":"Four Seasons Resort Tamarindo","c":"Mexico","a":"Costalegre","w":"Costalegre, Mexico","v":"A 3,000-acre private reserve on the Costalegre coast, with dramatic clifftop pools, protected wilderness, and barely another soul in sight.","p":"Design lovers, privacy seekers, repeat Mexico travelers","st":"Secluded reserve resort","r":"Featured · my Pacific coast shortlist →","vis":"","fh":0,"so":[],"k":[],"img":"img/four-seasons-tamarindo.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-tamarindo.html"},{"s":"gardena-grodnerhof-ortisei","n":"Gardena Grödnerhof","c":"Italy","a":"Dolomites","w":"Ortisei, Val Gardena, Dolomites, Italy","v":"The best base in the Dolomites, and a close second to Forestis for me: a beautifully renovated, well-rounded hotel in the best town for restaurants and hiking. Book a Superior Deluxe or above, and come outside of July and August.","p":"Couples, families, hikers and skiers who want a town on the doorstep","st":"Renovated alpine grand hotel with a serious spa","r":"","vis":"Stayed October 2026","fh":1,"so":[["The location.","Right in Ortisei, with restaurants on foot and lifts to two completely different hiking areas: Seceda for the dramatic peaks of Val Gardena, and the gondola to the Alpe di Siusi for the high meadows."],["The renovation.","Everything from the Superior Deluxe category up has been beautifully redone, and the original building has been restored so well you’d never guess its age. It’s my pick for the best design in the Dolomites."],["The spa and gym.","An incredible spa and a genuinely great gym, which ties with Aman Rosa Alpina’s for the best in the Dolomites, which is rare in a town hotel."],["The service.","Warm, polished and consistent across the whole stay."]],"k":[["Book a Superior Deluxe or above.","The Superior and Comfort rooms keep the hotel’s original charm. They’re spacious, with balconies or terraces, and nice in their own right, but the renovated rooms from Superior Deluxe up are the reason to stay here, and they’re what I book."],["Avoid peak summer if you want quiet.","Ortisei is a busy town in July and August. Spring, early summer, September and October are when it shines."],["Seceda needs a plan.","The Seceda lift is busy and needs a time-slotted ticket bought in advance; in summer I imagine it can be an awful experience. You can reach the same area via the Col Raiser lift from Santa Cristina, about 10 minutes away by car or transfer. Better still is a private guide who knows when and where to go, which I arrange."],["Expect German and Austrian sauna culture.","The main sauna areas are mixed, men and women together. You’ll walk around the spa in a towel or robe, but swimsuits and wraps come off in the saunas and steam rooms. Your body isn’t supposed to touch the wood, so you sit or lie on your towel in the saunas, and on a small towel in the steam rooms. It’s completely normal in this corner of Italy; the pools are swimsuit areas."]],"img":"img/gardena-grodnerhof-ortisei.jpg","u":"https://suiteswithkeith.com/hotels/gardena-grodnerhof-ortisei.html"},{"s":"grace-santorini","n":"Grace Hotel Santorini","c":"Greece","a":"Santorini","w":"Santorini, Greece","v":"A genuinely beautiful property. At current rates I usually find stronger value elsewhere on the island, but when pricing aligns, Grace absolutely belongs in the conversation.","p":"Honeymooners comfortable outside Oia","st":"Caldera boutique","r":"#07 in my Santorini ranking","vis":"Visited June 2026","fh":1,"so":[["Above the fog line.","The Imerovigli elevation gives Grace a caldera perspective no Oia hotel can match. On the right morning it's otherworldly."],["Bright, elegant rooms.","Simple and white, and surprisingly luminous for a caldera property. Many Santorini rooms run dark; these don't."],["Exceptional dining.","Michelin-starred chef Lefteris Lazarou personally visits tables. The food is distinctly Greek, yet modern."],["A honeymoon feel without Oia's foot traffic.","For couples happy to trade the Oia postcard for altitude and quiet, the setting delivers."]],"k":[["Room selection matters here.","Some rooms sit along the Fira-to-Oia walking path. Book through me and I'll make sure yours is one of the secluded ones."],["Choose the outdoor water features.","Between Grace's top categories, I'd guide you to the outdoor plunge-pool rooms over the indoor hot tub suites. Ask me and I'll explain the trade-offs for your dates."],["Compare before committing.","At this rate level, it's worth weighing Grace against my top five in the Santorini ranking. Sometimes it wins, and I'll tell you when it does."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, and private boats: a sunset cruise on the caldera, or private boat transfers to Folegandros, Milos or Ios instead of the ferry."]],"img":"img/grace-santorini.jpg","u":"https://suiteswithkeith.com/hotels/grace-santorini.html"},{"s":"grand-hotel-miramare-santa-margherita","n":"Grand Hotel Miramare","c":"Italy","a":"More Italy","w":"Santa Margherita Ligure, Italy","v":"The real Italian Riviera: a beautifully restored grand hotel among Italian families, at about half the price of the Splendido.","p":"Honeymooners, couples who want a real Italian beach town, families, anyone weighing the Splendido","st":"Restored Belle Époque grand hotel, since 1904 (Virtuoso)","r":"","vis":"Visited October 2026","fh":1,"so":[["You’re vacationing with Italians.","Santa Margherita is where Milan goes to the sea. Restaurants, bars and the beach are full of Italian families rather than tour groups. It's the real coastal Italy people are looking for and rarely find."],["A renovation that kept the soul.","The restored rooms are beautiful, and they still feel Italian and historic rather than generically modern. The remaining rooms are set to be finished by next summer."],["The beach club.","One of the largest beach clubs in Liguria, being restored for next summer. You can swim right off the beach or off the platforms. It’s open to the public, but in practice that means local Milanese families who have kept the same cabanas for generations. I think that’s a plus: you’re at the beach with real Italians."],["A building that still follows its original plan.","In the early 20th century, the noble families lived on the lower floors and the servants lived on the upper ones. The structure can’t be changed, so it still works that way: the lower floors have the larger rooms with real outdoor terraces, and rooms get smaller as you go up."]],"k":[["The floor you’re on matters more than the room name. Ask me before you book.","The hotel’s ground floor sits a full level above the street, and its “first floor” is higher again. So even the lowest rooms have a true sea view, and the floor numbers don’t mean what an American would expect. If you want space and a large outdoor terrace, the lower floors are the smart choice, because that’s where the noble families once lived. The upper floors are smaller, and the newest top floor, added after a fire, wasn’t allowed balconies at all. The exception is a couple of signature suites, including the one with a wraparound balcony I stayed in. Reach out and I’ll walk you through it and put you in the right room."],["Book the sea view if you can.","It’s the one I’d always recommend. If the sea view doesn’t fit the budget or the dates, the garden-view rooms are quiet, private and still a lovely stay."],["It works very well for families.","Certain suites can be combined behind one closed door, so you get two proper suites as one private unit. Some rooms with a sofa bed take up to three adults, or two adults and two children under 10."],["The beach club is open to the public.","Don’t let that put you off. In practice it means Italian families who have had their cabanas for generations. It’s part of what makes a stay here feel real."]],"img":"img/grand-hotel-miramare-santa-margherita.jpg","u":"https://suiteswithkeith.com/hotels/grand-hotel-miramare-santa-margherita.html"},{"s":"grand-hotel-timeo-taormina","n":"Grand Hotel Timeo","c":"Italy","a":"More Italy","w":"Taormina, Sicily, Italy","v":"Etna views and old-world service. It's the honeymoon for couples who want their romance with a sense of history.","p":"Honeymoons, classicists, Sicily first-timers","st":"Old-world grande dame (Belmond)","r":"#08 in The Fifteen, my honeymoon shortlist","vis":"Visited October 2026","fh":1,"so":[["The Etna view.","The volcano across the bay from your terrace. That's the single image that put the Timeo on The Fifteen."],["Old-world service.","A century and a half of practice, in the polished, unhurried style that's getting rarer every year."],["The theatre next door.","Taormina's ancient Greek theatre is literally beside the hotel. It's the town's best address by any measure."]],"k":[["Taormina is on a hill, and so is the hotel.","Steps and slopes come with the territory, so flag any mobility concerns and I'll plan the details."],["Sister property on the sea.","Belmond's Villa Sant'Andrea sits on the bay below with a private beach. Pairing the two makes the ideal Taormina week."],["Sicily rewards a longer itinerary.","The Timeo anchors the east coast beautifully, and I often build it into a fuller Sicily route."],["Transfers and drivers, arranged.","I arrange the private transfer from Catania airport, about an hour, and drivers or guides for Etna, Siracusa and the coast."]],"img":"img/grand-hotel-timeo-taormina.jpg","u":"https://suiteswithkeith.com/hotels/grand-hotel-timeo-taormina.html"},{"s":"grand-hotel-tremezzo-lake-como","n":"Grand Hotel Tremezzo","c":"Italy","a":"Lake Como","w":"Tremezzo, Lake Como, Italy","v":"Just a fun hotel. Book a lake-view junior suite, spend your afternoons at the garden pool, and know you’ll be sharing it with a crowd.","p":"Families, first trips to the lake, couples who like a buzz","st":"Art Nouveau grand hotel","r":"#01 in my Lake Como hotels ranking","vis":"Toured October 2026","fh":1,"so":[["The welcome.","The valets were fun and helpful, and the whole place has a playful, colorful energy you don’t find at the lake’s more formal hotels."],["The tiered gardens and their pool.","Stunning, and my favorite pool on the property. There’s also a pool floating on the lake, but I’m not a fan of those: they rock with the water and can make you queasy."],["The lake-view junior suites.","Spacious, beautifully restored, with balconies and gorgeous bathrooms. You feel like you’re right on top of the lake."],["Five restaurants and a clay court.","Lots of different concepts and corners to explore, so you’re never stuck eating in the same place twice."]],"k":[["Book a junior suite or above.","Garden-view rooms look out on pretty gardens and cost less, but the stars are the junior suites and above with lake views and balconies. The hotel recently reworked its rooms to add more of them, which was a smart move."],["It’s busy.","Outside guests are welcome and come in large numbers, and it’s a magnet for photos. If privacy matters most, look at Il Sereno or Passalacqua."],["Great for families, but mind the stairs.","It’s much better suited to families than the lake’s intimate villas, but the property is built into the hillside and there are a lot of stairs."],["Service is relaxed.","I had lunch at the restaurant closest to the lobby. Service was solid, neither overly formal nor overly attentive, which suits the hotel’s easygoing mood."]],"img":"img/grand-hotel-tremezzo-lake-como.jpg","u":"https://suiteswithkeith.com/hotels/grand-hotel-tremezzo-lake-como.html"},{"s":"gstaad-palace","n":"Gstaad Palace","c":"Switzerland","a":"Switzerland","w":"Gstaad, Switzerland","v":"Chalet-side clay the pro tour visits every year. If you take your tennis seriously, the Palace takes it just as seriously.","p":"Tennis travelers, summer alpine trips, family tradition","st":"Alpine palace hotel (Fora Reserve)","r":"#07 in my hotel tennis court ranking","vis":"","fh":0,"so":[["Courts the pro tour plays.","Chalet-side clay hosting an annual tour stop. You hit on the same surface the professionals do, with the Alps as the fence line."],["A true palace, family-run.","Over a century of the same standard, and the building that defines Gstaad's skyline."],["Summer in the Alps.","Meadow hiking, tournament week, and alpine light. It's the season Gstaad insiders actually prefer."]],"k":[["Time it to the tournament, or around it.","Tour week is electric and books solid; the weeks either side give you the courts and the calm. Tell me which energy you want."],["Winter is a different trip.","The Palace runs a full ski season too. Same address, entirely different rhythm."],["Pair it with Lake Lucerne.","Bürgenstock is the other Swiss court on my list, and together they make Switzerland's best tennis itinerary."]],"img":"img/gstaad-palace.jpg","u":"https://suiteswithkeith.com/hotels/gstaad-palace.html"},{"s":"gundari-folegandros","n":"Gundari","c":"Greece","a":"Folegandros","w":"Folegandros, Greece","v":"Folegandros is a fantastic island, and Gundari makes it even more special. Wow.","p":"Honeymoons, anniversaries, remote luxury","st":"Design-led clifftop resort","r":"#02 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["The coolest infinity pool in the Cyclades.","Without a doubt. It's cantilevered toward open sea, with nothing between you and the horizon."],["The spa and gym punch far above the room count.","Both were fantastic, which is rare for a property this remote."],["The outdoor shower overlooking the Aegean.","A small thing that captures how deliberately this place was designed."],["A team that listens.","When my clients flag anything at all, the team responds with genuine gratitude and speed. That's the kind of ownership mentality you hope for at this level."]],"k":[["Give it three nights.","Gundari and Folegandros really need three. If it's booked and you can only do two, I'd still go."],["It pairs perfectly with Santorini.","Folegandros is right next door, making Gundari an easy add-on for a honeymoon or anniversary trip."],["Getting there takes intent.","Ferry via a less-frequent line, or helicopter charter direct to the property. Plan the crossing before you fall in love with the dates."],["Private boats, arranged.","Instead of the ferry, I arrange private boat transfers from Santorini, about 45 minutes, or a helicopter straight to the hotel."]],"img":"img/gundari-folegandros.jpg","u":"https://suiteswithkeith.com/hotels/gundari-folegandros.html"},{"s":"hassler-roma","n":"Hotel Hassler Roma","c":"Italy","a":"Rome","w":"Rome, Italy","v":"A very nice, very traditional luxury hotel right above the Spanish Steps, with Michelin-starred dining on the roof and a beautiful courtyard restaurant. Just know the area is busy, and the new wellness and gym area won’t open until 2027.","p":"Travelers who love classic, traditional luxury and want to be at the heart of the action","st":"Traditional grand hotel","r":"Traditional luxury above the Spanish Steps","vis":"Visited October 2026","fh":1,"so":[["Right above the Spanish Steps.","You can’t get much more iconic, or more central."],["Michelin-starred dining on the roof.","With the rooftops of Rome laid out below you."],["The courtyard restaurant.","Beautiful, and a calmer place to eat than the streets outside."],["A very traditional hotel.","Classic luxury, for travelers who want Rome’s grand-hotel style."]],"k":[["It’s a busy area.","The Steps draw crowds from morning to night. If you want quiet, the Eden is a few minutes away on a calm residential street."],["Wellness is coming in 2027.","The Hassler is building a large new wellness and gym area that opens in 2027. Until then, if a spa and gym matter, look at the Bulgari or the Corinthia."],["Compare the rest of Rome.","The de Russie for the garden, La Minerva for a real Roman neighborhood and the St. Regis for spectacle."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/hassler-roma.jpg","u":"https://suiteswithkeith.com/hotels/hassler-roma.html"},{"s":"hotel-barriere-fouquets-paris","n":"Hôtel Barrière Fouquet's Paris","c":"France","a":"Paris","w":"Paris, France","v":"Value and buzz: a true palace with a private-club feel, at the sharpest price of the five I compare.","p":"Value-smart palace stays, younger energy, spa lovers","st":"Glamorous modern palace (Barrière)","r":"Featured on my Paris collection","vis":"","fh":0,"so":[["The best-priced palace on my list.","In my proposal's five-palace comparison, Fouquet's opens thousands below the field, with palace hardware throughout."],["One of the city's best spas.","My featured page's claim, and a real differentiator among the palaces."],["The private-club energy.","Younger, more glamorous, more social. It's the palace for travelers who find the grande dames hushed."]],"k":[["Value here doesn't mean compromise.","The 37-square-meter base Superior outsizes most palace entry rooms. You save money without getting a lesser room."],["The Champs-Élysées is lively.","That's the appeal. For hushed classicism, Le Meurice is my list's other pole."],["Watch the rate terms.","The sharpest Fouquet's pricing can carry stricter conditions, and my Paris proposal shows how I present the trade-off."]],"img":"img/hotel-barriere-fouquets-paris.jpg","u":"https://suiteswithkeith.com/hotels/hotel-barriere-fouquets-paris.html"},{"s":"hotel-cap-estel-eze","n":"Hotel Cap Estel","c":"France","a":"French Riviera","w":"Èze, France","v":"A pool jutting into the sea on its own private peninsula. On a coastline this famous, that kind of privacy is the real luxury.","p":"Privacy seekers, couples, Riviera connoisseurs","st":"Private peninsula hideaway","r":"#05 in my Top Hotel Pools","vis":"","fh":0,"so":[["The pool on the peninsula.","Jutting into the sea with water on both sides. It's #05 on my worldwide list, and unlike anything else on the Riviera."],["The privacy.","A gated peninsula all to itself between Nice and Monaco, and the rare Riviera address where nobody is watching."],["The positioning.","Èze's medieval village above you, Monaco and Nice each a short drive away. It's a perfect base for the whole coast."]],"k":[["Small means small.","An intimate room count is the charm, and the reason peak-summer dates disappear early."],["Compare against the Eden-Roc.","The other French Riviera pool on my list is the legendary Hôtel du Cap-Eden-Roc. Icon versus hideaway is the real choice, and I'm happy to talk you through it."],["It pairs beautifully.","Èze splits perfectly with Provence, Monaco's Grand Prix calendar, or an Italy add-on across the border."]],"img":"img/hotel-cap-estel-eze.jpg","u":"https://suiteswithkeith.com/hotels/hotel-cap-estel-eze.html"},{"s":"hotel-cipriani-venice","n":"Hotel Cipriani","c":"Italy","a":"Venice","w":"Venice, Italy","v":"The quiet side of Venice. The largest pool in the city, real gardens and a clay court, five minutes by boat from San Marco, now with a Peter Marino redesign and a Dior Spa.","p":"Couples and discreet travelers who want a quiet base, families who want a pool, tennis travelers, Belmond loyalists","st":"Venetian legend (Belmond, Fora Reserve)","r":"#02 in my hotel tennis court ranking","vis":"","fh":0,"so":[],"k":[["It is seasonal.","The Cipriani closes for winter. Belmond currently lists 1 June 2027 as the reopening. July and August sell first, so book early, or look at September for softer crowds and the best lagoon light."],["You are across the lagoon, on purpose.","The boat makes it easy, but if you want to step out your door into the streets of Venice, look at Aman Venice or the Danieli. The distance is also the whole advantage."],["Water taxis, arranged.","About 30 minutes by water taxi from Marco Polo airport and 20 minutes from Santa Lucia station. I arrange the private boat straight to the hotel dock, plus boats to Murano, Burano and Torcello."],["Belmond travels well.","It pairs naturally with the Splendido in Portofino or the Caruso in Ravello for a full Belmond Italy trip. Or arrive the classic way, on the Venice Simplon-Orient-Express."]],"img":"img/hotel-cipriani-venice.jpg","u":"https://suiteswithkeith.com/hotels/hotel-cipriani-venice.html"},{"s":"hotel-de-crillon-paris","n":"Hôtel de Crillon, A Rosewood Hotel","c":"France","a":"Paris","w":"Paris, France","v":"A landmark stay, with Paris history under Rosewood's hand, the city's most beautiful pool and my list's best combined perks.","p":"Landmark stays, celebrations, pool and spa lovers","st":"Storied palace (Rosewood, Forbes Five-Star)","r":"Featured on my Paris collection","vis":"","fh":0,"so":[["The landmark itself.","An 18th-century monument on Place de la Concorde, and the most storied address of any Paris palace."],["One of the city's most beautiful pools.","The mosaic-lined pool is worth planning an afternoon around. My featured page singles it out."],["Grand without stuffiness.","Rosewood's art-filled rebirth. Glamour that doesn't require whispering."],["The Rosewood program.","4th night free plus a confirmed one-category upgrade at booking. It's the strongest combined offer on my Paris list."]],"k":[["Size up from the base room.","With a confirmed upgrade in play, booking one category higher compounds the benefit. That's exactly the strategy in my Paris proposal."],["Concorde is grand-boulevard Paris.","Monumental and central, steps to the Tuileries and a short stroll to the Champs-Élysées."],["Compare the five palaces properly.","Crillon, Le Meurice, the Peninsula and Fouquet's each fit a different couple, and my proposal shows how I frame the choice."]],"img":"img/hotel-de-crillon-paris.jpg","u":"https://suiteswithkeith.com/hotels/hotel-de-crillon-paris.html"},{"s":"hotel-de-la-ville-rome","n":"Hotel de la Ville","c":"Italy","a":"Rome","w":"Rome, Italy","v":"Nice, with a great rooftop and a spot at the top of the Spanish Steps. But if you’re choosing between the Rocco Forte hotels in Rome, I prefer its sister, the de Russie.","p":"Travelers who want the Spanish Steps on the doorstep and a rooftop for sunset drinks","st":"Colorful Roman palazzo (Rocco Forte)","r":"Nice, but I prefer its sister, the de Russie","vis":"Visited October 2026","fh":1,"so":[["Cielo on the roof.","A rooftop bar and restaurant across the top two floors, with views across Rome’s skyline."],["The courtyard.","Mosaico, the main restaurant, opens onto it."],["Colorful, very Roman interiors.","Designed by Tommaso Ziffer, with yellow walls, engravings, plaster reliefs and black and white floors."],["A Sicilian-inspired spa.","Plus the Julep cocktail bar for an evening drink."]],"k":[["I prefer the de Russie.","Same family, a few minutes away. The de Russie’s large courtyard, renovated rooms and spa with an indoor pool made it the stronger stay for me."],["It’s a busy area.","The top of the Spanish Steps is crowded from morning to night. For quiet, the Eden is a short walk away on a calm residential street."],["Compare the rest of Rome.","The Hassler next door for tradition, the Bulgari for big rooms and energy, and Casa Monti for something younger and more fun."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/hotel-de-la-ville-rome.jpg","u":"https://suiteswithkeith.com/hotels/hotel-de-la-ville-rome.html"},{"s":"hotel-de-russie-rome","n":"Hotel de Russie","c":"Italy","a":"Rome","w":"Rome, Italy","v":"I loved it. A beautiful, large courtyard that’s the star of the property, renovated rooms with lemon and orange ceilings, a spa with an indoor pool, and a stunning suite with fantastic views. I prefer it to its sister, the de la Ville.","p":"Couples, Rome first-timers, travelers who want a spa and a beautiful courtyard in the center of Rome","st":"Garden retreat (Rocco Forte)","r":"Featured on my Italy collection","vis":"Visited October 2026","fh":1,"so":[["The courtyard.","Beautiful and large, and really the star of the property."],["Renovated rooms with the cutest ceilings.","Each one is either lemon or orange themed."],["A nice spa with an indoor pool.","Rare in the centro storico, and a real draw after a day on foot."],["A stunning suite.","With fantastic views. Ask me and I’ll tell you which one."]],"k":[["I prefer it to its sister, the de la Ville.","Both the de la Ville and the de Russie are Rocco Forte hotels near the Spanish Steps. For me the de Russie is the stronger stay, and the courtyard is a big part of why."],["The street out front is busy.","Step outside and you’re in the crowds between Popolo and the Steps. For a quiet street, the Eden, my top overall pick in Rome, is the one."],["Compare the rest of Rome.","The Bulgari for big rooms and energy, the Hassler for tradition above the Steps, La Minerva for a real Roman neighborhood and the St. Regis for spectacle."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/hotel-de-russie-rome.jpg","u":"https://suiteswithkeith.com/hotels/hotel-de-russie-rome.html"},{"s":"hotel-du-cap-eden-roc-antibes","n":"Hôtel du Cap-Eden-Roc","c":"France","a":"French Riviera","w":"Cap d'Antibes, France","v":"Two of my worldwide lists, one hotel. When the trip is a milestone, the Eden-Roc is my Riviera answer.","p":"Milestone trips, Riviera classicists, tennis travelers","st":"Legendary Riviera grande dame","r":"#10 in my Top Hotel Pools","vis":"","fh":0,"so":[["The legendary pool.","Blasted into the cliffs above the Mediterranean. It's one of the most famous swims on earth, and it earns the reputation."],["Clay courts tucked into the pines.","Just steps from the Mediterranean below. It's #10 on my hotel tennis ranking, and a morning ritual worth building the day around."],["The full estate.","Gardens, the walk down to the rocks, the cabanas. This is the complete grande-dame Riviera experience."]],"k":[["This is a milestone booking.","Rates match the legend. It's the property I recommend when the occasion genuinely calls for it: anniversaries, honeymoons, the big birthday."],["Cabanas and courts need reserving.","The famous spots around the pool and the tennis calendar both fill, so I handle those requests when I confirm the room."],["Want the Riviera with more seclusion?","The other French entry on my pools list, Cap Estel, trades the legend for a private peninsula. It's a comparison worth making."]],"img":"img/hotel-du-cap-eden-roc-antibes.jpg","u":"https://suiteswithkeith.com/hotels/hotel-du-cap-eden-roc-antibes.html"},{"s":"hotel-eden-rome","n":"Hotel Eden","c":"Italy","a":"Rome","w":"Rome, Italy","v":"My top overall pick in Rome, and one of my top three stays in all of Italy. Warmer service, quieter streets and a slightly lower rate than its rivals.","p":"Couples, anniversaries, travelers who want quiet in the middle of Rome","st":"Romantic classic (Dorchester Collection)","r":"My top overall pick in Rome","vis":"Stayed October 2026","fh":1,"so":[["The fastest coffee I’ve ever had delivered.","Out of all my stays in Italy, and maybe all my stays ever. It sounds small, but it tells you everything about how this team runs."],["Service that anticipates.","Warm, personal and a step ahead the whole time. The concierge sorted my dinner reservations without any back and forth."],["Rooms that are modern and traditional at once.","Beautifully decorated, bright, with incredible views over the rooftops."],["The restaurant upstairs.","Fantastic service, and the view across the domes is the one I send couples to on their first evening in Rome."]],"k":[["The top suites can be connected.","They’re spacious on their own, and they can be combined into larger configurations for families or two couples traveling together. Ask me and I’ll map out what’s possible."],["It costs slightly less than its rivals.","Usually a little below the Hassler, the de Russie and the Bulgari, for a stay I’d rank above them. I’ll quote them side by side if you want to see it."],["Who it suits best.","Almost everyone, and couples especially. If you’re younger and want the energy of a real Roman neighborhood, look at La Minerva by the Pantheon."],["Compare the rest of Rome.","The de Russie for the garden, the St. Regis for spectacle, and the new Corinthia, which blew me away. My featured page puts them side by side."]],"img":"img/hotel-eden-rome.jpg","u":"https://suiteswithkeith.com/hotels/hotel-eden-rome.html"},{"s":"hotel-lungarno-florence","n":"Hotel Lungarno","c":"Italy","a":"Florence","w":"Florence, Italy","v":"Ponte Vecchio views, steps from everything. The Florence hotel for travelers who came to be in Florence.","p":"First-time Florence visitors, couples, walkers","st":"Riverside boutique (Lungarno Collection)","r":"Featured on my Italy collection","vis":"Visited October 2026","fh":1,"so":[["Rooms hanging over the Arno.","The Ponte Vecchio framed in your window. These are the best river views of any Florence hotel."],["Steps from everything.","The rare luxury base where every major sight is a walk. No cars, no shuttles, no logistics."],["The nautical-chic character.","Ferragamo-family style and a real art collection give it more boutique personality than palazzo formality."]],"k":[["Book the river view specifically.","The Arno-facing rooms are the entire point, so I confirm the room category as well as the hotel."],["Boutique scale, boutique facilities.","No resort pool or garden here. For that, it's the Four Seasons Firenze. The city is the amenity."],["The Oltrarno side is the right side.","Quieter at night, better at aperitivo hour, and still two minutes from the bridge."],["Transfers and drivers, arranged.","I arrange private transfers from Florence’s airport or Santa Maria Novella station, and drivers for days in Chianti, Siena or the Val d’Orcia, so nobody has to navigate Tuscan back roads or park in a hill town."]],"img":"img/hotel-lungarno-florence.jpg","u":"https://suiteswithkeith.com/hotels/hotel-lungarno-florence.html"},{"s":"hotel-santa-caterina-amalfi","n":"Hotel Santa Caterina","c":"Italy","a":"Amalfi Coast","w":"Amalfi, Amalfi Coast","v":"The kind of hotel where you feel like a guest in someone’s home. It has been here for a while, and it knows exactly what it’s doing.","p":"Slow stays, multigenerational trips, anyone who values real human service","st":"","r":"","vis":"Visited October 2026","fh":1,"so":[["A family hotel for four generations.","Opened as six rooms by the town doctor of Amalfi, and still run by his granddaughters, Giusi and Carmela “Ninni” Gambardella, with Giusi and Carmela’s children, the fourth generation, alongside them."],["An owner who is still in it.","When I sat down with Signora Giusi she had just been looking at competitors’ rates to close out the season. She remembered a client of mine down to the room numbers."],["A team that stays.","So many of the people I met have been here 15 to 20 years or more. Giusi and Carmela are like their grandmothers or second mothers, and you feel it."],["Quiet luxury.","Understated and in the tiny details. Even the in-room handouts that could feel dated feel exactly right here."]],"k":[["Book a front sea view.","Every category I book faces the sea head-on: the Special Suites, the Full Sea View Garden Suites, the front sea view Junior Suites and the upper-floor Front Sea View Doubles. I can also request room 45, where I stayed."],["Stay at least five nights.","This is a hotel to slow down in. I would go back for five nights minimum."],["Stairs one way, elevator the other.","Walk down through the gardens to the beach club at least once. And when you do take the elevator down, be ready for the coolest view you have ever seen on the way to the beach."],["Expect to use the phone.","If you want to message the hotel on WhatsApp, this is not that place. Pick up the phone and dial 260. That is part of the charm."]],"img":"img/hotel-santa-caterina-amalfi.jpg","u":"https://suiteswithkeith.com/hotels/hotel-santa-caterina-amalfi.html"},{"s":"il-borro-tuscany","n":"Il Borro","c":"Italy","a":"Tuscany","w":"Valdarno, Tuscany, Italy","v":"A whole medieval borgo turned hotel. It's very authentic Tuscany, and for honeymooners, the original village is the place to sleep.","p":"Honeymooners in the original borgo, travelers who want a more modern room nearby, anyone after an authentic Tuscany","st":"Restored medieval borgo and estate (Relais & Châteaux, Fora Reserve)","r":"","vis":"Visited October 2026","fh":1,"so":[["A real medieval village.","Stone houses, narrow lanes and a church on a wooded ridge. This is the original borgo, not a reconstruction or a resort built to look like one."],["The Sveti Stefan layout.","Like Aman Sveti Stefan, the whole village is the hotel. You walk out of your room and into the borgo."],["The honeymoon stay.","Rooms inside the original borgo are the ones to book for a honeymoon. They're atmospheric, private and steps from dinner."],["Rooms for families, down the road.","More rooms about a three-minute drive from the village, with their own restaurant and pool. More modern, much more accessible and better suited to families, with the borgo on the doorstep."]],"k":[["Pick your stay before you pick your dates.","Honeymooners and couples chasing atmosphere should be in the original borgo; families, and anyone who wants a more modern, accessible room, should look at the rooms about three minutes away by car, which have their own restaurant and pool. Tell me which sounds like you and I’ll match the room."],["You’ll want a car (or a driver).","Il Borro sits in the countryside between Florence and Arezzo, so it pairs easily with a few nights in the city. I arrange drivers who know the back roads, and can link it with my other Tuscany estates."],["Three borghi, three different travelers.","Borgo Pignano, Borgo San Felice and Il Borro all offer a different stay for a different traveler, and all three are fantastic. Tell me who’s coming and what you want from Tuscany, and I’ll tell you which one is yours. Here are my side-by-sides: Borgo San Felice or Il Borro and Borgo Pignano or Il Borro. Or see all three side by side."],["Stay longer than one night.","The borgo rewards slowing down. Plan for at least two or three nights so you actually live in the village rather than pass through it."]],"img":"img/il-borro-tuscany.jpg","u":"https://suiteswithkeith.com/hotels/il-borro-tuscany.html"},{"s":"il-san-pietro-di-positano","n":"Il San Pietro di Positano","c":"Italy","a":"Amalfi Coast","w":"Positano, Amalfi Coast","v":"The classic, done properly. For me, one of the two best options in Positano, alongside Villa Treville.","p":"Honeymoons, tennis travelers, and fall trips when afternoon sun matters","st":"","r":"","vis":"Visited October 2026","fh":1,"so":[["The sunset beach club.","It sits on the sunset side, so you get sun on the water late into the afternoon while most of the coast is already in shade."],["A sea view from every room.","Some face the sunrise, some face the sunset. You choose, and I request it."],["The tennis court.","Iconic, of course, and #1 in my hotel tennis court ranking."],["Privacy.","No one can look down on you. People can look up toward your room, but the whole property is very private, so the only people you see are other guests."]],"k":[["Sunrise or sunset: tell me.","Rooms face one or the other. Sunsets are hard to find on the Amalfi Coast, so if that matters to you, say so up front and I will request the right side."],["Base rooms are fantastic.","If you want more space, go Signature or Prestige."],["Come in the fall.","It is the best time to visit the coast, and it is when the sunset-side beach club really pays off: most hotels lose the sun on the water by 4:30 or 5pm."],["Peak season sells out far ahead.","This is one of the hardest confirmations on the coast, so the earlier we start, the better."]],"img":"img/il-san-pietro-di-positano.jpg","u":"https://suiteswithkeith.com/hotels/il-san-pietro-di-positano.html"},{"s":"il-sereno-lake-como","n":"Il Sereno","c":"Italy","a":"Lake Como","w":"Torno, Lake Como, Italy","v":"The best true lakefront hotel on Lake Como. I stayed in October 2026 and couldn’t find a single fault. Book it if you want privacy, design and the water right outside your room.","p":"Couples, honeymoons, design lovers, anyone who wants privacy","st":"Modern lakefront design hotel","r":"#02 in my Lake Como hotels ranking","vis":"Stayed October 2026","fh":1,"so":[["The best true lakefront hotel on the lake.","The building sits right on the water and every room looks at the lake, which is rarer on Como than you’d think."],["The heated pool.","Built on land just above the water, so it never rocks with boat wakes the way Como’s floating pools do, and the poolside service is excellent."],["The hot tub in the old boathouse.","Book it privately, by the hour. It’s one of the most romantic hours you can have on the lake."],["Its own fleet of Rivas.","The dock is the front door. Bellagio, Como and dinners across the lake are a boat ride away."]],"k":[["The magic starts at the Grand Suite.","Every room sees the lake, but entry rooms get a partial view, some through the trees. The Grand Suite Lago adds the head-on view and a private terrace, and it starts at about what an entry room costs at Passalacqua. The Garden Lake View Suite is larger but sees the lake at an angle, and my Lake Como proposal breaks down both."],["Modern is the point.","If your Como dream is frescoes and history, that's Villa d'Este or Passalacqua. This is the lake for design lovers. Or have both: two nights at Passalacqua, then ten minutes across the water to here."],["Best for couples.","It’s not a family hotel. I’d only send families with older teenagers who are happy by the pool. For a family trip on the lake, look at Grand Hotel Tremezzo or the Mandarin Oriental."],["Torno is quiet.","There’s not much going on in the village. If you want a lively base, stay in Bellagio, Como or Tremezzo instead, or stay here and go out by boat."]],"img":"img/il-sereno-lake-como.jpg","u":"https://suiteswithkeith.com/hotels/il-sereno-lake-como.html"},{"s":"joali-being-maldives","n":"Joali Being","c":"Maldives","a":"Maldives","w":"Raa Atoll, Maldives","v":"On a shortlist where every hotel serves a different couple, this is the one for the pair who need the honeymoon to give something back.","p":"Restorative honeymoons, burnout recoveries, wellness devotees","st":"Wellness private-island resort","r":"#10 on The Fifteen","vis":"","fh":0,"so":[["Wellness is built into the whole island.","The island itself is programmed around restoration, and that's why it made The Fifteen."],["Built for the exhausted couple.","My recommendation when the honeymoon also needs to repair a wedding year."],["Still unmistakably the Maldives.","The lagoon, the sand, the overwater silhouettes. You get restoration without giving up the postcard."]],"k":[["Commit to the programming.","Guests who engage with the wellness curriculum get the full value, so treat it like the point of the trip."],["Not the party island.","Couples who want dining energy and social buzz should compare the pairings in my sample proposal."],["Consider it as a finisher.","It also works as the restorative second island of a two-resort itinerary, and I structure those regularly."]],"img":"img/joali-being-maldives.jpg","u":"https://suiteswithkeith.com/hotels/joali-being-maldives.html"},{"s":"jupiter-villa-paros","n":"Jupiter","c":"Greece","a":"Paros & Antiparos","w":"Parīlio, Paros, Greece","v":"My Best Paros Villa, and the private base I book for groups on the island I keep thinking about.","p":"Families, groups, villa buyout trips","st":"Five-bedroom villa at Parīlio","r":"Best Paros Villa, The Greece Collection","vis":"Visited June 2026","fh":1,"so":[["It won my Best Paros Villa award.","Out of everything I evaluated for the Greece Collection's Paros section, this is the villa I named first."],["Five king bedrooms and a private pool.","Parīlio’s most exclusive stay: 180 square meters with a fully equipped kitchen, rainfall showers and a private pool on a big terrace. For a multi-family trip or a group celebration, it beats booking a row of suites, for privacy and for the experience."],["Paros is built for the villa format.","Naousa's restaurants, the beaches, and the boat days all work beautifully from a private base."]],"k":[["Villas book differently than hotels.","Peak weeks go early and minimum-stay rules apply, so talk to me before you lock flights."],["It’s part of Parīlio.","You get the hotel’s team and restaurant a short walk away. For a room at the hotel itself, see my Parīlio review and Cosme vs. Parīlio."],["Pair it with a boat day.","Seeing the Cyclades from the water is the upgrade every villa group thanks me for later."]],"img":"img/jupiter-villa-paros.jpg","u":"https://suiteswithkeith.com/hotels/jupiter-villa-paros.html"},{"s":"kalesma-mykonos","n":"Kalesma","c":"Greece","a":"Mykonos","w":"Mykonos, Greece","v":"Cali is flashier on paper, but Kalesma's laid-back beauty is what won me over.","p":"Couples, sunset lovers, slow evenings","st":"Design boutique","r":"#07 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["The fire pit overlooking Delos.","A fantastic place to sit around sunset before heading out to dinner."],["The jacuzzi suites.","A glass of wine, the bay below, golden hour. It's the memory that outlasted the trip."],["The design language.","Dark wood and marble against Cycladic white. It's warm and restrained, and unlike anything else on the island."],["The location.","Above Ornos, central to everything, without any of the Mykonos Town chaos."]],"k":[["Request the junior suites left of the pool bar.","They're more private than the one I stayed in, and interestingly, the base rooms above the junior suites are more private still."],["Wellness is low-key.","The spa is small and the gym covers the basics. If a serious gym matters, that's Cali."],["Dining is pleasant rather than the headline.","Kalesma is about the design and the views, and Mykonos's remarkable restaurant scene is minutes away."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, private boat days along the south coast or to Delos, and private boat transfers to Paros or Naxos instead of the ferry."]],"img":"img/kalesma-mykonos.jpg","u":"https://suiteswithkeith.com/hotels/kalesma-mykonos.html"},{"s":"katikies-santorini","n":"Katikies Santorini","c":"Greece","a":"Santorini","w":"Santorini, Greece","v":"For now, my clients usually find the stronger value a notch up my list, and I'll be first in line to re-review the moment a refresh lands.","p":"Katikies loyalists, and everyone else after the refresh","st":"Caldera hotel portfolio","r":"#10 in my Santorini ranking","vis":"Visited June 2026","fh":1,"so":[["The setting.","All three Caldera properties occupy genuinely beautiful positions. This is the terraced white Santorini everyone pictures."],["The spa at Pelagos House.","Expansive and impressive. It's the standout facility across the portfolio."],["The photographs.","The iconic white stairs and infinity pools still deliver the postcard, even where the rooms behind them don't."],["The potential.","Great bones and unbeatable locations. A renovation would move this portfolio right back up my ranking."]],"k":[["No coverings over the patios.","Unlike Andronis or Canaves, which means less shade and much less privacy on your terrace."],["The interiors are classic rather than current.","A furniture and finishes update would transform the experience, and the rate-to-experience math with it."],["The honest math.","Right now, $100–$200 more per night reaches my top five on Santorini, and it's a comparison worth making for your dates."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, and private boats: a sunset cruise on the caldera, or private boat transfers to Folegandros, Milos or Ios instead of the ferry."]],"img":"img/katikies-santorini.jpg","u":"https://suiteswithkeith.com/hotels/katikies-santorini.html"},{"s":"lake-como-edition","n":"The Lake Como EDITION","c":"Italy","a":"Lake Como","w":"Cadenabbia, Lake Como, Italy","v":"A neat, modern hotel that isn’t for everyone, but is right for a lot of travelers. Book a lake-view room on the third floor or above. If you’d rather have a classic grand hotel at a similar price, Grand Hotel Tremezzo next door is my pick.","p":"Younger travelers, LGBTQ+ travelers, families in the two-bedroom suite, fans of lively modern hotels","st":"Modern design hotel in a converted lakefront building (EDITION)","r":"#05 in my Lake Como hotels ranking","vis":"Stayed October 2026","fh":1,"so":[["The spa.","Excellent, with a long list of rooms: three saunas, a steam room, an indoor heated pool and more. The hotel is leaning into wellness, and it shows."],["The gym.","One of the best hotel gyms I’ve seen: free weights up to 40 kilos, a squat rack, plenty of machines and cardio. Serious lifters will be happy here."],["The design.","White, neutrals, green marble, arches and EDITION’s signature wood. Bright and calm, especially in the penthouses. I loved the arches and light in Penthouse 1."],["The two-bedroom suite.","The real star for families. At around $5,500 a night, it’s good value compared with the alternatives on the lake for a family sharing one suite."]],"k":[["Book a lake view, on the third floor or above.","Below the third floor, lake-view rooms sit right above the casual restaurant, which is loud into the evening. Non-lake-view rooms face either the spa across the street or an interior courtyard, and they’re likely dark; unlike at Villa d’Este, Passalacqua or Grand Hotel Tremezzo, there’s no pretty garden view to fall back on."],["Don’t count on a view upgrade.","The hotel told me directly that a non-lake-view booking won’t be upgraded to a lake view; that takes a paid supplement. A standard lake-view booking can be upgraded to a lake-view loft or suite, so it’s the better starting point."],["Dining is limited.","There are three or four outlets, all on the expensive side, and the casual and in-room menus are short; there’s no pizza, for example. Grand Hotel Tremezzo is a short walk away for meals, and a boat opens up Bellagio, Varenna and the smaller restaurants I like on the lake, such as Silvio, Crotto del Misto and Locanda La Tirlindana."],["There’s no town at the door.","There isn’t much within walking distance. If you want a town right outside, Villa d’Este in Cernobbio is the better choice. Bellagio is a short boat ride away, but it’s very crowded, even in October."]],"img":"img/lake-como-edition.jpg","u":"https://suiteswithkeith.com/hotels/lake-como-edition.html"},{"s":"lanesborough-london","n":"The Lanesborough","c":"England","a":"London","w":"London, England","v":"Regency grandeur on Hyde Park Corner with 24-hour butler service in every room. It's the most residential-feeling of London's great hotels.","p":"Service maximalists, longer stays, Knightsbridge shoppers","st":"Regency townhouse palace (Oetker Collection)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/lanesborough-london.jpg","u":"https://suiteswithkeith.com/hotels/lanesborough-london.html"},{"s":"las-ventanas-los-cabos","n":"Las Ventanas al Paraíso","c":"Mexico","a":"Los Cabos","w":"Los Cabos, Mexico","v":"For celebrations that deserve a little spectacle. Those were my exact words on the shortlist, and I stand by every one.","p":"Anniversaries, proposals, celebrations with spectacle","st":"Celebration resort (Rosewood)","r":"Featured · my Los Cabos shortlist","vis":"","fh":0,"so":[["The service theater.","Famous, over-the-top, and genuinely fun, which is why it owns the celebration lane in Cabo."],["Rosewood polish underneath.","The spectacle rides on the same standards behind Hôtel de Crillon and Rosewood Castiglion del Bosco on my other lists."],["Built for the big moment.","Proposals and milestone dinners are choreographed here better than anywhere else on this coast."]],"k":[["Spectacle is the product.","Travelers who find theater exhausting will be happier at Montage or Chileno Bay, so choose this one on purpose."],["Tell me what we're celebrating.","The property performs best with advance choreography, and that takes a conversation with me."],["Whale season doubles the show.","December through April, a private whale-watching boat is the celebration add-on I book most."]],"img":"img/las-ventanas-los-cabos.jpg","u":"https://suiteswithkeith.com/hotels/las-ventanas-los-cabos.html"},{"s":"le-meurice-paris","n":"Le Meurice","c":"France","a":"Paris","w":"Paris, France","v":"The grande dame facing the Tuileries. Classic Paris at its most elegant, and with a 4th night free, smarter than it looks.","p":"Classicists, first-time palace stays, Tuileries views","st":"Classic palace (Dorchester Collection, Forbes Five-Star)","r":"Featured on my Paris collection","vis":"","fh":0,"so":[["Facing the Tuileries.","Rooms that look straight down the gardens, which is the classic Paris view."],["Alain Ducasse dining.","The grande dame's table matches its address. It's a destination in its own right."],["The partner-program math.","4th night free and a guaranteed upgrade at booking. On a four-night palace stay, that makes a real difference."]],"k":[["Classic is the brief.","18th-century grandeur, discreetly polished. If you want younger energy, that's Fouquet's on my list."],["Choose Classic versus Executive deliberately.","The Executive's size and separate bath (and its path to an Eiffel-view Superior) are worth the step up. My Paris proposal shows both."],["Palace Paris books early.","The garden-facing categories go first, so hold dates before you plan the rest."]],"img":"img/le-meurice-paris.jpg","u":"https://suiteswithkeith.com/hotels/le-meurice-paris.html"},{"s":"le-sirenuse-positano","n":"Le Sirenuse","c":"Italy","a":"Amalfi Coast","w":"Positano, Amalfi Coast","v":"Honestly, I wouldn’t proactively send clients here. If you have your heart set on staying in town, I’ll make sure you’re in a true sea-view room.","p":"Travelers who want the energy of Positano at the door","st":"","r":"","vis":"Stayed October 2026","fh":1,"so":[["The location.","Right in the middle of Positano. Walk out the door and you are in town."],["The breakfast.","Incredible. Out of this world."],["The new beach club.","With complimentary boats there at 10:30 and 12:30."],["The art, and the dome.","The artwork around the property is stunning, and the lookout over the church dome is truly stunning."]],"k":[["Only book a true sea-view room or suite.","The rest either look onto the courtyard, or have pool views right on top of the pool, which is loud."],["Book the sunset cruise in advance.","It does not work as a same-day ask. I learned this the hard way, so I set it up before you arrive."],["Lively is the point.","Positano is busy and Le Sirenuse is in the thick of it. That is a selling point or a sore point depending on who you are."],["Want privacy? Look at Il San Pietro or Villa Treville.","Il San Pietro and Villa Treville are just outside town, and getting in is very easy, so you get the quiet without losing Positano."]],"img":"img/le-sirenuse-positano.jpg","u":"https://suiteswithkeith.com/hotels/le-sirenuse-positano.html"},{"s":"londolozi-south-africa","n":"Londolozi","c":"Africa","a":"South Africa","w":"Sabi Sand, South Africa","v":"The family-run reserve that set the standard for leopard viewing worldwide. Five camps, one ethos, and guiding that turns first-timers into safari people for life.","p":"Leopard obsessives, photographers, first great safari","st":"Family-run legacy safari reserve, five camps","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/londolozi-south-africa.jpg","u":"https://suiteswithkeith.com/hotels/londolozi-south-africa.html"},{"s":"luura-paros","n":"Luura: Cliff, Paros","c":"Greece","a":"Paros & Antiparos","w":"Paros, Greece","v":"The newest hotel on Paros is a clifftop, adults-only Morgans Originals debut above Agia Irini bay, facing the Antiparos sunset.","p":"Design & art lovers, couples, sunset seekers, early adopters","st":"Clifftop art-house boutique, adults only","r":"","vis":"Visited June 2026","fh":1,"so":[],"k":[],"img":"","u":"https://suiteswithkeith.com/hotels/luura-paros.html"},{"s":"macarthur-place-sonoma","n":"MacArthur Place","c":"Napa & Sonoma","a":"Sonoma","w":"Sonoma, California","v":"A great option for return visitors who'd rather not drive back to their hotel every night.","p":"Returning visitors, walkability, wine tasting","st":"Boutique garden estate","r":"#05 in my Napa & Sonoma ranking","vis":"","fh":0,"so":[["The easiest walk to town on my list.","Wine-taste all afternoon and walk home without needing a designated driver."],["The design.","A beautiful garden-estate feel that punches above its rate."],["The freshly remodeled pool.","Just finished an extensive renovation, so it's the newest thing on the property."],["Downtown Sonoma.","Quaint, local, and less commercialized than Healdsburg, with Glen Ellen close by."]],"k":[["Wellness is modest here.","The draw is the gardens, the remodeled pool, and the town. If a destination spa is central to your trip, I'd build that in elsewhere."],["It's a boutique hotel.","Fewer facilities than the marquee names. The town makes up for it."],["Best as a second-trip base.","Ideal for returning visitors who've done the Napa marquee circuit and want walkable, local wine country."]],"img":"img/macarthur-place-sonoma.jpg","u":"https://suiteswithkeith.com/hotels/macarthur-place-sonoma.html"},{"s":"madrona-manor-healdsburg","n":"Madrona Manor","c":"Napa & Sonoma","a":"Sonoma","w":"Healdsburg, Sonoma County","v":"An easy recommendation for a romantic weekend with beautiful design and one of the most charming atmospheres in wine country.","p":"Couples, romantic getaways","st":"Historic estate (Jay Jeffers design)","r":"#07 in my Napa & Sonoma ranking","vis":"","fh":0,"so":[["The Jay Jeffers design.","A stunning estate restoration, and every room feels collected rather than specified."],["The front porch.","A glass of wine overlooking the vineyards from that porch is one of my favorite moments in Sonoma County."],["The estate feel.","You feel like a houseguest here. It's completely different energy from every resort on this list."],["E-bikes to Healdsburg Plaza.","Just a few minutes away, while the property itself stays perfectly peaceful."]],"k":[["No spa, and the pool is underwhelming.","The main drawbacks on an otherwise special property. Build your trip around the estate itself."],["This is a couples property.","I wouldn't recommend it for families, and that's precisely its charm."],["An estate has estate quirks.","Historic buildings mean every room is a bit different, so ask me which rooms suit you."]],"img":"img/madrona-manor-healdsburg.jpg","u":"https://suiteswithkeith.com/hotels/madrona-manor-healdsburg.html"},{"s":"mamula-island-montenegro","n":"Mamula Island by Banyan Tree","c":"Montenegro","a":"Montenegro","w":"Bay of Kotor, Montenegro","v":"With stronger service and a much better F&B program this could be one of the Mediterranean's most compelling hotels. Today, it's a 6.5/10. The place is extraordinary, but the hotel isn't there yet.","p":"History lovers, design travelers, one-of-a-kind stays","st":"Historic fortress hotel","r":"Scored in my Montenegro guide","vis":"","fh":0,"so":[["Stay inside the original fortress structure.","Thick stone walls, vaulted ceilings, and the feeling of actually staying inside the fortress rather than looking at it. Entry-level rooms sit in newer construction above it. Some prefer the balconies, but I want the stone."],["Arrival by boat.","The approach to the fortress sets the tone for the whole stay."],["One of the most unique hotel concepts in Europe.","Whatever you conclude about converting this history into a hotel, it's hard to argue with the singularity of the place."]],"k":[["Set service expectations now.","A ten-minute wait to be greeted at lunch, a speakeasy that was 'open' with nobody in it, a hands-off beach. Individually minor, but collectively they added up."],["Plan around the F&B gaps.","The beach has no food or beverage outlet (the nearest is roughly a ten-minute walk), and neither dinner nor the crudo won me over. The presentation felt basic for the price point."],["The water policy is real.","Tap water isn't drinkable and guests get one complimentary bottle per day; my second one came from the minibar, at a charge. I honestly can't remember encountering that at this level before."],["My room had rough edges.","A shower that flooded the bathroom floor and loose finish hardware. A beautiful room, but not a perfectly executed one."]],"img":"img/mamula-island-montenegro.jpg","u":"https://suiteswithkeith.com/hotels/mamula-island-montenegro.html"},{"s":"mandarin-oriental-lago-di-como","n":"Mandarin Oriental, Lago di Como","c":"Italy","a":"Lake Como","w":"Blevio, Lake Como, Italy","v":"The lake's famous floating pool, on the estate with room for everyone. When Como needs to work for the whole family, this is how.","p":"Families, pool lovers, resort-style Como stays","st":"Resort-scale garden estate (Mandarin Oriental)","r":"#09 in my Top Hotel Pools","vis":"","fh":0,"so":[["The floating pool.","The lake's famous pool, floating at the water's edge and framed by the Alps. It's #09 on my worldwide list."],["Resort scale on a lake of villas.","Terraced gardens, private villas, and real facilities. As my featured page puts it, it's the family-friendly way to do Como."],["Mandarin Oriental service.","A storybook setting with the brand's polished, anticipatory service, now in Blevio."]],"k":[["Base rooms are scarce.","The Junior Suite (garden view, open-plan living) is the realistic entry point, and the Duplex Suite upgrade roughly doubles the space. My Como proposal shows both."],["Blevio is the quiet shore.","A boat or car ride from Como town and Bellagio. The seclusion is the point, so plan transfers accordingly."],["Bringing kids to Como?","This is my answer. The lake's intimate villas are built for couples, while the Mandarin's scale works for families."],["Boats and transfers, arranged.","From Milan, a private car is the easiest way in, about an hour. Once you’re here, I arrange private boats for dinners across the lake, a day on the water or the move to your next hotel. I work with the best captains on Como, at fair prices."]],"img":"img/mandarin-oriental-lago-di-como.jpg","u":"https://suiteswithkeith.com/hotels/mandarin-oriental-lago-di-como.html"},{"s":"mandarin-oriental-tokyo","n":"Mandarin Oriental, Tokyo","c":"Japan","a":"Tokyo","w":"Tokyo, Japan","v":"For travelers who plan Tokyo around its tables, this is the hotel I name first.","p":"Food-first travelers, skyline lovers, celebration dinners","st":"Contemporary luxury hotel","r":"Featured · my Japan shortlist","vis":"","fh":0,"so":[["Three Michelin-starred restaurants on-site.","In the world's greatest food city, the strongest in-house dining bench of any hotel on my list."],["The skyline from everywhere.","High-floor rooms and public spaces that treat Tokyo's sprawl as the artwork."],["Contemporary confidence.","Bold, current interiors for travelers who want Tokyo's energy inside the hotel too."]],"k":[["Book the tables when you book the room.","The on-site restaurants command their own demand, so I reserve both together."],["Nihonbashi is polished.","A refined district; the Shibuya-scramble version of Tokyo is a short ride away."],["Choose by personality.","The hushed sanctuary is Aman; the Ginza classic is The Peninsula; the contemporary food-first stay is here."]],"img":"img/mandarin-oriental-tokyo.jpg","u":"https://suiteswithkeith.com/hotels/mandarin-oriental-tokyo.html"},{"s":"mauna-kea-beach-hotel-hawaii","n":"Mauna Kea Beach Hotel","c":"Hawaii","a":"Hawaii","w":"Kohala Coast, Hawaii","v":"On a list of showpiece single courts, this is where you go to actually play, every day and at sunset, on the Kohala Coast.","p":"Tennis families, multigenerational trips, Hawaii classicists","st":"Classic beach resort","r":"#11 in my hotel tennis ranking","vis":"","fh":0,"so":[["A dozen courts.","The only true tennis park on my ranking, with programming and volume the showpiece courts can't offer."],["The Kohala Coast setting.","Courts strung along one of Hawaii's most beautiful coastlines."],["The original.","Hawaii's first great resort tennis facility, and it still carries that history."]],"k":[["It's the accessible tier of my list.","Priced below the European showpieces on my ranking, so it's a genuinely bookable entry point to the list."],["Classic in style.","The appeal is heritage-resort Hawaii. Design-first travelers should weigh my Four Seasons picks nearby."],["Build it into a two-island trip.","Big Island plus Lanai is a sequencing I love, so ask me."]],"img":"img/mauna-kea-beach-hotel-hawaii.jpg","u":"https://suiteswithkeith.com/hotels/mauna-kea-beach-hotel-hawaii.html"},{"s":"meadowood-napa-valley","n":"Meadowood Napa Valley","c":"Napa & Sonoma","a":"Napa Valley","w":"St. Helena, Napa Valley","v":"Every time I go to Meadowood, I feel well taken care of, and I can't say that about every property on this list.","p":"Honeymoons, celebrations, wine lovers, returning visitors","st":"Estate resort","r":"#01 in my Napa & Sonoma ranking","vis":"","fh":0,"so":[["Service at Aman standards.","The single biggest separator in wine country. You feel looked after from arrival to checkout."],["The cottages.","Spacious, private, and scattered through the estate's woods, with around 40 keys total and no bad rooms."],["The tennis facility is underrated.","Beautiful courts with instructors I'd recommend in a heartbeat."],["The details.","Thoughtful turndown treats each evening, and a beautiful spa to build slow mornings around."]],"k":[["Mind the stairs.","About 90% of rooms aren't fully accessible, though buggies are available for those with mobility concerns."],["It skews a bit older.","The property tends to attract 40+ couples, though there's a family pool and it works well solo too."],["Book through a Virtuoso partner.","The additional credit (often $500) meaningfully changes the math on a multi-night stay."]],"img":"img/meadowood-napa-valley.jpg","u":"https://suiteswithkeith.com/hotels/meadowood-napa-valley.html"},{"s":"minos-beach-art-hotel-crete","n":"Minos Beach Art Hotel","c":"Greece","a":"Crete","w":"Agios Nikolaos, Crete","v":"Waterfront bungalows on Mirabello Bay since 1963, and an open-air art museum you can sleep in.","p":"Families, art & design lovers, couples who want calm","st":"Waterfront bungalow classic, Member of Design Hotels","r":"","vis":"","fh":0,"so":[],"k":[],"img":"","u":"https://suiteswithkeith.com/hotels/minos-beach-art-hotel-crete.html"},{"s":"minos-palace-crete","n":"Minos Palace","c":"Greece","a":"Crete","w":"Agios Nikolaos, Crete","v":"Adults only, on its own private peninsula. It's an island within an island, with the sea on three sides of you.","p":"Couples, quiet-seekers, wellness & longevity travelers","st":"Adults-only peninsula resort","r":"","vis":"","fh":0,"so":[],"k":[],"img":"","u":"https://suiteswithkeith.com/hotels/minos-palace-crete.html"},{"s":"miramalfi-amalfi","n":"Miramalfi","c":"Italy","a":"Amalfi Coast","w":"Amalfi, Italy","v":"A beautiful new renovation, a sea view from every room and my
