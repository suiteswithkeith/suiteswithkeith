<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suites With Keith</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SWK Trips">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --plaster:#F2EFE6; --plaster-deep:#E9E5DA; --lime:#FBFAF6;
  --shadow:#161712; --shadow-2:#22231C; --on-dark:#F2EFE6; --on-dark-muted:#9A9B90;
  --ink:#1F201A; --ash:#65665C; --ash-light:#8C8D82;
  --brass:#836229; --brass-light:#BE975A;
  --olive:#4A5040; --olive-deep:#3B4033;
  --line:rgba(22,23,18,.15); --line-dark:rgba(242,239,230,.18);
  --serif:"Instrument Serif",Georgia,serif; --body:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%}
body{background:var(--plaster-deep);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.label{font-family:var(--serif);text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.eyebrow{color:var(--brass)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08}
h1 em,h2 em,h3 em{font-style:italic}

/* device shell */
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 40px}
.proto-note{position:fixed;left:16px;top:16px;max-width:240px;font-size:13px;color:var(--ash);display:none}
@media(min-width:900px){.proto-note{display:block}}
.phone{width:100%;max-width:420px;height:min(860px,calc(100vh - 64px));min-height:640px;background:var(--plaster);border:1px solid var(--line);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(max-width:520px){.stage{padding:0}.phone{max-width:none;height:100vh;height:100dvh;border:0}}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.pad{padding:0 22px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 22px 14px;border-bottom:1px solid var(--line);background:var(--plaster)}
.wordmark{font-family:var(--serif);font-size:20px;letter-spacing:.01em}
.wordmark em{font-style:italic}
.avatar{width:34px;height:34px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--lime);padding-bottom:env(safe-area-inset-bottom)}
.tab{padding:12px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ash)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}
.tab .label{font-size:11px;letter-spacing:.1em;white-space:nowrap}
.tab.on{color:var(--ink)}
.tab.on .label{border-bottom:1px solid var(--ink)}
.tab.urgent{color:var(--olive)}

/* sign-in */
.signin{flex:1;display:flex;flex-direction:column;background:var(--shadow);color:var(--on-dark);padding:calc(48px + env(safe-area-inset-top)) 28px 32px}
.signin{position:relative;overflow:hidden}
.signin-photo{position:absolute;left:0;right:0;top:0;height:46%;overflow:hidden;border-bottom:1px solid var(--line-dark)}
.signin-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.signin > *:not(.signin-photo){position:relative}
.signin .wordmark{background:var(--shadow);align-self:flex-start;padding:6px 10px;margin:-6px 0 0 -10px}
.signin .wordmark{font-size:22px}
.signin h1{font-size:46px;margin:auto 0 14px}
.signin p{color:var(--on-dark-muted);margin-bottom:28px}
.field{display:block;width:100%;padding:15px 14px;background:transparent;border:1px solid var(--line-dark);color:var(--on-dark);font-family:var(--body);font-size:17px;outline:none}
.field:focus{border-color:var(--on-dark-muted)}
.field::placeholder{color:#6f7066}
.btn{display:block;width:100%;text-align:center;padding:15px 18px;background:var(--olive);color:var(--on-dark);font-family:var(--serif);text-transform:uppercase;letter-spacing:.14em;font-size:13px;text-decoration:none}
.btn:active{background:var(--olive-deep)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost-dark{background:transparent;border:1px solid var(--line-dark);color:var(--on-dark)}
.signin .btn{margin-top:12px}
.fine{font-size:13px;color:var(--on-dark-muted);margin-top:18px}
.field.code{font-family:var(--serif);font-size:34px;letter-spacing:.45em;text-align:center;padding:12px 10px}
.err{color:var(--brass-light);font-size:14px;min-height:20px;margin-top:6px}
.sent-box{border:1px solid var(--line-dark);padding:18px;margin-bottom:14px}
.sent-box strong{font-weight:500;color:var(--on-dark)}

/* home */
.greet{padding:26px 22px 18px}
.greet h1{font-size:38px;margin-top:6px}
.next{background:var(--shadow);color:var(--on-dark);margin:0;cursor:pointer;display:block;width:100%;text-align:left}
.next .art{height:250px}
.next .body{padding:18px 18px 20px}
.next .eyebrow{color:var(--brass-light)}
.next h2{font-size:32px;margin:6px 0 4px}
.next .meta{color:var(--on-dark-muted);font-size:15px}
.count{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-dark)}
.count b{font-family:var(--serif);font-weight:400;font-size:30px;display:block;line-height:1}
.count span{color:var(--on-dark-muted)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;padding:30px 22px 10px}
.row{display:flex;gap:14px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:1px solid var(--line)}
.row .sw{width:58px;height:58px;flex:none}
.row h3{font-size:22px}
.row .meta{color:var(--ash);font-size:14px}
.chev{margin-left:auto;color:var(--ash-light);font-family:var(--serif);font-size:22px}

/* trip detail */
.trip-hero{background:var(--shadow);color:var(--on-dark)}
.trip-hero .art{height:190px;position:relative}
.back{position:absolute;left:14px;top:14px;background:var(--plaster);color:var(--ink);padding:7px 12px}
.trip-hero .body{padding:18px 22px 0}
.trip-hero .eyebrow{color:var(--brass-light)}
.trip-hero h1{font-size:40px;margin:6px 0 4px}
.trip-hero .meta{color:var(--on-dark-muted)}
.seg{display:flex;margin-top:18px;border-top:1px solid var(--line-dark)}
.seg button{flex:1;padding:14px 0;color:var(--on-dark-muted)}
.seg button.on{color:var(--on-dark);box-shadow:inset 0 -2px 0 var(--brass-light)}
.day{padding:22px 22px 6px}
.day-h{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.day-h h3{font-size:24px}
.day-h .label{color:var(--ash)}
.item{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-family:var(--serif);font-size:17px;color:var(--ash)}
.item .k{color:var(--brass)}
.item .what{font-size:16.5px}
.item .sub{color:var(--ash);font-size:14px}
.res{margin:18px 22px 0;background:var(--lime);border:1px solid var(--line)}
.res .top{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.res h3{font-size:25px;margin:4px 0 2px}
.res .meta{color:var(--ash);font-size:14.5px}
.kv{display:grid;grid-template-columns:1fr 1fr}
.kv div{padding:11px 16px;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){border-right:1px solid var(--line)}
.kv .label{color:var(--ash);font-size:11px;display:block}
.kv b{font-weight:500;font-size:15.5px}
.perks{padding:12px 16px;border-bottom:1px solid var(--line)}
.perks ul{list-style:none;margin-top:6px}
.perks li{font-size:15px;padding:3px 0 3px 16px;position:relative}
.perks li:before{content:"";position:absolute;left:0;top:12px;width:7px;height:1px;background:var(--brass)}
.note{padding:12px 16px;font-size:15px;font-style:italic;color:var(--ink);border-bottom:1px solid var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr}
.actions button,.actions a{padding:13px 8px;text-align:center;font-family:var(--serif);text-transform:uppercase;letter-spacing:.12em;font-size:12px;text-decoration:none}
.actions > *:first-child{border-right:1px solid var(--line)}

/* book */
.book-head{padding:26px 22px 16px}
.book-head h1{font-size:36px;margin:6px 0 8px}
.book-head p{color:var(--ash)}
.portal{margin:0 22px;border:1px solid var(--line);background:var(--lime)}
.portal-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ash)}
.portal-bar .dot{width:7px;height:7px;background:var(--olive)}
.portal-body{padding:22px 16px}
.mock-search{border:1px solid var(--line);display:grid;grid-template-columns:1fr}
.mock-search div{padding:12px 14px;border-bottom:1px solid var(--line)}
.mock-search div:last-child{border-bottom:0}
.mock-search .label{color:var(--ash);font-size:11px;display:block}
.portal-body .btn{margin-top:14px}
.portal-body .fine2{font-size:13px;color:var(--ash);margin-top:12px}
.why{margin:22px 22px 0;padding-top:16px;border-top:1px solid var(--line)}
.why li{list-style:none;padding:6px 0;font-size:15.5px;border-bottom:1px solid var(--line)}

/* contact */
.contact{background:var(--shadow);color:var(--on-dark);min-height:100%;padding:30px 22px 30px}
.contact .eyebrow{color:var(--brass-light)}
.contact h1{font-size:40px;margin:8px 0 10px}
.contact p{color:var(--on-dark-muted)}
.big{display:flex;justify-content:space-between;align-items:center;padding:20px 18px;margin-top:12px;background:var(--olive);color:var(--on-dark);text-decoration:none;width:100%}
.big.alt{background:transparent;border:1px solid var(--line-dark)}
.big .label{font-size:14px}
.big span:last-child{font-family:var(--serif);font-size:20px}
.num{font-family:var(--serif);font-size:28px;margin-top:22px;color:var(--on-dark)}
.contact .list{margin-top:26px;border-top:1px solid var(--line-dark)}
.contact .list div{padding:13px 0;border-bottom:1px solid var(--line-dark);font-size:15px;color:var(--on-dark)}
.contact .list .label{color:var(--on-dark-muted);display:block;font-size:11px;margin-bottom:2px}


/* day strip */
.strip{position:sticky;top:0;z-index:2;display:flex;gap:0;overflow-x:auto;background:var(--plaster);border-bottom:1px solid var(--line);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;width:58px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);color:var(--ash)}
.chip b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;color:var(--ink)}
.chip .label{font-size:10px}
.chip.on{background:var(--shadow)}
.chip.on b,.chip.on .label{color:var(--on-dark)}
.chip.is-today .label{color:var(--brass)}
.chip.on.is-today .label{color:var(--brass-light)}
.today-tag{margin-left:auto;color:var(--brass)}
.today-list{margin-top:14px;border-top:1px solid var(--line-dark)}
.today-list div{padding:9px 0;border-bottom:1px solid var(--line-dark);font-size:15.5px}
.today-list span{display:inline-block;width:56px;font-family:var(--serif);color:var(--on-dark-muted)}
.preview{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.preview .btn{margin-top:8px}
.guide-link{display:flex;justify-content:space-between;align-items:center;margin:22px 22px 0;padding:16px;border:1px solid var(--line);background:var(--lime);width:calc(100% - 44px);text-align:left}
/* guides */
.g-head{padding:26px 22px 14px}
.g-head h1{font-size:36px;margin:6px 0 8px}
.g-head p{color:var(--ash)}
.g-hero{background:var(--shadow);color:var(--on-dark)}
.g-hero .art{height:170px;position:relative}
.g-hero .body{padding:18px 22px 22px}
.g-hero .eyebrow{color:var(--brass-light)}
.g-hero h1{font-size:40px;margin:6px 0 6px}
.g-hero p{color:var(--on-dark-muted)}
.hotel{padding:15px 22px;border-top:1px solid var(--line)}
.hotel h3{font-size:23px}
.hotel .label{color:var(--brass)}
.hotel p{font-size:15.5px;margin-top:3px}
.hotel p.none{color:var(--ash-light);font-style:italic}
.stops{margin:0 22px;border-left:1px solid var(--brass);padding-left:18px}
.stop{padding:10px 0;position:relative}
.stop:before{content:"";position:absolute;left:-22px;top:19px;width:7px;height:7px;background:var(--brass)}
.stop h3{font-size:21px}
.stop .meta{color:var(--ash);font-size:14.5px}
.place{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:12px 22px;border-top:1px solid var(--line)}
.place .label{color:var(--ash)}
.ph-note{padding:12px 22px 0;font-size:13.5px;color:var(--ash)}
.site-link{display:block;margin:24px 22px 0}


.art img,.gimg img,.thumb img,.h-hero img,.sw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.search{display:block;width:100%;margin-top:16px;padding:13px 14px;border:1px solid var(--line);background:var(--lime);font-family:var(--body);font-size:16px;outline:none;-webkit-appearance:none}
.search:focus{border-color:var(--ash)}
.gcard{display:block;width:calc(100% - 44px);margin:0 22px 16px;text-align:left;background:var(--shadow);color:var(--on-dark)}
.gimg{height:170px;position:relative;overflow:hidden;background:var(--shadow-2)}
.gbody{padding:14px 16px 16px}
.gbody h2{font-size:30px}
.gbody .meta{color:var(--on-dark-muted);font-size:14.5px;margin-top:2px}
.sw{position:relative;overflow:hidden;background:var(--plaster-deep)}
.hrow{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 22px;border-top:1px solid var(--line);width:100%;text-align:left}
.thumb{width:84px;height:84px;position:relative;overflow:hidden;background:var(--plaster-deep)}
.hrow h3{font-size:21px;margin:2px 0 3px}
.hrow p{font-size:14.5px;color:var(--ash);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hrow .label{font-size:10.5px}
.astrip{gap:0}
.achip{flex:none;padding:12px 16px;border-right:1px solid var(--line);font-family:var(--serif);font-size:16px;white-space:nowrap}
.area-h{align-items:baseline}
.area-h h2{font-size:28px}
.area-h a{color:var(--brass);text-decoration:none}
.route{margin:0 22px 18px;padding:16px;border:1px solid var(--line);background:var(--lime)}
.route > h3{font-size:24px}
.route > .meta{color:var(--ash);font-size:14.5px;margin-bottom:12px}
.route .stops{margin:0}
.route .stop a{color:var(--ink)}
.nights{font-family:var(--body);font-size:13px;color:var(--ash)}
.read{display:block;margin-top:12px;font-family:var(--serif);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--brass);text-decoration:none}
.h-hero{height:260px;position:relative;overflow:hidden;background:var(--shadow)}
.h-name{font-size:40px;margin-top:6px}
.h-verdict{font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.3;margin-top:16px}
.h-kv{display:block;margin:20px 22px 0;border-top:1px solid var(--line)}
.h-kv div{padding:11px 0;border-bottom:1px solid var(--line)}
.h-kv .label{display:block;color:var(--ash);font-size:11px}
.h-kv b{font-weight:500}
.pts{margin:0 22px}
.pt{display:grid;grid-template-columns:34px 1fr;padding:12px 0;border-top:1px solid var(--line)}
.pt span{font-family:var(--serif);color:var(--brass)}
.pt b{font-weight:500}
.pt p{font-size:15px;color:var(--ash);margin-top:2px}

/* trips without a photo */
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--shadow);color:var(--brass-light);font-family:var(--serif);font-size:28px}
.trip-hero .art.noimg{height:64px}
/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(22,23,18,.45);display:none;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--plaster);z-index:6;transform:translateY(100%);transition:transform .22s ease;border-top:1px solid var(--line);padding:20px 22px calc(22px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.sheet h3{font-size:26px;margin:4px 0 14px}
.sheet .btn{margin-top:10px}
.toast{position:absolute;left:22px;right:22px;bottom:84px;background:var(--shadow);color:var(--on-dark);padding:12px 14px;font-size:14px;z-index:7;display:none}

/* placeholder "photography" blocks */
.art{position:relative;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>

<script>
/* ---------- Sample data, shaped like a Fora sync ---------- */
const KEITH = { name:"Keith Pence", phone:"+1 (415) 272-4316", tel:"+14152724316",
  portal:"https://trips.foratravel.com/suites-with-keith/book" };

/* ---------- live data (Supabase) ---------- */
const SB_URL = "https://reyryrfdrbcumxuhinio.supabase.co";
const SB_KEY = "sb_publishable_IEPxr0ufXJ4gMGxkXzFdtQ_WE4E6ebu"; // public by design; Row Level Security protects the data
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"swk-trips-auth" } });
let CLIENT = { first:"", last:"", email:"" };
let TRIPS = [];
const PALETTES = [["#E9E5DA","#9FA890","#161712"],["#E9E5DA","#836229","#22231C"],["#E9E5DA","#4A5040","#161712"]];
async function loadData(){
  const [me, tr] = await Promise.all([
    sb.from("clients").select("first_name,last_name,email").limit(1),
    sb.from("trips").select("*, reservations(*), itinerary_items(*)").order("start_date")
  ]);
  if (tr.error) throw tr.error;
  const c = (me.data||[])[0] || {};
  CLIENT = { first:c.first_name||"", last:c.last_name||"", email:c.email||state.email||"" };
  TRIPS = (tr.data||[]).map((t,i)=>{
    const days = {};
    (t.itinerary_items||[]).slice().sort((x,y)=>x.day.localeCompare(y.day)||x.sort-y.sort||String(x.time||"").localeCompare(String(y.time||"")))
      .forEach(it=>{ const d = days[it.day] ||= { d:it.day, title:"", items:[] };
        if(it.day_title && !d.title) d.title = it.day_title;
        d.items.push([it.time||"", it.kind||"", it.title, it.detail||""]); });
    return { id:t.id, name:t.name, em:t.subtitle||"", start:t.start_date, end:t.end_date, places:t.places||"",
      palette: PALETTES[i % PALETTES.length],
      reservations: (t.reservations||[]).slice().sort((x,y)=>x.sort-y.sort||String(x.check_in||"").localeCompare(String(y.check_in||"")))
        .map(r=>({ type:r.type||"Hotel", name:r.name, place:r.place||"", in:r.check_in, out:r.check_out, room:r.room||"",
          conf:r.confirmation||"", guests:r.guests||"", perks:r.perks||[], note:r.note||null, phone:r.phone||"" })),
      days: Object.values(days).sort((x,y)=>x.d.localeCompare(y.d)) };
  });
}

tles, reef sharks, and rays without a boat."],["The tiny-island intimacy.","Walkable in minutes and unhurried. This is the barefoot Maldives at its most literal."],["On the sand in half an hour.","A quick speedboat from Malé, and the fastest route into the water in my proposal."]],"k":[["Small is the point, and also the limit.","Wonderful, but not for those who want scale; my proposal pairs it with the bigger Kanuhura for exactly that reason."],["Dining is solid rather than a highlight.","My honest caveat from the proposal: the reef is the restaurant's toughest competition."],["Snorkelers, say so first.","If the reef is your priority, tell me. It reshapes the whole itinerary in your favor."]],"img":"img/banyan-tree-vabbinfaru-maldives.jpg","u":"https://suiteswithkeith.com/hotels/banyan-tree-vabbinfaru-maldives.html"},{"s":"bawah-reserve-indonesia","n":"Bawah Reserve","c":"Indonesia","a":"Indonesia","w":"Anambas Islands, Indonesia","v":"The most adventurous entry on my tennis list, and the one I recommend when the Maldives feels too tame.","p":"Adventurous couples, total-escape trips, tennis travelers","st":"Private-island eco resort","r":"#09 in my hotel tennis ranking","vis":"","fh":0,"so":[["The court in the jungle.","A single court carved from rainforest with the lagoon beyond. It's the reason it made my world ranking."],["A true private archipelago.","Not one island but a cluster, which makes the seclusion feel genuinely expeditionary."],["The self-selecting crowd.","Remote arrivals filter for guests who actually want this kind of quiet."]],"k":[["The journey is real.","This is a remote property by design. Plan the connections before you fall in love with the dates, and let me sequence them."],["It's an eco-lodge at heart.","The luxury here is setting and seclusion. If polished-marble service is the priority, look at my Maldives picks instead."],["Tennis comes with a view and humidity.","Play early. The rainforest setting is the magic and the challenge."]],"img":"img/bawah-reserve-indonesia.jpg","u":"https://suiteswithkeith.com/hotels/bawah-reserve-indonesia.html"},{"s":"belmond-castello-di-casole-tuscany","n":"Belmond Castello di Casole","c":"Italy","a":"Tuscany","w":"Casole d'Elsa, Tuscany, Italy","v":"A hilltop castle with sweeping views near Siena. For travelers who want their Tuscany slightly more traditional, this is the one.","p":"Traditionalists, couples, Siena-side itineraries","st":"Hilltop castle estate (Belmond)","r":"Featured on my Italy collection","vis":"Visited October 2026","fh":1,"so":[["A genuine hilltop castle.","Ten centuries of stone crowning its own estate, and the most castle-like of my featured Tuscany picks."],["The sweeping views.","Unbroken Tuscan countryside to every horizon. Sunset from the terraces is the day's main event."],["The Siena side of Tuscany.","Casole d'Elsa puts Siena, San Gimignano, and Volterra all within easy reach."]],"k":[["Traditional in feel is the brief.","Stone, heritage interiors, classic service. If you want contemporary polish, that's Castiglion del Bosco."],["It's remote by design.","Plan a car or driver. The isolation is the luxury, and the hill towns are the excursions."],["Belmond pairs beautifully.","An hour from Villa San Michele above Florence, so the two-stop Belmond Tuscany trip writes itself."],["Transfers and drivers, arranged.","I arrange private transfers from Florence, Pisa or Rome, and drivers for wine days and the hill towns, so you can enjoy the tastings without anyone having to drive."]],"img":"img/belmond-castello-di-casole-tuscany.jpg","u":"https://suiteswithkeith.com/hotels/belmond-castello-di-casole-tuscany.html"},{"s":"belmond-hotel-caruso-ravello","n":"Belmond Hotel Caruso","c":"Italy","a":"Amalfi Coast","w":"Ravello, Italy","v":"Quieter and more composed than Positano, with the coast's most dramatic pool. It's the Amalfi stay for travelers who want the view without the crowds.","p":"Couples, pool lovers, travelers who've done Positano","st":"Clifftop palazzo (Belmond)","r":"Featured on my Italy collection","vis":"","fh":0,"so":[["The most dramatic infinity pool on the coast.","Suspended a thousand feet over the sea at the edge of Ravello. My featured page says it plainly, and it's true."],["Ravello's composure.","Gardens, concerts, and evening quiet after the day-trippers leave."],["The 11th-century palazzo.","Frescoed vaults and terraced gardens. Belmond heritage restoration at its best."]],"k":[["You're well above the beach.","The hotel runs boat trips and shuttles down to the coast. The elevation is the amenity, but plan for it."],["Weighing it against Palazzo Avino?","Both are in Ravello. Palazzo Avino is around $1,000 less per night, with smaller base rooms and a quieter, slightly awkward mood when I visited. The Caruso is the bigger splurge."],["Want the action instead?","Le Sirenuse puts you in the center of Positano; Il San Pietro gives you the cliffside icon. My featured page compares all three."],["Time it to the festival.","Ravello's summer music festival turns the village into one of Italy's great evenings, and it's worth building dates around."]],"img":"img/belmond-hotel-caruso-ravello.jpg","u":"https://suiteswithkeith.com/hotels/belmond-hotel-caruso-ravello.html"},{"s":"belmond-villa-san-michele-florence","n":"Belmond Villa San Michele","c":"Italy","a":"Florence","w":"Fiesole, Florence, Italy","v":"The best views in Florence, from a renovated 15th-century monastery. The city's most romantic address isn't in the city at all.","p":"Couples, view seekers, second-time Florence visitors","st":"Historic hillside retreat (Belmond)","r":"Featured on my Italy collection","vis":"Visited October 2026","fh":1,"so":[["The best views in Florence.","The city spread below the Fiesole hills. It's the reason this property leads my Florence list."],["The monastery itself.","A 15th-century building with a facade attributed to Michelangelo's school, recently and beautifully renovated."],["The pool.","A highlight of the property, set on the hillside with the city below. (It’s a climb, more on that below.)"],["The chapel room.","Super special and unique, and the most private room on the property."]],"k":[["You're up above the city.","The shuttle makes it easy, but if you want to walk out into the streets, look at Hotel Lungarno (my riverside pick, steps from everything)."],["Privacy varies by room.","There's less privacy than you'd expect at this level. If I could choose, I'd book a Garden Junior Suite above the main lawn: those are more private than the ones below it, where people can look down on you. The most secluded garden suite overlooks the parking lot, and only the chapel room is more private. I'll make sure you're in the right one."],["Lots of stairs up to the pool.","The pool is a real climb from the rooms. Worth knowing if anyone in your group has mobility concerns."],["Seasonal by nature.","The terraces and pool are the point. Spring through fall is when this property sings."]],"img":"img/belmond-villa-san-michele-florence.jpg","u":"https://suiteswithkeith.com/hotels/belmond-villa-san-michele-florence.html"},{"s":"bill-and-coo-coast-mykonos","n":"Bill & Coo Coast","c":"Greece","a":"Mykonos","w":"Mykonos, Greece","v":"If I had the choice, I'd always choose the Coast location over the Mykonos Town property.","p":"Couples, beach club lovers","st":"Adults-only beachfront","r":"#06 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["The best breakfasts I had in Greece.","At any hotel, on any island. I was usually full until dinner."],["The private beach club.","Extremely relaxing, and lunch at Beefbar on-site is fun, if a bit sceney."],["Massive, genuinely private suites.","Rooms directly on the water, several with remarkable private pools."],["A big upgrade is coming.","A massive new gym complex and spa are under construction, which should take the property to another level."]],"k":[["Book Coast over Town.","If you have the choice, the protected bay, adults-only policy, and beachfront rooms make Coast the clear pick. The Town location's infinity pool gets windy in the meltemi."],["It's adults-only, for guests 17 and up.","Traveling with kids on Mykonos? Look at Cali on the quieter east side."],["The scene is there if you want it.","Beefbar brings energy at lunch, and the hotel arranges transfers to the island's beach clubs, but the property itself stays calm."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, private boat days along the south coast or to Delos, and private boat transfers to Paros or Naxos instead of the ferry."]],"img":"img/bill-and-coo-coast-mykonos.jpg","u":"https://suiteswithkeith.com/hotels/bill-and-coo-coast-mykonos.html"},{"s":"bill-and-coo-suites-mykonos","n":"Bill & Coo Suites","c":"Greece","a":"Mykonos","w":"Mykonos, Greece","v":"Best Breakfast and Best Service in my Greece Collection edit, from the group that consistently out-executes Mykonos.","p":"Couples, families, food lovers, town access","st":"Boutique suites near Mykonos Town","r":"Best Breakfast & Best Service, The Greece Collection","vis":"Visited June 2026","fh":1,"so":[["The breakfast that won my award.","Best Breakfast across every hotel in my Greece Collection edit, so plan a slow morning around it."],["Service that took its own category.","Best Service on Mykonos in my edit. The team's warmth is the thread through everything the group does."],["Two properties, one standard.","Suites for town access and families; the Coast for elegant beachfront suites directly on the shoreline."]],"k":[["Compare both Bill & Coo properties before booking.","The Coast is my choice for a true beachfront stay; the Suites win if Mykonos Town or family travel is the priority."],["Town access is the differentiator.","If your Mykonos is dinners, boutiques, and evenings in town, the Suites' location earns its keep every single night."],["Dining is a reason to stay in.","Exceptional restaurants across the group, and my already-booked Mykonos page lists the other tables worth reserving."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, private boat days along the south coast or to Delos, and private boat transfers to Paros or Naxos instead of the ferry."]],"img":"img/bill-and-coo-suites-mykonos.jpg","u":"https://suiteswithkeith.com/hotels/bill-and-coo-suites-mykonos.html"},{"s":"borgo-egnazia-puglia","n":"Borgo Egnazia","c":"Italy","a":"More Italy","w":"Puglia, Italy","v":"Space, food, and privacy. For the couple whose honeymoon is about disappearing well, this is the Italy pick on my shortlist.","p":"Honeymoons, food-driven trips, couples who want room to breathe","st":"Village-style resort estate","r":"#07 in The Fifteen, my honeymoon shortlist","vis":"Visited October 2026","fh":1,"so":[["Space.","Laid out like a village: casette with courtyards and real distance between you and everyone else."],["Food.","Puglia's produce and seafood, cooked at the region's flagship. It's the strongest eating of any property on The Fifteen's Italy section."],["Privacy.","The layout is built for couples who want to disappear for a week, which is the exact brief The Fifteen exists to answer."]],"k":[["Puglia takes one extra step to reach.","Fly to Bari or Brindisi (easy connections from Rome) and the transfer is short. I handle the routing."],["Choose your accommodation type deliberately.","Rooms, suites, and casette live differently. Tell me the trip and I'll place you."],["Compare it within The Fifteen.","Puglia's space-and-food brief versus Amalfi's drama versus Como's romance: the shortlist exists so we can have exactly that conversation."]],"img":"img/borgo-egnazia-puglia.jpg","u":"https://suiteswithkeith.com/hotels/borgo-egnazia-puglia.html"},{"s":"borgo-pignano-florence","n":"Borgo Pignano Florence","c":"Italy","a":"Florence","w":"Florence, Italy","v":"Space, calm and contemporary design at the edge of Florence, with the city five minutes away and the countryside estate one drive further.","p":"Return visitors, couples, anyone who wants space and quiet with Florence close by","st":"Contemporary city borgo (Borgo Pignano)","r":"","vis":"Visited October 2026","fh":1,"so":[["Space, close to the city.","The largest hotel grounds in Florence, with the center five minutes away on the hourly shuttle."],["Design and finishes.","Contemporary rooms with a lot of beautiful marble, every one a little different, and very high quality hardware throughout."],["Warm, attentive service.","A generous team, quick on WhatsApp, and thoughtful touches like food waiting in the room after a late arrival."],["The gym and the spa.","A well-equipped gym with a squat rack, dumbbells to 34kg and cardio machines. The spa sits in the basement, with a shared steam room and sauna and a unique tunnel connected to it."]],"k":[["Ask for Vite.","If you’re booking the entry category, Vite is the room I’d request. It’s a standalone building in its own private corner, and a good size for the category."],["Main building over the villa.","Five rooms sit in a separate villa by the entrance, which can be booked whole as a five-bedroom villa or used room by room when the main building is full. The rooms match the main building, but the villa is close to Via Bolognese and you’ll hear the road. I’d request the main building."],["Book spa treatments early.","There are only two treatment rooms. Tell me what you’d like and I’ll reserve it before you arrive."],["Choosing between the hills hotels?","It sits in the same price tier as Collegio alla Querce, which I’ve also stayed at. Villa San Michele is a category of its own. If you’d rather be in the center, look at Four Seasons Firenze."]],"img":"img/borgo-pignano-florence.jpg","u":"https://suiteswithkeith.com/hotels/borgo-pignano-florence.html"},{"s":"borgo-pignano-volterra-tuscany","n":"Borgo Pignano","c":"Italy","a":"Tuscany","w":"Volterra, Tuscany, Italy","v":"A quiet stone borgo on a Tuscan hilltop, where the dinner view alone is worth the drive.","p":"Couples who want a country stay, families and groups taking a villa, slow multi-night stays","st":"Restored hilltop borgo (Relais & Châteaux, Fora Reserve)","r":"","vis":"Visited October 2026","fh":1,"so":[["Dinner under the pergola.","Tables set under a reed roof with the valley laid out in front of you. Book it for sunset, when the light goes gold."],["The villas.","Around nine private villas spread across the estate, from two to five bedrooms. You get your own house, with hotel service and every amenity a short walk away."],["The best pool of the three borghi.","The main pool is cut into the hillside just below the villa, facing the view, and it beats the pools at Borgo San Felice and Il Borro. There’s a second pool and a separate kids’ pool too."],["Tennis, gym and spa.","A tennis court, a genuinely fantastic gym and a beautiful spa, enough to fill the days you don’t leave the estate."]],"k":[["It’s a bit remote, so you’ll want a car (or a driver).","That’s the point: this is a country, farm-stay kind of Tuscany. It’s about an hour and a half from Florence. Volterra, San Gimignano and my other Tuscany estates are all within easy reach; I arrange drivers who know the back roads."],["Traveling as a family or group? Ask about the villas.","They run from two to five bedrooms and vary in layout, privacy and view. Tell me who’s coming and I’ll match you to the right one. More on the villas →"],["Stay longer than one night.","This is a place to settle into. Plan for at least two or three nights so the pool, the dinners and the drives out don’t compete."],["There’s a sister house in Florence.","Borgo Pignano also runs a Florence address. I’ve stayed at both and can pair the city with the countryside in one trip."]],"img":"img/borgo-pignano-volterra-tuscany.jpg","u":"https://suiteswithkeith.com/hotels/borgo-pignano-volterra-tuscany.html"},{"s":"borgo-san-felice-tuscany","n":"Borgo San Felice","c":"Italy","a":"Tuscany","w":"Near Siena, Tuscany, Italy","v":"A truly perfect gem near Siena. It’s the most well-rounded borgo in Tuscany, and one of my favorite stays so far.","p":"Couples, first-timers to Tuscany, anyone who wants Siena close by and everything done well","st":"Restored medieval borgo among the vineyards (Fora Reserve)","r":"","vis":"Visited October 2026","fh":1,"so":[["A real feeling of home.","The staff remember you, the piazza fills up in the evening, and within a day the borgo feels like your village."],["Fantastic service and food.","Warm, polished and never stiff, and the cooking is a reason to eat in, especially dinner out in the piazza on a summer night."],["The borgo itself.","A medieval hamlet perfectly restored: stone lanes lined with flowers, a chapel, cypresses and the vineyards running right up to the edge."],["Tennis, gym and spa.","All on property, so the days you don’t leave the borgo are just as full as the days you do."]],"k":[["You’ll want a car (or a driver).","The borgo sits in the Chianti hills a short drive from Siena, and Florence is an easy day trip. I arrange drivers who know the back roads, and can link it with my other Tuscany estates."],["Book dinner in the piazza.","In summer, tables go out in front of the chapel with live music as the sun goes down. Tell me your dates and I’ll make sure you have one of those nights."],["Stay longer than one night.","This is a place to settle into. Plan for at least three nights so Siena, the vineyards and a slow day at the spa don’t compete."],["Three borghi, three different travelers.","Borgo Pignano, Borgo San Felice and Il Borro each suit a different traveler, and all three are fantastic. Borgo San Felice is the most well-rounded; tell me who’s coming and I’ll tell you which one is yours. Here are my side-by-sides: Borgo San Felice or Borgo Pignano and Borgo San Felice or Il Borro. Or see all three side by side."]],"img":"img/borgo-san-felice-tuscany.jpg","u":"https://suiteswithkeith.com/hotels/borgo-san-felice-tuscany.html"},{"s":"borgo-santandrea-amalfi","n":"Borgo Santandrea","c":"Italy","a":"Amalfi Coast","w":"Conca dei Marini, Amalfi Coast","v":"The modern, spectacular statement on the coast. Just think twice before booking a room with a private pool.","p":"Travelers who want a modern, spectacular statement and a real beach","st":"","r":"","vis":"","fh":1,"so":[["The beach.","Beautiful, massive and a proper beach."],["Alici.","Fantastic dining."],["The service.","Refined but warm."],["Modern, all the way through.","The rooms and the facilities feel different from every other hotel on the Amalfi Coast."]],"k":[["The private pool rooms are not that private.","You can look down on your neighbors, and they can look down on you. Not everyone will mind, but it is important to know. Tell me what matters to you and I will request the right room."],["The sun leaves the water early.","In the fall, your swim time ends around 4:30 or 5pm. If late-afternoon sun matters, Il San Pietro’s beach club is on the sunset side."],["When to go.","May to June, or September."],["It is not Positano.","This side of the coast is quieter. If you want the buzz, add a night or two at Le Sirenuse, and I can split the stay."]],"img":"img/borgo-santandrea-amalfi.jpg","u":"https://suiteswithkeith.com/hotels/borgo-santandrea-amalfi.html"},{"s":"bulgari-hotel-rome","n":"Bulgari Hotel Roma","c":"Italy","a":"Rome","w":"Rome, Italy","v":"Spectacular. Base rooms the size of junior suites elsewhere, marble and mosaics, a lively and sophisticated scene, more restaurants and bars than I could count, and the biggest gym in Rome.","p":"Travelers who want space, energy and great dining without leaving the hotel","st":"Modern and lively (Bulgari Hotels & Resorts)","r":"Spectacular, with the biggest base rooms in Rome","vis":"Visited October 2026","fh":1,"so":[["Very large base rooms.","What other hotels would sell as a deluxe room or a junior suite, so the entry rate already buys real space."],["Marble and mosaics.","Very modern design, lots of marble, and incredible mosaics in the bathrooms."],["A lively, sophisticated scene.","Almost like an EDITION, but much more polished."],["The location.","Right next to the Mausoleum of Augustus, which is almost done with its renovation."]],"k":[["The entry rooms are the value.","Because the base category is so generous, you often don’t need to upgrade to get space. I’ll tell you when a higher category is worth it."],["It’s on the lively side.","If you want quiet and calm, the Eden above the Spanish Steps is the one I’d pick."],["Compare the rest of Rome.","The de Russie for the garden, La Minerva for a real Roman neighborhood, the St. Regis for spectacle and the new Corinthia for space and a spa."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/bulgari-hotel-rome.jpg","u":"https://suiteswithkeith.com/hotels/bulgari-hotel-rome.html"},{"s":"burgenstock-resort-lake-lucerne","n":"Bürgenstock Resort","c":"Switzerland","a":"Switzerland","w":"Lake Lucerne, Switzerland","v":"The best backdrop in the sport, attached to one of Europe's great resort estates. It's an easy yes in Switzerland.","p":"Tennis travelers, wellness trips, Switzerland first-timers","st":"Alpine resort estate (Fora Reserve)","r":"#03 in my hotel tennis court ranking","vis":"","fh":0,"so":[["The best backdrop in the sport.","Courts 500 meters above Lake Lucerne. My #03 worldwide, and the view genuinely improves your forehand's mood."],["The timber-wrapped indoor court.","An alpine court framed by the peaks, so you can play in any weather without losing the setting."],["A resort at village scale.","Multiple hotels, serious dining, and a spa operation that anchors the whole ridge. Days of programming without leaving the mountain."]],"k":[["Choose your hotel within the resort.","Bürgenstock is several properties on one ridge, each with a different personality. Tell me the trip and I'll place you in the right one."],["It's a destination in itself.","Give it three nights minimum. The ridge rewards guests who settle in."],["Pair it with Gstaad.","The other Swiss stop on my tennis list is the Gstaad Palace, and the two make a spectacular alpine circuit by car or rail."]],"img":"img/burgenstock-resort-lake-lucerne.jpg","u":"https://suiteswithkeith.com/hotels/burgenstock-resort-lake-lucerne.html"},{"s":"cali-mykonos","n":"Cali","c":"Greece","a":"Mykonos","w":"Mykonos, Greece","v":"A genuinely remarkable property I'd happily return to, and I'd stay again just for that gym.","p":"Fitness-minded travelers, privacy seekers","st":"Independent luxury resort","r":"#08 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["The gym is genuinely remarkable.","Pilates reformers, squat racks, dumbbells up to 75 pounds, plus padel, tennis, and pickleball. I'd stay here again just for the gym."],["The infinity pool.","One of the largest and most distinctive in Greece, with generous spacing between loungers."],["Truly private plunge pools.","Many rooms have them, and unlike most of Greece, they actually feel private."],["Refined, personal service.","Staff greeted guests by name and anticipated needs. It felt like big-brand polish at an independent hotel."]],"k":[["It's far from the party scene, on purpose.","The hotel arranges boat or car transfers to the beach clubs and nightclubs if that's what you're after."],["The vibe is a little LA.","A somewhat American feel compared to Kalesma's laid-back Cycladic mood. Pick your flavor of Mykonos."],["Mykonos is a smart entry point.","Easy to reach from Europe and the Middle East: fly in, move south through the Cyclades, and save Athens for a separate trip."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, private boat days along the south coast or to Delos, and private boat transfers to Paros or Naxos instead of the ferry."]],"img":"img/cali-mykonos.jpg","u":"https://suiteswithkeith.com/hotels/cali-mykonos.html"},{"s":"canaves-ena-santorini","n":"Canaves Ena","c":"Greece","a":"Santorini","w":"Santorini, Greece","v":"The team here, especially longtime sales director Des, is a big reason I trust sending clients to this property.","p":"Value seekers, social travelers","st":"Intimate caldera boutique","r":"#05 in my Santorini ranking","vis":"Visited June 2026","fh":1,"so":[["The swim-up bar.","A fun, social addition on an island where most hotels are couples quietly keeping to themselves."],["The heritage.","17th-century wine caves, one family since the 80s. It's the most personal story on the Caldera."],["Higher on the Caldera.","Like Oia Suites, that elevation buys real privacy compared to most Caldera hotels."],["The 2024 renovation.","Minimalist but current. The update brought Ena fully up to the portfolio's standard."]],"k":[["Not every room has a water feature.","This is different from the Andronis properties, so check your category if a plunge pool or jacuzzi matters."],["Rooms are slightly smaller than Oia Suites.","The intimacy is the point, but square footage isn't the selling feature here."],["The value positioning doesn't always show up in the rate.","It's framed as the accessible Canaves, but pricing almost always lands right where Andronis Boutique does. Compare in my Santorini ranking."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, and private boats: a sunset cruise on the caldera, or private boat transfers to Folegandros, Milos or Ios instead of the ferry."]],"img":"img/canaves-ena-santorini.jpg","u":"https://suiteswithkeith.com/hotels/canaves-ena-santorini.html"},{"s":"canaves-epitome-santorini","n":"Canaves Epitome","c":"Greece","a":"Santorini","w":"Santorini, Greece","v":"If you're asking me for the single best hotel I experienced across the Greek islands on this trip, it's Canaves Epitome.","p":"Return visitors, families, privacy seekers","st":"Boutique luxury resort","r":"#01 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["The two-bedroom suites are the star.","Separated by floor, with large pools, decks, and outdoor dining areas. Some rooms sit below the pool with views looking up into the water."],["The best sunset in Greece.","A real sunset into the open Aegean, something the Caldera hotels physically cannot offer."],["Omnia was the best hotel restaurant I ate at across the entire trip.","Poolside above Ammoudi Bay, and worth booking even if you stay elsewhere."],["The gardens change the whole mood.","Volcanic-rock walls and serious landscaping turn the common areas into a private world minutes from Oia's crowds."]],"k":[["It's not on the Caldera.","First-time visitors picturing the classic cliffside image are choosing a different experience here. If that image is non-negotiable, book Canaves Oia Suites instead."],["Full-property buyouts are available.","With no age restrictions once the contract is signed. For families, Epitome’s own Five-Bedroom and Three-Bedroom Pool Villas are my pick for the best family villa in Santorini, and for a large group that wants a whole property in Oia, see Canaves Sunday."],["You still get the Canaves ecosystem.","Easy shuttle access connects you to the other Canaves properties and their restaurants and spas."],["Planning a wedding or full buyout?","Epitome's buyouts, room blocks, and guest logistics are exactly what I do. Start with my Santorini weddings page."]],"img":"img/canaves-epitome-santorini.jpg","u":"https://suiteswithkeith.com/hotels/canaves-epitome-santorini.html"},{"s":"canaves-oia-suites-santorini","n":"Canaves Oia Suites","c":"Greece","a":"Santorini","w":"Santorini, Greece","v":"For first-timers, honeymooners, and 40+ couples who want the classic Santorini experience, this is the one.","p":"First-timers, honeymooners, 40+ couples","st":"Caldera luxury hotel","r":"#03 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["The River Pool Suite is the single best suite I saw in Greece.","Across all 38 hotels on this trip. If it's available for your dates, stop deliberating."],["The best spa product on the Caldera.","Completely brand new, plus a large gym. Neither is a given at caldera hotels."],["Privacy engineered into the site.","Set higher on the Caldera than most, with coverings above every room's outdoor space."],["Private multi-bedroom villas.","Two- and three-bedroom pool villas are nearly nonexistent in Oia, and Canaves has them."]],"k":[["There's a 13+ age requirement.","Traveling with younger kids? Epitome, a short walk away, has no age restrictions."],["Complete privacy doesn't exist on the Caldera.","Anywhere. Canaves does a particularly good job with it, but set expectations accordingly."],["Compare the top tier before booking.","For honeymoons, weigh this against Andronis Boutique, Andronis Luxury Suites, and Canaves Ena. My Santorini ranking breaks down all of them."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, and private boats: a sunset cruise on the caldera, or private boat transfers to Folegandros, Milos or Ios instead of the ferry."]],"img":"img/canaves-oia-suites-santorini.jpg","u":"https://suiteswithkeith.com/hotels/canaves-oia-suites-santorini.html"},{"s":"canaves-sunday-santorini","n":"Canaves Sunday","c":"Greece","a":"Santorini","w":"Santorini, Greece","v":"For groups or buyouts needing flexibility and privacy, this is my pick for the best villa in Santorini, and the most budget-friendly door into Canaves.","p":"Groups, celebrations, budget-conscious Canaves fans","st":"Relaxed boutique & full buyout","r":"The Canaves portfolio, ranked","vis":"Visited June 2026","fh":1,"so":[["The full-property buyout.","The ten-bedroom villa plus all eight standalone suites. That's effectively eighteen bedrooms in the middle of Oia, and my pick for the best villa in Santorini for a big group. For one or two families, I’d look at the Epitome villas first."],["A 3-to-1 staff-to-guest ratio.","Villa privacy with hotel staffing is the combination standalone rentals can't match."],["The heart-of-Oia location.","The town's restaurants, galleries, and blue domes are outside the front door."],["Canaves service at the friendliest rate.","Suite for suite, the most accessible way into the portfolio."]],"k":[["Only the master suite has a private pool.","Everyone else shares the main pool. That's fine for a buyout group, but worth knowing for a couple booking a single suite. Sunday guests can also use the pool at Canaves Epitome, a short shuttle away."],["Age restrictions lift only on a buyout.","Booked as individual suites, standard Canaves age policies apply; signed as a full-villa contract, kids of any age are welcome."],["Book it as a celebration.","This property makes the most sense taken whole. Honeymoons and couples are better served at Oia Suites or Epitome."],["Planning a wedding here?","Buyouts, room blocks, and guest logistics are exactly what I do. Start with my Santorini weddings page."]],"img":"img/canaves-sunday-santorini.jpg","u":"https://suiteswithkeith.com/hotels/canaves-sunday-santorini.html"},{"s":"capella-kyoto","n":"Capella Kyoto","c":"Japan","a":"Kyoto","w":"Kyoto, Japan","v":"Culture without sacrificing polish. For design-minded couples, this is my current Kyoto pick.","p":"Design-led couples, culture seekers, onsen lovers","st":"Design hotel","r":"Featured · my Japan shortlist","vis":"","fh":0,"so":[["The Kengo Kuma pedigree.","One of Japan's defining architects, working in one of its most atmospheric districts."],["Private onsen suites.","The amenity that turns a Kyoto hotel stay into a ryokan-caliber ritual."],["The geisha-district address.","Miyagawa-chô is right at your doorstep."]],"k":[["New means still writing its story.","The design and location are proven; the property is earning its long-term reputation, which is exactly when preferred access is most valuable."],["Compare the Kyoto trio.","Aman for seclusion, Capella for design and district, the Ritz for a walkable full-service base."],["Book the onsen category.","If the private onsen is the draw (and it should be), confirm the suite category with me before rates move."]],"img":"img/capella-kyoto.jpg","u":"https://suiteswithkeith.com/hotels/capella-kyoto.html"},{"s":"capella-sydney","n":"Capella Sydney","c":"Australia","a":"Sydney","w":"Sydney, Australia","v":"A 1930s sandstone landmark reborn as the city's most polished luxury address, steps from Circular Quay, the Opera House, and the Royal Botanic Garden.","p":"First Sydney stays, business-plus-leisure, design & wellness travelers","st":"Heritage grand hotel, quietly contemporary","r":"","vis":"","fh":0,"so":[],"k":[],"img":"","u":"https://suiteswithkeith.com/hotels/capella-sydney.html"},{"s":"carneros-resort-napa","n":"Carneros Resort & Spa","c":"Napa & Sonoma","a":"Napa Valley","w":"Carneros, Napa Valley","v":"With a renovation, I honestly think this property could move several spots higher on this list.","p":"Families, multi-couple groups, older couples","st":"Cottage resort","r":"#08 in my Napa & Sonoma ranking","vis":"","fh":0,"so":[["It feels like wine country.","I prefer this location to Stanly Ranch. The vineyard-and-barn landscape is the real thing."],["Every cottage has private outdoor space.","The layout is built for slow mornings on your own patio."],["One of Napa's larger spas.","Serious square footage, and like the rooms, it will shine brightest after a refresh."],["The two-bedroom residences are fantastic.","The best product on the property, ideal for families and multi-couple groups."]],"k":[["A refresh would change everything.","The rooms and spa are ready for their next chapter, and my ranking already prices that in."],["Consistency varies.","Some stays have been flawless, others less so. Booking through me means someone is watching your file."],["Book the residences if you can.","I can't personally speak to the standard rooms, though most have private patios. The two-bedrooms are the play."]],"img":"img/carneros-resort-napa.jpg","u":"https://suiteswithkeith.com/hotels/carneros-resort-napa.html"},{"s":"casa-monti-rome","n":"Casa Monti","c":"Italy","a":"Rome","w":"Rome, Italy","v":"So cute. A great boutique hotel in the center of Rome, with real trattorias all around, a beautiful rooftop, a spa couples can have to themselves and a kind, welcoming team. A great option for anyone who wants something other than the classic luxury hotels.","p":"Younger couples and honeymooners who want something hip, young and fun","st":"Hip boutique hotel","r":"My pick for something other than classic luxury","vis":"Visited October 2026","fh":1,"so":[["The neighborhood.","Authentic Roman trattorias all around, full of Romans having Sunday lunch."],["The design.","Super cool patterns, and curtains that hide the TV. You can tell it’s from the team behind Le Fantaisie in Paris."],["Two restaurants.","A beautiful rooftop restaurant and a lively one downstairs."],["A spa you can privatize.","Book it just for the two of you, which makes it great for couples."]],"k":[["Who it suits best.","Younger couples, especially on their honeymoon, who want something more hip, young and fun than a grand hotel."],["An alternative to classic luxury.","If the Hassler or the de Russie feel too traditional, this is the one I’d send you to. For a palazzo by the Pantheon with the same real-Rome energy, look at La Minerva."],["Ask me about the private spa.","I’ll arrange it before you arrive so it’s set for your stay."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/casa-monti-rome.jpg","u":"https://suiteswithkeith.com/hotels/casa-monti-rome.html"},{"s":"castelfalfi-tuscany","n":"Castelfalfi","c":"Italy","a":"Florence","w":"Montaione, between Florence, Pisa and Siena, Tuscany, Italy","v":"A polished, modern resort in the Tuscan countryside, and a fantastic choice for families and for couples who want a resort-style stay. If an authentic, historic borgo is the point of your trip, I’d point you to Borgo Pignano, Borgo San Felice or Il Borro instead.","p":"Families, couples who want a resort feel, groups taking a villa","st":"Modern countryside resort beside a restored medieval borgo","r":"","vis":"Stayed September 2026","fh":1,"so":[["Built for families.","A kids club, lots of family room configurations and beautiful villas in the borgo itself. A great alternative for families who don’t want to pay Rosewood, COMO or Belmond prices."],["The pools and spa.","The main pool is enormous, and the spa’s infinity pool over the valley is stunning."],["Four restaurants.","Including one inside the old castle in the borgo, which is really unique, plus dining at the main pool. I had dinner at the casual Italian restaurant, a four-minute walk away: beautiful, and the pizza was great."],["The views.","Many rooms look out over the countryside."]],"k":[["Book a room with a terrace.","I was in a Prestige Belvedere room: well appointed, with a lovely view, but no terrace or outdoor space. Next time I’d book a room with a terrace."],["Or ask about the Tabaccaia.","The entry-level rooms in the Tabaccaia, the historic building across the street, have the charm of the old building. If character matters more than space, they’re a lovely choice."],["Families: look at the villas.","The villas in the borgo are fantastic for families and groups who want their own space with the resort on hand."],["It’s lively.","The terrace fills up at sunset, and the borgo gets busy with day visitors, especially on weekends. For something quieter and more romantic, look at Borgo Pignano, Borgo San Felice or Il Borro."]],"img":"img/castelfalfi-tuscany.jpg","u":"https://suiteswithkeith.com/hotels/castelfalfi-tuscany.html"},{"s":"cheval-blanc-paris","n":"Cheval Blanc Paris","c":"France","a":"Paris","w":"Paris, France","v":"LVMH's showpiece above La Samaritaine: just 72 rooms, Dior Spa, and the most coveted new address in Paris.","p":"Design lovers, fashion trips, repeat Paris visitors","st":"Modern palace (LVMH / Cheval Blanc)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/cheval-blanc-paris.jpg","u":"https://suiteswithkeith.com/hotels/cheval-blanc-paris.html"},{"s":"cheval-blanc-randheli-maldives","n":"Cheval Blanc Randheli","c":"Maldives","a":"Maldives","w":"Noonu Atoll, Maldives","v":"The only hotel on two of my lists at once. When service and setting both have to be perfect, this is my answer in the atolls.","p":"Honeymoons, service perfectionists, tennis travelers","st":"Private-island resort (LVMH)","r":"#11 on The Fifteen · #05 in my tennis ranking","vis":"","fh":0,"so":[["The most polished service in the atolls.","It holds #11 on The Fifteen because of execution, at a level even the Maldives' best rarely match."],["The tennis court.","A cerulean court cut into the jungle and ringed by palms. It's #5 on my world ranking of hotel tennis courts."],["Fora Reserve status.","One of the properties where my partner relationships carry the most weight for amenities and recognition."]],"k":[["It's a top-of-market splurge.","This sits at the very top of Maldives pricing, so I position it for honeymoons and milestone trips."],["Compare it against my proposal trio.","My sample Maldives proposal shows how I pair islands. Randheli can anchor a similar two-island itinerary."],["Tennis travelers, tell me.","Tell me you want to play and I'll build court time into the trip."]],"img":"img/cheval-blanc-randheli-maldives.jpg","u":"https://suiteswithkeith.com/hotels/cheval-blanc-randheli-maldives.html"},{"s":"chileno-bay-los-cabos","n":"Chileno Bay, Auberge Resorts","c":"Mexico","a":"Los Cabos","w":"Los Cabos, Mexico","v":"The Cabo I book when the goal is to think clearly by the water. It's calm and residential, on a beach you can actually swim at.","p":"Leadership retreats, modern-design lovers, low-key luxury","st":"Contemporary resort (Auberge)","r":"On my corporate travel shortlist","vis":"","fh":0,"so":[["The residential calm.","Quieter than the resort strip by design. It's the Cabo address that doesn't perform at you."],["The swimmable beach.","One of the only ones in Cabo, and you share it with a very short list of neighbors."],["Auberge service culture.","The same collection behind Auberge du Soleil on my honeymoon list. Quiet competence is a brand trait."]],"k":[["Smaller-group sweet spot.","My corporate pick for leadership retreats; full-scale incentive programs fit better at Montage."],["It's a contemporary build.","Travelers who want Cabo's history and lush grande-dame romance should look at Palmilla."],["Retreat logistics are my lane.","Offsites and leadership trips here run through my corporate travel practice."]],"img":"img/chileno-bay-los-cabos.jpg","u":"https://suiteswithkeith.com/hotels/chileno-bay-los-cabos.html"},{"s":"claridges-london","n":"Claridge's","c":"England","a":"London","w":"London, England","v":"The art deco icon and London's definitive grande dame, with impeccable service theater, the famous foyer tea, and suites that feel like private Mayfair flats.","p":"First London trips, tea devotees, celebration stays","st":"Art deco grande dame (Maybourne)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/claridges-london.jpg","u":"https://suiteswithkeith.com/hotels/claridges-london.html"},{"s":"collegio-alla-querce-florence","n":"Collegio alla Querce","c":"Italy","a":"Florence","w":"Florence, Italy","v":"Quiet, light and a view, with a countryside feel in the hills and Florence a scenic walk away.","p":"Return visitors, couples, families who want space to breathe","st":"Modern hillside retreat (Auberge)","r":"","vis":"Visited October 2026","fh":1,"so":[["The views.","Sweeping views from almost every room, with the city laid out below you."],["The art collection.","An impressive collection throughout, set against bright, modern interiors."],["The pool and three dining venues.","A beautiful pool, and three fantastic places to eat, so dinner in town is a choice, not a necessity."],["The bar in the old headmaster’s office.","The building was once a school, and the bar now sits in the headmaster’s former office. Super cool."]],"k":[["You’re up above the city.","It’s about a 30-minute walk into Florence, and a scenic one. If you’d rather step straight out into the streets, look at Four Seasons Firenze."],["Ask for the view you want.","Almost every room has one, and they differ. Tell me what matters and I’ll request the right room."],["Deciding between the two?","I’ve stayed here and toured both Four Seasons Firenze and Villa San Michele. Here’s my Four Seasons vs Collegio and Collegio vs Villa San Michele side-by-sides."],["Transfers and drivers, arranged.","I arrange private transfers from Florence’s airport or Santa Maria Novella station, and drivers for days in Chianti, Siena or the Val d’Orcia, so nobody has to navigate Tuscan back roads or park in a hill town."]],"img":"img/collegio-alla-querce-florence.jpg","u":"https://suiteswithkeith.com/hotels/collegio-alla-querce-florence.html"},{"s":"como-alpina-dolomites","n":"COMO Alpina","c":"Italy","a":"Dolomites","w":"Alpe di Siusi, Dolomites, Italy","v":"The best location in the Dolomites for walking straight out onto trails and slopes, with a spa and pool that hold their own against anyone. It's not quite the hotel Forestis, Gardena or Aman is, but the price reflects that.","p":"Skiers, hikers and wellness-minded couples","st":"Mountain wellness hotel","r":"","vis":"Stayed October 2026","fh":1,"so":[["True ski-in, ski-out.","The best on this list, by a distance. In summer the same applies to hiking: the trails start at your door."],["The spa and pool.","On par with the best in the region, in a hotel built around wellness."],["Spacious rooms.","Big decks and views, large bathrooms and deep tubs."],["The formal restaurant.","A very nice dinner, with great servers."]],"k":[["Watch out for the chairlift by the Mountain View rooms.","There’s a chairlift right outside them, so they can feel a little loud and not very private as people come up to hike and explore. I hadn’t anticipated it before arriving. In winter I don’t think it would bother you much, but in the shoulder season it’s very much in your view. Tell me how you’re traveling and I’ll steer you to the right room."],["Your car needs a permit.","The Alpe di Siusi is a protected area, and the road up is restricted. The hotel handles the permit; a private transfer avoids the question entirely."],["Expect German and Austrian sauna culture.","The main sauna areas are mixed, men and women together. You’ll walk around the spa in a towel or robe, but swimsuits and wraps come off in the saunas and steam rooms. Your body isn’t supposed to touch the wood, so you sit or lie on your towel in the saunas, and on a small towel in the steam rooms. It’s completely normal in this corner of Italy; the pools are swimsuit areas."],["Service can be a little uneven.","Good overall, and great in the formal restaurant, but occasionally awkward. Not a reason to skip it, just calibrate expectations against Forestis."]],"img":"img/como-alpina-dolomites.jpg","u":"https://suiteswithkeith.com/hotels/como-alpina-dolomites.html"},{"s":"como-castello-del-nero-tuscany","n":"COMO Castello del Nero","c":"Italy","a":"Tuscany","w":"Chianti, Tuscany, Italy","v":"A 12th-century castle that puts Florence and Siena both within reach. It's the smartest base on my Tuscany list.","p":"Wellness travelers, first-time Tuscany visitors, day-trippers","st":"Converted castle retreat (COMO)","r":"Featured on my Italy collection","vis":"Visited October 2026","fh":1,"so":[["The positioning.","Chianti's center, with Florence and Siena each an easy day trip. It's the best-connected estate on my Tuscany list."],["A 12th-century original.","Frescoes and chapel intact, converted with COMO's restraint rather than gutted."],["COMO Shambhala wellness.","The brand's signature spa and healthy kitchen make it the wellness-forward option among my Tuscany picks."]],"k":[["It's the day-tripper's estate.","If you plan to leave the property most days, this is the pick. If you plan never to leave it, look at Castiglion del Bosco."],["Chianti versus Val d'Orcia.","Chianti is vineyards and proximity; the Val d'Orcia is the wide-open postcard. Tell me which Tuscany you're picturing."],["Wellness travelers, weight this one.","The Shambhala programming is a genuine differentiator among Tuscan estates."],["Transfers and drivers, arranged.","I arrange private transfers from Florence, Pisa or Rome, and drivers for wine days and the hill towns, so you can enjoy the tastings without anyone having to drive."]],"img":"img/como-castello-del-nero-tuscany.jpg","u":"https://suiteswithkeith.com/hotels/como-castello-del-nero-tuscany.html"},{"s":"connaught-london","n":"The Connaught","c":"England","a":"London","w":"London, England","v":"Quieter and clubbier than its sibling Claridge's, and home to the Connaught Bar, Hélène Darroze's dining room, and the most discreet service in the city.","p":"Repeat visitors, privacy seekers, bar and food lovers","st":"Discreet luxury house (Maybourne)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/connaught-london.jpg","u":"https://suiteswithkeith.com/hotels/connaught-london.html"},{"s":"corinthia-rome","n":"Corinthia Rome","c":"Italy","a":"Rome","w":"Rome, Italy","v":"Wow. A showstopper renovation, a beautiful spa and large rooms, quiet and safe across from parliament. Truly a game changer for Rome.","p":"Travelers who want space, a real spa and a central, quiet base","st":"Grand new opening (Corinthia)","r":"A game changer for Rome","vis":"Visited October 2026","fh":1,"so":[["The renovation.","A showstopper from the moment you walk in."],["The location.","Across the street from parliament, so it’s incredibly safe, quiet, and walkable to everything."],["The spa and public spaces.","Beautiful, and big enough that the hotel never feels crowded."],["Large rooms.","Spacious and tastefully appointed, which is rare in the centro storico."]],"k":[["It’s new, so book with someone who knows it.","Room categories and views vary, and I’ll steer you to the right one."],["Compare the rest of Rome.","The Eden for warm, quiet romance, La Minerva for a real Roman neighborhood, the de Russie for the garden and the St. Regis for spectacle."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/corinthia-rome.jpg","u":"https://suiteswithkeith.com/hotels/corinthia-rome.html"},{"s":"cosme-paros","n":"Cosme","c":"Greece","a":"Paros & Antiparos","w":"Paros, Greece","v":"Paros’ best beach stay. The laid-back luxury is genuinely refreshing. The rates are high, but the base rooms are massive (larger than many hotels’ junior suites), which makes this the rare entry category I’d happily book.","p":"","st":"","r":"#09 of my Greece Top 10","vis":"Stayed June 2026","fh":1,"so":[],"k":[],"img":"img/cosme-paros.jpg","u":"https://suiteswithkeith.com/hotels/cosme-paros.html"},{"s":"danieli-four-seasons-venice","n":"The Danieli","c":"Italy","a":"Venice","w":"Venice, Italy","v":"The lobby is a showstopper and the rooftop restaurant has one of the great views in Venice. A classic, grand Venice stay, right at the heart of the city.","p":"First-time visitors, Four Seasons loyalists, travelers who want to be at San Marco","st":"","r":"","vis":"Visited October 2026","fh":1,"so":[["The lobby.","The Gothic atrium, with its arcades, candle sconces and stained-glass skylight, is the great see-and-be-seen room in Venice."],["The rooftop.","Terrazza Danieli has one of the best views in the city, over the Salute and the lagoon."],["The lagoon views.","Lagoon-facing rooms look straight across to San Giorgio Maggiore."],["Upgrade odds.","A bigger hotel has more rooms to upgrade you into."]],"k":[["It is busy outside.","The Riva is the liveliest waterfront in Venice, which is part of the fun. If you would rather come home to calm, look at Airelles Palladio or Aman."],["Book a lagoon view.","The rooms are classic; the view is what makes them."],["Service at scale.","A larger hotel runs differently from a small palazzo, and my relationships with the team mean my clients are looked after."],["The spa is now open.","There is no pool, but the new spa has opened, a welcome addition to a classic hotel."]],"img":"img/danieli-four-seasons-venice.jpg","u":"https://suiteswithkeith.com/hotels/danieli-four-seasons-venice.html"},{"s":"ellerman-house-cape-town","n":"Ellerman House","c":"Africa","a":"South Africa","w":"Cape Town, South Africa","v":"A 13-room Relais & Châteaux house above the Atlantic with a private art collection and wine gallery. The gateway stay before or after safari, and reason enough to linger.","p":"Safari bookends, art and wine lovers, honeymoon landings","st":"Private-house hotel (Relais & Châteaux)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/ellerman-house-cape-town.jpg","u":"https://suiteswithkeith.com/hotels/ellerman-house-cape-town.html"},{"s":"erema-milos","n":"Erēma, a Member of Design Hotels","c":"Greece","a":"Milos","w":"Milos, Greece","v":"Refreshingly understated, and one of the island's strongest luxury stays for design, privacy, and the slower side of Milos.","p":"Couples, design lovers, privacy, luxury escapes","st":"Contemporary Cycladic estate","r":"Featured in my Milos guide","vis":"Visited June 2026","fh":1,"so":[["The Horizon Suite with Private Pool is the room I'd book.","Expansive indoor-outdoor living with uninterrupted Aegean views and exceptional privacy."],["The private-estate feel.","Secluded, quiet and design-forward, which is genuinely rare among new Cycladic openings."],["The pedigree.","Same group as Cosme and Parīlio on Paros, and my comparison of the two explains why that matters."]],"k":[["Stay at least three nights.","Milos deserves more than a quick stop, and Erēma is best enjoyed at a slower pace."],["Pair your stay with a private boat day.","Seeing Milos from the water completely changes the experience, and Erēma makes the perfect base."],["Plan beach time into your itinerary.","The hotel feels wonderfully secluded, but some of Milos' best beaches are only a short drive away."],["Can't choose between Cosme and Parīlio?","The better question is whether you should be doing two islands instead of one. Paros then Milos, ending here."]],"img":"img/erema-milos.jpg","u":"https://suiteswithkeith.com/hotels/erema-milos.html"},{"s":"forestis-dolomites","n":"Forestis","c":"Italy","a":"Dolomites","w":"Above Bressanone, Dolomites, Italy","v":"A fantastic hotel I’d recommend without hesitation for peace and quiet, wellness, great food and awe-inspiring views. Ask me to secure a high floor in the tower closest to the lodge.","p":"Couples, solo travelers, wellness trips, and families or groups in the private villa","st":"Alpine wellness retreat","r":"","vis":"Stayed October 2026","fh":1,"so":[["The view of the Odle.","Unmatched among the Dolomites’ luxury hotels. Even the reception terrace is incredible at sunset."],["The spa.","Two pools, indoor and outdoor and connected by a glass door, both heated to around 32°C (90°F), with attentive staff throughout. Inside are relaxation rooms, a blacked-out sensory room, a swimsuit sauna, and a separate sauna area with three saunas, a steam room, a cold plunge and a heated plunge pool. My 90-minute deep-tissue massage was excellent and very reasonably priced, at about €260 when I visited."],["The dining.","Half board covers breakfast and dinner in either restaurant. Breakfast is served in the main dining room, with its cathedral-style booths and extraordinary views. The seven-course tasting menu was a highlight, and the more casual upstairs restaurant serves generous portions. The wine list is excellent."],["The tower suites.","Scandinavian in feel, with spacious balconies and daybeds, large bathrooms with tubs and walk-in showers, heated floors and Dyson hairdryers."]],"k":[["Your floor and tower matter, and only a request secures them.","There’s no separate room category for higher floors or a particular tower; a tower suite can be on any floor of any of the three towers. The best views of the Odle are from the fourth or fifth floor and above, in the tower closest to the historic lodge and in the middle tower, where you’re above the tree line. Securing one of those is the real upgrade here, and it’s exactly what I push for with the team for my clients."],["The lodge suites are good value.","The suites in the historic lodge are spacious and well priced. If the tower suites are beyond the budget, I’d happily book one."],["Expect German and Austrian sauna culture.","The main sauna area is mixed. You walk around in a towel or robe, but it comes off in the saunas and steam room, which is normal in this corner of Italy. Your body isn’t supposed to touch the wood, so you sit or lie on your towel in the saunas, and on a small towel in the steam room. There’s also a swimsuit sauna if you prefer."],["There’s nowhere else to eat nearby.","For stays longer than three nights, plan on rotating between the two restaurants’ menus."]],"img":"img/forestis-dolomites.jpg","u":"https://suiteswithkeith.com/hotels/forestis-dolomites.html"},{"s":"fouquets-mykonos","n":"Fouquet's Mykonos","c":"Greece","a":"Mykonos","w":"Mykonos, Greece","v":"The energy of Mykonos' south coast with the comforts of a true luxury resort. It's my Best New Resort in Greece.","p":"Luxury travelers, couples, groups, celebrations","st":"South-coast luxury resort","r":"Best New Resort, The Greece Collection","vis":"Visited June 2026","fh":1,"so":[["Dinner at ZUMA.","One of the strongest dining experiences on Mykonos and worth planning an evening around, even if you're staying elsewhere."],["The underground sports court.","A massive subterranean basketball court that's unlike anything you'll find at most luxury resorts."],["Walk to Paraga Beach or Scorpios.","Being able to leave the car behind is one of the hotel's biggest advantages."],["The Aegean Suite with Private Pool is the room I'd book.","Expansive outdoor living with one of the property's best balances of privacy, space, and sea views."]],"k":[["It's on the energetic side of the island.","That's the point. If you want quiet beachfront instead, look at Bill & Coo."],["Book beach clubs before you land.","Scorpios and the south-coast clubs fill up, and my already-booked Mykonos page covers the reservations worth making now."],["New-build polish, real resort comforts.","The finished property exceeded the expectations I formed touring it under construction. That almost never happens."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, private boat days along the south coast or to Delos, and private boat transfers to Paros or Naxos instead of the ferry."]],"img":"img/fouquets-mykonos.jpg","u":"https://suiteswithkeith.com/hotels/fouquets-mykonos.html"},{"s":"four-seasons-astir-palace-athens","n":"Four Seasons Astir Palace","c":"Greece","a":"Athens","w":"Athens Riviera, Greece","v":"Astir Palace feels like two vacations in one. Few hotels balance city and beach this easily.","p":"Families, beach lovers, celebrations, extended stays","st":"Seaside urban resort","r":"Featured in my Athens guide","vis":"Visited June 2026","fh":1,"so":[["The private coves deserve more than a quick swim.","Astir's beach club is one of the Riviera's biggest advantages, so spend a full afternoon there."],["Pelagos is worth planning your evening around.","One of the best Michelin-starred meals in Greece, right on property. Manko is the other table I send clients to on the peninsula."],["The Sea View Bungalow Suite is the room I'd book.","Privacy, generous outdoor space, and direct access to the Riviera lifestyle."]],"k":[["It's a resort first, a city base second.","If your trip is museums and rooftops, stay at The Dolli instead. Or better, split the stay and do both."],["Explore Vouliagmeni.","Walk to the lake or enjoy dinner in town before returning to the calm of the peninsula."],["Few hotels balance city and beach this easily.","That makes it ideal for families and longer stays where one member of the party wants beach days and another wants the Acropolis."],["Transfers and onward travel, arranged.","I arrange private airport transfers and your onward travel to the islands: fast ferries from Piraeus or Rafina, or a helicopter straight to your island."]],"img":"img/four-seasons-astir-palace-athens.jpg","u":"https://suiteswithkeith.com/hotels/four-seasons-astir-palace-athens.html"},{"s":"four-seasons-hotel-firenze","n":"Four Seasons Hotel Firenze","c":"Italy","a":"Florence","w":"Florence, Italy","v":"Resort-like calm inside the city center, and the only Florence hotel where the garden competes with the art.","p":"Families, longer Florence stays, garden lovers","st":"Palazzo resort (Four Seasons)","r":"Featured on my Italy collection","vis":"Visited October 2026","fh":1,"so":[["The garden.","One of Florence's largest private gardens, with acres of green the city simply doesn't offer anywhere else."],["Two Renaissance palazzos.","Frescoed, restored, and museum-grade. The rooms live inside genuine Renaissance fabric."],["Classic Italian rooms.","A classic take on Italian style, set inside genuine Renaissance architecture."],["Resort infrastructure in the centro.","Pool, spa and garden dining, so you get the full resort day without leaving the city limi
