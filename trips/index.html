neyard room.","Waking up and sitting by your fire pit overlooking the vineyards never gets old. It's why they're my clear pick over the mountain and oak categories."],["The best restaurant view on my list.","Dinner looks out over the vines and hills, and no other wine country dining room matches it."],["They remember you.","There's one masseuse in particular I make a point to see every time I go. The returning-guest experience is real."],["The Healdsburg shuttle.","Complimentary rides to the plaza mean nobody argues about who's driving home from dinner."]],"k":[["Twenty stays in, I notice the small things.","A few more little misses lately than in year one. Nothing that moves it from my top three, and the team always makes it right."],["Choose your room category deliberately.","Vineyard rooms are the property's magic; the others are lovely but miss the signature view."],["Healdsburg is Sonoma, not Napa.","A more relaxed, less commercial base. It's my preference, but know which valley you're signing up for."]],"img":"img/montage-healdsburg.jpg","u":"https://suiteswithkeith.com/hotels/montage-healdsburg.html"},{"s":"montage-los-cabos","n":"Montage Los Cabos","c":"Mexico","a":"Los Cabos","w":"Los Cabos, Mexico","v":"My first recommendation in Cabo for couples, families, and companies alike. Very few resorts can say that.","p":"First Cabo trips, incentive groups, families","st":"Luxury beach resort (Montage)","r":"Featured · my Los Cabos shortlist","vis":"","fh":0,"so":[["Santa Maria Bay.","One of the few genuinely swimmable beaches in Cabo, and the single biggest differentiator on this coast."],["Understated design, standout service.","The formula that makes it my first recommendation here."],["Scale that swallows a group.","Multiple restaurants, a full spa, and room for a large incentive group without crowding. It's my top Cabo pick for corporate travel."]],"k":[["Big is a feature and a trade.","Groups and families love the scale; couples wanting residential quiet should compare Chileno Bay next door."],["Corporate groups, start with me.","Room blocks, buyout logistics, and incentive programming here are exactly what my corporate travel practice does."],["Whale season is December–April.","Humpbacks calve in these waters. I time trips and book the private boat."]],"img":"img/montage-los-cabos.jpg","u":"https://suiteswithkeith.com/hotels/montage-los-cabos.html"},{"s":"mystique-santorini","n":"Mystique","c":"Greece","a":"Santorini","w":"Santorini, Greece","v":"For now, it's my top Bonvoy-points play on the caldera. For cash stays, I tend to guide clients a notch up my list until the next chapter arrives.","p":"Marriott Bonvoy redemptions","st":"Caldera resort (Marriott Luxury Collection)","r":"#09 in my Santorini ranking","vis":"Visited June 2026","fh":1,"so":[["The location and the bones.","The caldera perch is real, and the sculpted architecture photographs beautifully. The raw material for a great hotel is all here."],["The Empiria Group connection.","The same team runs some of the best hotels in the Cyclades, which is exactly why I believe a renovation would change everything."],["A points sweet spot.","If you're sitting on Marriott Bonvoy points, this is one of the highest-value caldera redemptions that exists."],["Earth tones instead of white.","Mystique's warm, sculpted look is a genuine change from Santorini's standard whitewash, and when it's lit well, it's special."]],"k":[["Privacy is limited.","More so than at the top of my list. Room selection and expectations matter here, and I can help with both."],["The cave rooms run dark and quiet.","It's signature Mystique, wonderfully moody for some travelers and spare for others. Ask me about specific categories before booking."],["Paying cash? Let's compare.","At cash rates, it's worth weighing against my top five on Santorini. On points, it's hard to beat."],["Transfers and private boats, arranged.","I arrange private transfers from the airport or port, and private boats: a sunset cruise on the caldera, or private boat transfers to Folegandros, Milos or Ios instead of the ferry."]],"img":"img/mystique-santorini.jpg","u":"https://suiteswithkeith.com/hotels/mystique-santorini.html"},{"s":"naviva-punta-mita","n":"Naviva, A Four Seasons Resort","c":"Mexico","a":"Punta Mita","w":"Punta Mita, Mexico","v":"Fifteen tented villas hidden in the Punta Mita jungle. Adults-only, wellness-driven, and as close to a private nature reserve as Mexico gets.","p":"Honeymoons, wellness resets, couples seeking privacy","st":"Adults-only tented jungle retreat","r":"Featured · my Punta Mita shortlist →","vis":"","fh":0,"so":[],"k":[],"img":"img/naviva-punta-mita.jpg","u":"https://suiteswithkeith.com/hotels/naviva-punta-mita.html"},{"s":"nos-sifnos","n":"NOS","c":"Greece","a":"Sifnos","w":"Sifnos, Greece","v":"A hotel that feels deeply connected to Sifnos, and one of my favorite stays in the Cyclades.","p":"Adults, quiet luxury, design lovers, wellness","st":"Minimalist boutique hotel","r":"Featured in my Sifnos guide","vis":"Visited June 2026","fh":1,"so":[["Wake up for sunrise.","The east-facing views make early mornings one of the most memorable parts of staying here."],["The Faros Superior is the room I'd book.","Sun-washed interiors, generous indoor-outdoor living, and the easy simplicity that defines NOS."],["An afternoon of doing nothing.","NOS is one of the few hotels where lingering by your suite feels just as rewarding as exploring the island."]],"k":[["This is quiet luxury, deliberately.","Adults, design lovers, and wellness travelers will love it; anyone chasing scene and nightlife should look at Mykonos instead."],["Walk into Faros for dinner.","The fishing village feels refreshingly untouched, with some of Sifnos' best waterfront tavernas."],["Sifnos asks you to linger.","Some islands ask you to see more. This one doesn't. Build your itinerary accordingly, and my Sifnos guide shows how."],["Transfers and private boats, arranged.","I arrange private transfers from the port, and private boat transfers from Milos or Paros, which is far easier than Sifnos’s limited ferry schedule."]],"img":"img/nos-sifnos.jpg","u":"https://suiteswithkeith.com/hotels/nos-sifnos.html"},{"s":"odera-tinos","n":"Odera","c":"Greece","a":"More islands","w":"Tinos, Greece","v":"The first five-star hotel on Tinos. Tinian stone above Vourni beach, on the island where eating and walking are the itinerary.","p":"Walkers, food-driven travelers, couples, design lovers","st":"Village-inspired resort, Autograph Collection","r":"","vis":"","fh":0,"so":[],"k":[],"img":"","u":"https://suiteswithkeith.com/hotels/odera-tinos.html"},{"s":"one-and-only-aesthesis-athens","n":"One&Only Aesthesis","c":"Greece","a":"Athens","w":"Athens Riviera, Greece","v":"The Riviera beach day I already write into my itineraries, booked as its own stay when the trip calls for it.","p":"Beach days, honeymoon starts, Riviera loyalists","st":"Riviera beach resort","r":"Featured in my Athens planning","vis":"Visited June 2026","fh":1,"so":[["The Mãnko Beach cabana day.","The exact day I write into my sample honeymoon itinerary: a Riviera beach afternoon before a rooftop dinner in the city."],["The Riviera position.","A true beach resort within striking distance of the Acropolis. That combination makes Athens more than a stopover."],["It plays well with others.","Easy to pair with The Dolli in the city or Astir Palace on the peninsula for a two-hotel Athens chapter."]],"k":[["Athens deserves two full days minimum.","Don't treat the Riviera as a layover. My Athens guide lays out three perfect days including the Riviera."],["Choose your Riviera flag deliberately.","Astir Palace is the peninsula resort I've walked myself, and Aesthesis is the beach-scene alternative. I'll match you to the right one."],["Cabana days need booking.","Like the island beach clubs, the good real estate at Mãnko goes early in peak season, so I reserve it when I confirm the room."],["Transfers and onward travel, arranged.","I arrange private airport transfers and your onward travel to the islands: fast ferries from Piraeus or Rafina, or a helicopter straight to your island."]],"img":"img/one-and-only-aesthesis-athens.jpg","u":"https://suiteswithkeith.com/hotels/one-and-only-aesthesis-athens.html"},{"s":"one-and-only-kea","n":"One&Only Kea Island","c":"Greece","a":"More islands","w":"Kea (Tzia), Greece","v":"The One&Only flag in the Greek islands: 63 cliffside pool villas on the quiet island an hour from Athens, without the circuit's foot traffic.","p":"Privacy seekers, families, One&Only loyalists, Athens pairings","st":"All-villa cliffside resort & private homes","r":"","vis":"Visited June 2026","fh":1,"so":[],"k":[],"img":"","u":"https://suiteswithkeith.com/hotels/one-and-only-kea.html"},{"s":"one-and-only-portonovi-montenegro","n":"One&Only Portonovi","c":"Montenegro","a":"Montenegro","w":"Portonovi, Montenegro","v":"Next up in my guide, on my booking list today. When I've walked it, you'll get the full scored review.","p":"Adriatic first-timers, spa travelers, marina life","st":"Marina-front resort","r":"Next up in my Montenegro guide","vis":"","fh":0,"so":[["Why it's on my list.","A major resort brand on a coastline with very few true luxury options. The supply-demand math alone earns it a look."],["The Montenegro context I already have.","Having scored Mamula as a guest and toured Aman Sveti Stefan with its GM, I know exactly what the local bar is, and where it isn't being met."],["The honest-guide format.","When I do visit, Portonovi gets the same treatment as the others: full scoring, no press materials, clearly labeled."]],"k":[["I haven't visited yet.","That's stated plainly in my Montenegro guide, the same guide where I publish complete scores when I have them."],["Fly into Tivat.","The same arrival advice I give for the whole coast: international arrivals clear immigration before any onward transfer."],["Building a full Adriatic trip?","I pair Montenegro's hotels hotel-by-hotel. Tell me your dates and I'll tell you honestly which property earns which nights."]],"img":"img/one-and-only-portonovi-montenegro.jpg","u":"https://suiteswithkeith.com/hotels/one-and-only-portonovi-montenegro.html"},{"s":"oneandonly-mandarina","n":"One&Only Mandarina","c":"France","a":"French Riviera","w":"Riviera Nayarit, Mexico","v":"The most architecturally exciting resort on the Pacific coast, and the one design lovers should fly for.","p":"Design lovers, honeymoons, jungle-meets-ocean trips","st":"Rainforest cliffside resort","r":"Featured · my Riviera Nayarit shortlist","vis":"","fh":0,"so":[["The treehouse villas.","Folded into the cliffside canopy, with the boldest architecture on this coast."],["Jungle meets ocean.","The rainforest-to-Pacific setting no Cabo property can offer."],["The quiet-polish coast.","Riviera Nayarit's lushness with One&Only's service behind it."]],"k":[["Cliffside means vertical.","The topography is the drama, so guests with mobility concerns should talk villa placement with me first."],["It's the lush, quiet coast.","Cabo's energy is a different trip, and my Montage and Palmilla pages cover that side."],["Families may prefer the neighbor.","Four Seasons Punta Mita is my standby when the group includes kids."]],"img":"img/oneandonly-mandarina.jpg","u":"https://suiteswithkeith.com/hotels/oneandonly-mandarina.html"},{"s":"oneandonly-palmilla-los-cabos","n":"One&Only Palmilla","c":"Mexico","a":"Los Cabos","w":"Los Cabos, Mexico","v":"The original Cabo icon. When the trip is a statement, this is still the address that makes it.","p":"Milestone trips, romantics, full-property buyouts","st":"Grande dame resort","r":"Featured · my Los Cabos shortlist","vis":"","fh":0,"so":[["The grande dame factor.","Lush grounds and decades of story. It's the original Cabo icon, still impeccably serviced."],["The swimmable cove.","Like Montage's Santa Maria Bay, one of Cabo's rare genuinely swimmable stretches."],["The legendary zz to them."],["A real Roman neighborhood.","Step out by the Pantheon into the city as Romans actually live it."]],"k":[["The views are lived-in Rome.","Expect neighborhood rooftops and lived-in Rome around you. I love that, but if the postcard view matters most, ask me about the Eden."],["Who it suits best.","Younger travelers and couples who want energy and a bit of personality. Older travelers usually feel more at home at the Hotel Eden."],["Riding La Dolce Vita?","Journeys start in Rome, so I put clients at La Minerva first. Here’s how I put the train and the two Orient Express hotels together."],["Compare the rest of Rome.","The de Russie for the garden, the St. Regis for spectacle, and the new Corinthia for the showstopper renovation."]],"img":"img/orient-express-la-minerva-rome.jpg","u":"https://suiteswithkeith.com/hotels/orient-express-la-minerva-rome.html"},{"s":"orient-express-venice","n":"Orient Express Palazzo Donà Giovannelli","c":"Italy","a":"Venice","w":"Venice, Italy","v":"“It is almost overwhelming how beautiful this property is.” I said that out loud on the tour, and I meant it.","p":"Design lovers, couples, travelers arriving by train","st":"","r":"","vis":"Visited October 2026","fh":1,"so":[["The marble.","Around seventy kinds, book-matched in the bathrooms and set against dark wood throughout."],["The ceilings and chandeliers.","Painted and coffered ceilings restored to their original glory, lit by Murano glass."],["The restoration.","Eight years of work, and it shows in every room."],["The location.","Quiet but convenient: a calm corner of Cannaregio, close to the station and an easy walk to the sights."]],"k":[["Ask for the piano nobile.","The noble floor, one level above the ground floor, has the highest ceilings, here and in palazzi across Italy."],["There is no pool.","This is a palazzo hotel. If a pool matters, look at Airelles Palladio on Giudecca."],["Easy by train.","It is close to Santa Lucia station, so it works well if you are arriving from Florence, Milan or the Dolomites by rail."],["Three nights is the sweet spot.","Long enough for the city, the islands and a few long lunches."]],"img":"img/orient-express-venice.jpg","u":"https://suiteswithkeith.com/hotels/orient-express-venice.html"},{"s":"palazzo-avino-ravello","n":"Palazzo Avino","c":"Italy","a":"Amalfi Coast","w":"Ravello, Italy","v":"A beautiful, historic and very pink palazzo in quiet Ravello, with sweeping views and a lovely pool at a gentler rate. Book it for the village and the seclusion, not for the beach.","p":"Travelers who want seclusion, a real village and a lower rate than the coast","st":"Historic pink palazzo in Ravello","r":"On my Amalfi Coast guide","vis":"Visited October 2026","fh":1,"so":[["Sweeping views.","Mountain and sea views from the rooms, over Ravello and down the coast."],["Tiered gardens and the pool.","The gardens step down the hillside to a beautiful pool overlooking the town below."],["Historic, and very pink.","A historic palazzo with a playful pink palette, from striped headboards to onyx basins."],["Quiet Ravello.","A real village that is not overrun by day-trippers, which is the whole selling point."]],"k":[["The beach is a drive away.","The beach club is 15 to 20 minutes down a windy, steep road. If walking down to the water matters, look at Hotel Santa Caterina, Il San Pietro or Miramalfi."],["Mind the view below.","A fairly unsightly building sits below the property. Some guests will not mind it, but I would rather you hear it from me."],["It is very quiet.","Especially in the indoor common areas. If you want energy and a scene, Positano is the other end of the spectrum."],["Split the stay.","Three nights in Ravello and three on the water is the version I would book: the village and the views here, then a hotel where you can swim off the rocks."]],"img":"img/palazzo-avino-ravello.jpg","u":"https://suiteswithkeith.com/hotels/palazzo-avino-ravello.html"},{"s":"parilio-paros","n":"Parilio","c":"Greece","a":"Paros & Antiparos","w":"Paros, Greece","v":"I'm very pro private-villas-at-hotels these days versus standalone villas, and Parilio's are the best case for it.","p":"Design lovers, couples, families & groups","st":"Design hotel & villas","r":"#04 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["Request the Sun Suite up at the villas.","One of the three Sun Suites sits at the new hilltop villas, with ocean views and a massive private pool. Ask for that specific one when booking."],["The new villas are a sneaky value.","Three-bedroom villas run around $3,000–$3,500 per night in peak season. They're brand new, with full access to the hotel's amenities. For a group or family, that's genuinely reasonable at this level."],["Twilight at the pool.","The property's geometry and light around sunset are the most photographed thing on Paros for a reason."],["Free access to Cosme's beach club.","A short hop away, directly on the water in front of Cosme."]],"k":[["Most rooms don't have ocean views.","If waking up to water is the priority, look at Cosme, or take the hilltop villas here."],["July brings families to the pool.","It was tranquil during my stay, but peak-summer guests told me to expect kids. That's Paros in July."],["Torn between Parilio and Cosme?","I wrote a full head-to-head comparison after staying at both."],["Transfers and private boats, arranged.","I arrange private transfers from the port or airport, private boat days to Antiparos and the small islands, and private boat transfers to Mykonos or Naxos instead of the ferry."]],"img":"img/parilio-paros.jpg","u":"https://suiteswithkeith.com/hotels/parilio-paros.html"},{"s":"passalacqua-lake-como","n":"Passalacqua","c":"Italy","a":"Lake Como","w":"Moltrasio, Lake Como, Italy","v":"A villa you never want to leave. Book it for a milestone. It's worth every euro if the moment calls for it.","p":"Honeymoons, milestones, two couples traveling together","st":"Historic villa showpiece (Fora Reserve)","r":"#05 in The Fifteen, my honeymoon shortlist","vis":"Toured October 2026","fh":1,"so":[["A villa run like a private home.","24 rooms, staff who remember your name, and the feeling of being a guest at an 18th-century estate rather than a hotel. It’s whimsical: antiques the family collected over time, and lots of wicker throughout."],["The sunken clay court.","One of the most iconic courts in the world, perched above Lake Como in the terraced gardens and framed by cypress and the Alps. It's #04 on my tennis list."],["The terraced gardens.","They fall from the villa to the water, and they're the setting that made it the most celebrated new hotel in Europe."],["The spa and the tunnel.","The spa is Moroccan-inspired, with vaulted ceilings, old stone columns, pierced brass lanterns and peacock wicker chairs, and an underground tunnel leads down to the lower gardens. It’s one of my favorite details on the lake."]],"k":[["It's small and books far ahead.","Only a handful of suites, so the sooner we hold dates, the better. This is the single hardest confirmation on the lake."],["The Junior Suite Al Lago is the one.","It opens right toward the water. It's the room I show in my Lake Como proposal for milestone trips. Rooms in the Palazzo and the lakeside rooms are generously sized; rooms elsewhere can be small, and because this is a terraced garden property, most rooms see the lake in the distance rather than up close."],["Only guests get in.","The restaurants and spa are closed to outside visitors, which is a big part of why it feels so private. If you’re staying nearby and want to see it, I can sometimes arrange a lunch or a tour for my clients."],["Plan a few dinners out.","There are only two restaurants, and Moltrasio is a quiet village without much going on. Dinner across the lake by boat is the best way to do it, and I’ll set it up. One small note: clients who stayed recently found the pool service slow."]],"img":"img/passalacqua-lake-como.jpg","u":"https://suiteswithkeith.com/hotels/passalacqua-lake-como.html"},{"s":"patina-maldives","n":"Patina Maldives, Fari Islands","c":"Maldives","a":"Maldives","w":"Fari Islands, Maldives","v":"Patina is genuinely exciting (my words from the proposal), and the strongest first act a Maldives honeymoon can have.","p":"Design & dining lovers, social honeymooners","st":"Contemporary design resort","r":"Anchors my Design Escape itinerary","vis":"","fh":0,"so":[["The design and dining, together.","Best-in-class on both counts, and the reason it opens my Design Escape itinerary."],["The easy speedboat start.","On the sand within an hour of landing, with the seaplane saved for mid-trip scenery."],["The art-forward energy.","A marina, galleries, and a social pulse most Maldivian islands deliberately lack."]],"k":[["Patina's energy is social.","My exact caveat in the proposal: couples wanting hush from day one should reverse the order or choose differently."],["Villa categories matter.","In my sample proposal, a Fari Studio starts the trip and a pool villa upgrade runs from about $1,400 a night. I'll price both for your dates."],["It's built to be paired.","Ten nights across two islands is the structure. See the full proposal for how I sequence it."]],"img":"img/patina-maldives.jpg","u":"https://suiteswithkeith.com/hotels/patina-maldives.html"},{"s":"peninsula-tokyo","n":"The Peninsula Tokyo","c":"Japan","a":"Tokyo","w":"Tokyo, Japan","v":"For a first visit to Tokyo, location matters more than anything, and nobody's is better.","p":"First-time Tokyo visitors, families, location-first travelers","st":"Classic grand hotel","r":"Featured · my Japan shortlist","vis":"","fh":0,"so":[["The Ginza address.","Literally in the middle of everything, and the best first-visit location in Tokyo."],["Classic Peninsula service.","A grand-hotel tradition executed at Forbes Five-Star level."],["The first-timer's anchor.","The Tokyo base I use in more first-Japan itineraries than any other."]],"k":[["Classic in style.","Travelers who want bold contemporary design should compare Mandarin Oriental. The Peninsula's appeal is that it's timeless."],["Central means lively.","This is the middle of the city; for hush above the fray, Aman Tokyo is my answer."],["Let the location do the work.","Base here and I'll build the days: sushi masterclasses, sumo mornings, and guides who know every stall."]],"img":"img/peninsula-tokyo.jpg","u":"https://suiteswithkeith.com/hotels/peninsula-tokyo.html"},{"s":"perma-serifos","n":"Perma","c":"Greece","a":"More islands","w":"Serifos, Greece","v":"Five stone residences above a secluded cove. It's an adults-only wellbeing retreat on the island that never got a scene.","p":"Couples, design obsessives, hikers, true quiet-seekers","st":"Architect-designed micro-retreat, adults only","r":"","vis":"","fh":0,"so":[],"k":[],"img":"","u":"https://suiteswithkeith.com/hotels/perma-serifos.html"},{"s":"portrait-firenze","n":"Portrait Firenze","c":"Italy","a":"Florence","w":"Lungarno Collection, Florence","v":"A highlight of my time in Florence: a small hotel on the Arno where the service makes you feel genuinely valued, and the Ponte Vecchio fills the window.","p":"Couples, fans of Italian design, anyone who wants high-touch service that never feels invasive","st":"","r":"","vis":"Stayed September 2026","fh":1,"so":[["Service that solves problems.","The SD card story says it all. They do not point you somewhere, they take care of it."],["The Ponte Vecchio, from your room.","The river-view suites look straight at the bridge. It is stunning at sunrise and again when it lights up at night."],["Italian design, done with confidence.","Modern, art-forward and very Florentine, with mid-century furniture and photography on the walls. Ferragamo’s flagship and museum are around the corner."],["Terraces worth asking for.","Some of the suites have massive private terraces over the Arno. In a city this dense, that is rare."]],"k":[["Ask for a river view.","That is the whole point of Portrait. The other rooms are lovely, but the Arno is why you come."],["Terraces are limited.","Only some suites have them, and the big ones go first. Tell me early if a terrace matters and I will request the right suite."],["It is a city hotel.","There is no gym, so workouts happen in your suite. If a pool, a spa or a garden is on the list, look at Four Seasons Firenze."],["Families fit well.","Two-bedroom suites and a Family Suite make it one of the easier city hotels in Florence for families, and it is pet friendly."]],"img":"img/portrait-firenze.jpg","u":"https://suiteswithkeith.com/hotels/portrait-firenze.html"},{"s":"raffles-london-owo","n":"Raffles London at The OWO","c":"England","a":"London","w":"London, England","v":"The Old War Office reborn, with Churchill's former corridors, nine restaurants and bars, and the most exciting opening London has seen in a generation.","p":"History lovers, food-led stays, first-wave trend seekers","st":"Landmark restoration grand hotel (Raffles)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/raffles-london-owo.jpg","u":"https://suiteswithkeith.com/hotels/raffles-london-owo.html"},{"s":"ritz-carlton-kyoto","n":"The Ritz-Carlton, Kyoto","c":"Japan","a":"Kyoto","w":"Kyoto, Japan","v":"For a central base with full-service consistency, this is the Kyoto hotel I book first-time visitors into without hesitation.","p":"First-time Kyoto visitors, families, convenience-first travelers","st":"Classic luxury hotel","r":"Featured · my Japan shortlist","vis":"","fh":0,"so":[["The riverside location.","On the Kamogawa with the city walkable in every useful direction. It's the best pure base in Kyoto."],["Full-service consistency.","The classic-hotel machinery that makes a dense Kyoto itinerary run without friction."],["Forbes Five-Star execution.","Independently rated at the level my clients experience."]],"k":[["It's a city hotel through and through.","Travelers chasing the transporting-sanctuary feeling should look at Aman Kyoto. This property's strength is convenience, done impeccably."],["Ideal for mixed groups.","Families and multigenerational trips do better here than at either of my other Kyoto picks."],["Pair it with Tokyo deliberately.","Kyoto's classicist matches Tokyo's (The Peninsula) for a first-timer's itinerary I've built many times."]],"img":"img/ritz-carlton-kyoto.jpg","u":"https://suiteswithkeith.com/hotels/ritz-carlton-kyoto.html"},{"s":"ritz-paris","n":"Ritz Paris","c":"France","a":"Paris","w":"Paris, France","v":"The word “ritzy” exists because of this hotel. Bar Hemingway, the Ritz Club pool, and a century of legends on Place Vendôme.","p":"Milestones, classicists, first great Paris trip","st":"The original grand palace, fully restored","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/ritz-paris.jpg","u":"https://suiteswithkeith.com/hotels/ritz-paris.html"},{"s":"rosewood-castiglion-del-bosco-tuscany","n":"Rosewood Castiglion del Bosco","c":"Italy","a":"Tuscany","w":"Val d'Orcia, Tuscany, Italy","v":"My top Tuscany pick for a countryside stay: 5,000 acres, a Brunello winery, and a week that never needs to leave the estate.","p":"Multi-night countryside stays, wine lovers, golfers","st":"Countryside estate (Rosewood, Three Michelin Keys)","r":"My top Tuscany pick","vis":"","fh":0,"so":[["The 5,000-acre estate.","A Ferragamo-family holding in the Val d'Orcia, and you have the landscape essentially to yourself."],["Its own Brunello winery.","Tastings and cellar visits at the source of one of Italy's greatest wines, with no van tour required."],["Italy's only private golf club.","A championship course inside the estate. No other hotel in the country has one."],["Three Michelin Keys.","The top hospitality distinction, which fits the estate's ambition."]],"k":[["Commit real nights to it.","This is a multi-night countryside stay by design. I recommend at least four nights."],["You'll want a car (or a driver).","The Val d'Orcia's hill towns (Montalcino, Pienza, Montepulciano) are the day-trip circuit, and I arrange drivers who know every back road."],["Compare my Tuscany trio.","Castello di Casole is the more traditional castle; Castello del Nero is the Chianti base for day trips. This is the estate for settling in."]],"img":"img/rosewood-castiglion-del-bosco-tuscany.jpg","u":"https://suiteswithkeith.com/hotels/rosewood-castiglion-del-bosco-tuscany.html"},{"s":"royal-malewane-south-africa","n":"Royal Malewane","c":"Africa","a":"South Africa","w":"Thornybush, South Africa","v":"The Royal Portfolio's flagship, with some of the most decorated guides in Africa, a serious spa, and Big Five viewing at the highest level of luxury on the continent.","p":"First safaris done at the top, spa lovers, guiding connoisseurs","st":"Flagship luxury safari lodge (The Royal Portfolio)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/royal-malewane-south-africa.jpg","u":"https://suiteswithkeith.com/hotels/royal-malewane-south-africa.html"},{"s":"sanctuary-olonana-kenya","n":"Sanctuary Olonana","c":"Africa","a":"Kenya","w":"Mara River, Kenya","v":"Hippos below your deck and glass walls to watch them through. This is the Mara at its most intimate.","p":"Couples, contemporary-design safari-goers, river lovers","st":"Riverside safari camp","r":"Featured · my safari shortlist","vis":"","fh":0,"so":[["The river frontage.","Suites directly on the Mara River. The soundtrack alone is worth the booking."],["Glass-fronted, contemporary suites.","Modern design in the bush, with the river as a floor-to-ceiling mural."],["Intimacy as the luxury.","A small camp's privacy and pace, as a counterpoint to the region's bigger lodges."]],"k":[["The view is at river level.","For the sweeping-Mara vista and migration positioning, that's Angama Mara up on the escarpment. Some clients split the stay between both."],["Couples first.","The intimate scale favors twos; big multigenerational groups fit better at Four Seasons Serengeti."],["Book 9–12 months out.","As with every camp on my shortlist, the calendar is the strategy."]],"img":"img/sanctuary-olonana-kenya.jpg","u":"https://suiteswithkeith.com/hotels/sanctuary-olonana-kenya.html"},{"s":"six-senses-ibiza","n":"Six Senses Ibiza","c":"Spain","a":"Ibiza","w":"Ibiza, Spain","v":"The sunset pool is the headline, but the whole property is the version of Ibiza I'd actually send you to.","p":"Wellness travelers, groups of friends, sunset chasers","st":"Wellness resort","r":"#07 in my top 10 hotel pools","vis":"","fh":0,"so":[["The pool at golden hour.","A cliffside infinity pool built for sunset, and the single image that earned its place on my list."],["The other Ibiza.","The island's quieter north, with wellness programming instead of bottle service. My kind of Balearics."],["Six Senses wellness DNA.","The same spa-first philosophy I recommend at the brand's island properties worldwide."]],"k":[["It's not the party address.","If the clubs are the point of your Ibiza trip, stay closer to them. This property is deliberately apart from that scene."],["Summer is competitive.","Peak Balearic season books early; shoulder months are the value play."],["Great for groups.","The layout and social spaces suit a group of friends better than most luxury resorts I book in Europe."]],"img":"img/six-senses-ibiza.jpg","u":"https://suiteswithkeith.com/hotels/six-senses-ibiza.html"},{"s":"six-senses-kanuhura-maldives","n":"Six Senses Kanuhura","c":"Maldives","a":"Maldives","w":"Lhaviyani Atoll, Maldives","v":"The best finisher in the atolls, which is why it's the only island my sample proposal uses twice.","p":"Second-island seclusion, wellness-inclined couples","st":"Barefoot island resort","r":"The finisher in two of my three itineraries","vis":"","fh":0,"so":[["The great second act.","The finisher in two of my three sample itineraries, so the trip winds down rather than up."],["Barefoot soul, real scale.","A laid-back rhythm on an island big enough for variety, with more restaurants and longer beaches."],["Wellness woven through the day.","The Six Senses signature, the same DNA behind my Ibiza pick on the pools list."]],"k":[["The seaplane leg adds a travel day.","My exact caveat from the proposal: the scenic flight is worth it, but plan the trip's shape around it."],["The reef is good, but it's not the best.","Serious snorkelers should start at Banyan Tree Vabbinfaru. That's exactly how my Island Escape is built."],["Ask me about the half-board rate.","A direct half-board rate at Kanuhura can reduce the total meaningfully. I confirm it before booking, as noted in the proposal."]],"img":"img/six-senses-kanuhura-maldives.jpg","u":"https://suiteswithkeith.com/hotels/six-senses-kanuhura-maldives.html"},{"s":"six-senses-rome","n":"Six Senses Rome","c":"Italy","a":"Rome","w":"Rome, Italy","v":"A great location near the Pantheon, a beautiful rooftop, and the best hotel in Rome for wellness travelers. If you are coming to Rome for Rome, the pasta, the wine and the feeling of the city, I would book you somewhere that feels more Italian.","p":"Wellness travelers who want a modern, central base","st":"Modern urban wellness hotel (Six Senses)","r":"My pick in Rome for wellness travelers","vis":"Visited October 2026","fh":1,"so":[["The location.","Steps from the Pantheon and Via del Corso, central and walkable to almost everything you came to see."],["The rooftop.","Notos is beautiful, and the design I liked most in the hotel. Book a table up there even if wellness is not your thing."],["Real wellness, if that is your trip.","The spa and the full Six Senses program are built for travelers who want to keep their routines on the road. No other hotel I saw in Rome builds the stay around wellness the way this one does."],["Modern, if that is your taste.","If you are tired of gilt, damask and chandeliers, this is the clean, contemporary alternative to Rome’s grand classics."]],"k":[["The rooms feel like Six Senses, not Rome.","They are comfortable and well done, but if waking up somewhere unmistakably Roman matters to you, I would look at La Minerva or the Eden first."],["You are paying for the wellness program.","Nobody makes you blend oils, and you can ignore the calendar entirely. But the hotel is built around it, so if you will not use it, a different hotel will give you more Rome for the money."],["Compare the neighbors.","La Minerva is around the corner for a real Roman neighborhood feel, and the Corinthia is nearby for a quiet base with a beautiful spa and large rooms."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/six-senses-rome.jpg","u":"https://suiteswithkeith.com/hotels/six-senses-rome.html"},{"s":"skinopi-lodge-milos","n":"Skinopi Lodge","c":"Greece","a":"Milos","w":"Milos, Greece","v":"One of those rare hotels where returning each afternoon becomes part of the experience.","p":"Couples, design lovers, privacy, nature","st":"Boutique hillside lodge","r":"Featured in my Milos guide","vis":"Visited June 2026","fh":1,"so":[["Villa Almyra is the room I'd book.","A beautifully restored retreat with sweeping sea views."],["The quiet setting is the point.","Uninterrupted sea views and a deliberately slow pace. Reason enough not to leave every night."],["Perfectly positioned for the water.","Book a boat for the next morning and see the western coastline before anyone else does."]],"k":[["This is authenticity over excess.","If you want a full resort with restaurants and a spa, look at Erēma instead."],["Head into Klima before sunset.","It's only a few minutes away and one of the best places on the island to wander before dinner."],["Milos rewards a slower itinerary.","Give the island three nights and build in a private boat day. My Milos guide maps out exactly how I'd do it."],["Transfers and private boats, arranged.","I arrange private transfers from the port or airport, private boat days to Kleftiko and the west coast, which you can only reach by water, and private boat transfers from Sifnos or Santorini."]],"img":"img/skinopi-lodge-milos.jpg","u":"https://suiteswithkeith.com/hotels/skinopi-lodge-milos.html"},{"s":"solage-calistoga","n":"Solage Calistoga","c":"Napa & Sonoma","a":"Napa Valley","w":"Calistoga, Napa Valley","v":"A fantastic hotel, just not quite at the level of the three above it.","p":"Younger couples, families, girls trips","st":"Design resort (Auberge)","r":"#04 in my Napa & Sonoma ranking","vis":"","fh":0,"so":[["Real privacy.","If you need a completely private terrace or garden, Solage is one of the best options on my entire list, and some rooms add private hot tubs."],["The design.","Iconic Calistoga-modern that defined the look of California wine country luxury."],["The value.","Rates run meaningfully lower than the properties above it, so the cost-to-experience is strong."],["The energy.","Younger, more relaxed, and less formal than the top of the list. For the right trip, that's a plus."]],"k":[["Set spa expectations.","The spa is a big part of the Solage story and is due for a refresh. Worth knowing as you plan treatments."],["The vibe is relaxed.","A more casual service style than Meadowood or Four Seasons, which suits some trips more than others."],["Calistoga base.","The far north end of the valley: quieter hot-springs country, and a longer drive from southern Napa wineries."]],"img":"img/solage-calistoga.jpg","u":"https://suiteswithkeith.com/hotels/solage-calistoga.html"},{"s":"soneva-jani-maldives","n":"Soneva Jani","c":"Maldives","a":"Maldives","w":"Noonu Atoll, Maldives","v":"Every property on The Fifteen earns its place for a different couple. This one is for the couple who wants to sleep under the stars.","p":"Honeymoons, star-gazers, once-in-a-lifetime trips","st":"Overwater private-island resort","r":"#09 on The Fifteen","vis":"","fh":0,"so":[["The retractable roofs.","Press a button, the ceiling slides away, and the Maldivian night sky is your last sight before sleep. That's the detail that put it on The Fifteen."],["Built for wonder.","Slides from villa decks, open water, and a property philosophy that treats delight as the point."],["The right kind of splurge.","On my honeymoon shortlist because the memory-per-dollar here is extraordinary."]],"k":[["Choose it for the playfulness.","Couples who want white-glove polish should compare Cheval Blanc Randheli, my other Fifteen entry in the atolls."],["Pair it well.","My sample proposal shows how I structure two-resort Maldives honeymoons, and Jani slots beautifully into that format."],["Book the villa category deliberately.","The retractable-roof experience varies by category. Tell me your dates and I'll point you to the right one."]],"img":"img/soneva-jani-maldives.jpg","u":"https://suiteswithkeith.com/hotels/soneva-jani-maldives.html"},{"s":"splendido-portofino","n":"Splendido","c":"Italy","a":"More Italy","w":"Portofino, Italy","v":"Portofino's harbor beyond the net and Belmond service behind you. The Italian Riviera at its most cinematic.","p":"Couples, Italian Riviera trips, Belmond loyalists","st":"Riviera icon (Belmond, Fora Reserve)","r":"#08 in my hotel tennis court ranking","vis":"Visited October 2026","fh":1,"so":[["The court above the harbor.","Terraced over Portofino with the Ligurian coast beyond the net. It's #08 on my worldwide list."],["The hillside setting.","A former monastery in terraced gardens, looking down on the most famous little harbor in Italy."],["The Belmond circuit.","It pairs easily with the Cipriani and the Caruso. One brand, three of Italy's best-set hotels."]],"k":[["Want the real Riviera at about half the price?","Look at Grand Hotel Miramare in Santa Margherita Ligure, 15 minutes away. It’s a restored 1904 grand hotel in a town where the Milanese still summer, with a big pool and one of the largest beach clubs in Liguria. For most of my clients, it’s the better stay."],["Splendido versus Splendido Mare.","The hillside hotel and its little sister on the harborfront are different products. I'll place you based on how you want to live for the week."],["Portofino is tiny and seasonal.","The village is best May through September, and the hotel's calendar follows. Shoulder weeks are the value play."],["Boats are the point here.","A chartered day along the Ligurian coast (Camogli, San Fruttuoso, the Cinque Terre) is the experience I add to nearly every Splendido booking."]],"img":"img/splendido-portofino.jpg","u":"https://suiteswithkeith.com/hotels/splendido-portofino.html"},{"s":"st-regis-punta-mita","n":"The St. Regis Punta Mita","c":"Mexico","a":"Punta Mita","w":"Punta Mita, Mexico","v":"Quieter and more residential in feel, with butler service throughout. A refined base on the same beautiful peninsula.","p":"Families and couples both, loyalists, low-key beach weeks","st":"Residential beach resort (St. Regis)","r":"Featured on my collection →","vis":"","fh":0,"so":[],"k":[],"img":"img/st-regis-punta-mita.jpg","u":"https://suiteswithkeith.com/hotels/st-regis-punta-mita.html"},{"s":"stamna-sifnos","n":"Stamna","c":"Greece","a":"Sifnos","w":"Sifnos, Greece","v":"After ten nights between Mykonos and Paros, arriving at Stamna was a fantastic respite. It's exactly what you want Sifnos to be.","p":"Slow travelers, foodies, design-conscious couples","st":"Design boutique","r":"#10 of my Greece Top 10","vis":"Visited June 2026","fh":1,"so":[["The dining.","Excellent. On an island famous for its food, the hotel restaurant holds its own."],["The perch.","Views over the Cyclades stretching as far as you can see, from a calm hillside above Apollonia."],["The design.","Earthy, neutral, and calming. It's a hotel that knows exactly what it is."],["The $25-per-bag laundry service.","You can fit a surprising amount in one bag, which is a lifesaver on a multi-week island trip with only a carry-on."]],"k":[["There's no spa or gym that I could find.","If wellness facilities matter, this isn't the island stop for them."],["The pool draws a mixed crowd.","Young families and honeymooners share it, so it isn't always as relaxing as the setting suggests."],["Sifnos rewards slow travel.","Budget real time for the hiking trails, the villages, and the tavernas. This isn't a see-it-in-a-day island."],["Transfers and private boats, arranged.","I arrange private transfers from the port, and private boat transfers from Milos or Paros, which is far easier than Sifnos’s limited ferry schedule."]],"img":"img/stamna-sifnos.jpg","u":"https://suiteswithkeith.com/hotels/stamna-sifnos.html"},{"s":"stanly-ranch-napa","n":"Stanly Ranch","c":"Napa & Sonoma","a":"Napa Valley","w":"Carneros, Napa Valley","v":"Beautiful, but I don't find myself wanting to go back as often as the hotels above it.","p":"Younger couples, wellness travelers, design lovers","st":"Modern ranch resort (Auberge)","r":"#06 in my Napa & Sonoma ranking","vis":"","fh":0,"so":[["The architecture.","Arguably the most striking design statement in wine country: modern ranch done at full conviction."],["The spa.","The prettiest in the valley in my book. Wellness travelers should weight this heavily."],["Fire pits on every terrace.","Every room gets a large outdoor terrace with its own fire pit."],["Bear.","The main restaurant is one of the more interesting dining options in Napa right now."]],"k":[["It doesn't feel like wine country.","Convenient to both valleys, but set in the marshes. If the vineyard postcard is the point, look at Montage or Meadowood."],["Terrace privacy varies.","Some are wonderfully secluded, others more open. I'll steer you to the best-sited rooms."],["The smart-room tech takes a night.","Give the lighting controls an evening to learn. After that you're fluent."]],"img":"img/stanly-ranch-napa.jpg","u":"https://suiteswithkeith.com/hotels/stanly-ranch-napa.html"},{"s":"the-dolli-athens","n":"The Dolli","c":"Greece","a":"Athens","w":"Athens, Greece","v":"If someone asks me where to splurge in Athens, The Dolli is usually my first answer.","p":"Design lovers, couples, first-time Athens","st":"Restored neoclassical mansion","r":"Featured in my Athens guide","vis":"Visited June 2026","fh":1,"so":[["The rooftop is reason enough to slow down.","Whether it's cocktails before dinner or a leisurely breakfast the next morning, The Dolli's view of the illuminated Parthenon is worth saving a whole evening for."],["The Acropolis Junior Suite is the room I'd book.","Wake up to uninterrupted views of the Parthenon from one of the city's most coveted addresses."],["A design destination in its own right.","The restored mansion feels residential and carefully designed everywhere you look. This is where I send design lovers first."]],"k":[["It's a city splurge.","Rates start around $900 a night. If you want beach and resort grounds, pair it with Four Seasons Astir Palace on the Riviera."],["Give Athens at least two full days.","Don't rush through on your way to the islands. The city has some of Greece's best hotels, restaurants, and cultural experiences."],["Eat beyond the tourist center.","I had my favorite gyros in all of Greece in Kallithea, a short taxi from the hotel. It's a reminder that Athens' best food is found well beyond Plaka."],["Transfers and onward travel, arranged.","I arrange private airport transfers and your onward travel to the islands: fast ferries from Piraeus or Rafina, or a helicopter straight to your island."]],"img":"img/the-dolli-athens.jpg","u":"https://suiteswithkeith.com/hotels/the-dolli-athens.html"},{"s":"the-peninsula-paris","n":"The Peninsula Paris","c":"France","a":"Paris","w":"Paris, France","v":"A perennial favorite, with flawless service, rooftop Eiffel views, and perks so flexible they effectively lengthen the trip.","p":"Service lovers, perk maximizers, rooftop dinners","st":"Polished palace (Forbes Five-Star)","r":"Featured on my Paris collection","vis":"","fh":0,"so":[["Completely flexible check-in and check-out.","The rarest perk in the city. Land at 8am and go straight to your room, or leave for a night flight without losing the day."],["The rooftop with Eiffel views.","Dinner above the 16th with the tower lit in front of you. Book it with the room."],["Flawless service, sharpest technology.","The palace where the operational polish matches the marble (my featured page's exact claim)."]],"k":[["The Junior Suite is the smart entry.","Generous and comfortable, and the category I show in my Paris proposal."],["The 16th is the quieter palace quarter.","Near the Arc and Kléber rather than the shopping cores. It's serene at night and a short walk to the action."],["Compare perks as well as rates.","Flexible check-in/out plus a 4th night free often beats a nominally cheaper palace. Running that math is exactly what I do."]],"img":"img/the-peninsula-paris.jpg","u":"https://suiteswithkeith.com/hotels/the-peninsula-paris.html"},{"s":"the-rooster-antiparos","n":"The Rooster","c":"Greece","a":"Paros & Antiparos","w":"Antiparos, Greece","v":"Sixteen stone houses lost in 30 acres of wild hillside above Livadia beach. It's less a hotel than a way of living, and the Cyclades' most soulful stay.","p":"Couples, wellness resets, slow-living converts, second-trip Greece","st":"Barefoot wellness estate on a working farm","r":"","vis":"Visited June 2026","fh":1,"so":[],"k":[],"img":"img/the-rooster-antiparos.jpg","u":"https://suiteswithkeith.com/hotels/the-rooster-antiparos.html"},{"s":"the-st-regis-rome","n":"The St. Regis Rome","c":"Italy","a":"Rome","w":"Rome, Italy","v":"Belle Époque grandeur, a saber through a champagne bottle nightly. When the trip is a celebration, book the spectacle.","p":"Celebrations, grandeur lovers, Marriott loyalists","st":"Belle Époque grande dame (St. Regis)","r":"Featured on my Italy collection","vis":"Visited October 2026","fh":1,"so":[["The grandeur.","César Ritz's 1894 original, restored with chandeliers, frescoes, and the most theatrical interiors in Rome."],["The nightly sabrage.","A champagne bottle opened by saber every evening. That ritual tells you what kind of hotel you're in."],["Butler service standard.","The St. Regis signature, from unpacking to pressing, so there's real service behind the spectacle."]],"k":[["The neighborhood is grand.","Near Repubblica and the Baths of Diocletian. It's monumental Rome rather than winding-lane Rome, and a short taxi covers the difference."],["If spectacle isn't the brief, my other picks win.","The de Russie for understated elegance, the Eden for quiet romance. My featured page compares the trio."],["Points and status work here.","For Marriott loyalists, this is where the program earns its keep in Rome."],["Transfers and drivers, arranged.","I arrange private transfers from Fiumicino or Termini station, drivers for days outside the city, and onward travel by fast train or car to Florence, Naples or the Amalfi Coast."]],"img":"img/the-st-regis-rome.jpg","u":"https://suiteswithkeith.com/hotels/the-st-regis-rome.html"},{"s":"villa-d-este-lake-como","n":"Villa d'Este","c":"Italy","a":"Lake Como","w":"Cernobbio, Lake Como, Italy","v":"One of Lake Como’s grandest estates: beautiful gardens, eight clay courts and service that’s polished and warm.","p":"Classicists, tennis trips with friends, multigenerational groups","st":"Grand renaissance estate (Fora Reserve)","r":"#06 in my hotel tennis court ranking","vis":"Toured October 2026","fh":1,"so":[["Eight clay courts along the water.","Old-world tennis at its finest, and #06 on my worldwide list. With eight courts and the estate’s private villas, it’s the best place on the lake for a tennis trip with friends."],["The estate itself.","Gardens, grottoes, and grandeur at a scale no modern hotel can rebuild. This is the lake's original icon."],["The dining and the service.","Lunch was fantastic, and the service is polished and warm. It felt lively in a good way, and recent client stays have been very positive."],["The floating pool.","Villa d'Este's lake-borne pool predates the trend everyone else is chasing."]],"k":[["Grand, but not stiff.","I’m told they plan to reduce the number of rooms and modernize, which will put it in the same tier as Il Sereno, Passalacqua and Grand Hotel Tremezzo. If you’re choosing between Villa d’Este and Villa Serbelloni, I’d steer you here."],["Cernobbio is a smart base.","The town side of the lake, with easy access to Como city and the villa circuit by boat."],["Compare the lake's icons before you book.","Villa d'Este, Passalacqua, the Mandarin, Il Sereno, and the EDITION each fit a different couple. My Lake Como proposal shows how I frame the choice."],["Boats and transfers, arranged.","From Milan, a private car is the easiest way in, about an hour. Once you’re here, I arrange private boats for dinners across the lake, a day on the water or the move to your next hotel. I work with the best captains on Como, at fair prices."]],"img":"img/villa-d-este-lake-como.jpg","u":"https://suiteswithkeith.com/hotels/villa-d-este-lake-como.html"},{"s":"villa-serbelloni-bellagio","n":"Grand Hotel Villa Serbelloni","c":"Italy","a":"Lake Como","w":"Bellagio, Lake Como, Italy","v":"A beautiful, very historic hotel with a stunning spa and the lake’s best swimming. The dated decor and Bellagio’s crowds are why I usually steer clients to Villa d’Este.","p":"Lovers of historic Italian hotels and art, swimmers, travelers set on Bellagio","st":"Historic grand hotel","r":"#06 in my Lake Como hotels ranking","vis":"Stayed October 2026","fh":1,"so":[["The spa.","Stunning and modern, a beautiful contrast to the historic hotel around it, and a real reason to book."],["The swimming.","A pool, a beach and a floating pier to jump into the lake from. For getting in the water, it’s the best setup I’ve seen on Como."],["The speakeasy.","A little cocktail bar tucked away inside the hotel. I loved it."],["Formal, but warm.","The service is old-school and polished, without ever feeling cold."]],"k":[["Bellagio is crowded.","Packed with day-trippers, even in October; July and August would be a nightmare. You can visit Bellagio easily by boat from almost anywhere on the lake, so think hard about whether you want to sleep there."],["The decor is very traditional.","Frescoes, chandeliers, damask and antiques, all beautifully kept. If you love that, you’ll love it here. If you prefer something fresher, look elsewhere."],["A big hotel with the village at the door.","More than 90 rooms and three places to eat on property, plus all of Bellagio’s restaurants outside the front door."],["Arrive by boat.","A car to Como, then a boat. The lake road from the town of Como takes 45 minutes to an hour and it’s narrow and winding. I arrange a private car from Milan to the water in Como, then about 30 minutes by private boat to the hotel’s dock. It’s the best way to arrive, especially on a honeymoon."]],"img":"img/villa-serbelloni-bellagio.jpg","u":"https://suiteswithkeith.com/hotels/villa-serbelloni-bellagio.html"},{"s":"villa-treville-positano","n":"Villa Treville","c":"Italy","a":"Amalfi Coast","w":"Positano, Amalfi Coast","v":"For me, this is the best option in Positano alongside Il San Pietro, and maybe slightly better value.","p":"Couples, honeymoons, anyone who wants Positano without the crowds","st":"","r":"","vis":"Visited October 2026","fh":1,"so":[["Privacy.","Probably the most private rooms in Positano."],["No two rooms alike.","Every room is completely different, so the right match matters. I do the matching."],["The suite with the outdoor tub and shower.","One of the most unique rooms I saw on the coast, with one of the coolest showers I have ever seen."],["Three boats.","Three stunning boats, and free shuttles into Positano."]],"k":[["Pick the specific room.","Because every room is so different, tell me your style and I will match you. Two rooms in the same category can feel completely different."],["You are outside the town.","That is the privacy. The free boat shuttles make Positano easy, and you come home to quiet."],["It is small.","Summer books up early, so 2027 is the time to plan."],["Pair it with Il San Pietro or Le Sirenuse.","If you want one night in town for the scene, I can split the stay."]],"img":"img/villa-treville-positano.jpg","u":"https://suiteswithkeith.com/hotels/villa-treville-positano.html"},{"s":"vione-paros","n":"Vione","c":"Greece","a":"Paros & Antiparos","w":"Paros, Greece","v":"The kind of hotel that quietly impresses you. Every detail feels considered.","p":"Adults, design lovers, couples, wellness","st":"Adults-focused boutique hotel","r":"Featured in my Paros guide","vis":"Visited June 2026","fh":1,"so":[["The spa was the most expansive I saw in the Cyclades.","Leave real time for it. Wellness is a genuine strength here."],["The Jr Suite with Private Pool is the room I'd book.","Minimalist interiors paired with uninterrupted views of the Aegean."],["The Junior Suites are a sneaky value.","Surprisingly spacious, with more than enough room for a special stay, and one of the property's best values."]],"k":[["It's adults-focused by design.","Traveling with kids? Andronis Minois is my family pick on Paros."],["Balance hotel time with exploring Naousa.","You'll appreciate returning to Vione's quiet atmosphere after a day on the island."],["Paros is my best island for return visitors.","It's also the island I keep thinking about, and my Paros guide covers how I'd structure the whole stay."],["Transfers and private boats, arranged.","I arrange private transfers from the port or airport, private boat days to Antiparos and the small islands, and private boat transfers to Mykonos or Naxos instead of the ferry."]],"img":"img/vione-paros.jpg","u":"https://suiteswithkeith.com/hotels/vione-paros.html"},{"s":"white-pebble-suites-milos","n":"White Pebble Suites","c":"Greece","a":"Milos","w":"Milos, Greece","v":"A polished boutique experience in one of Milos' most charming villages, and an excellent base for exploring the island.","p":"Couples, boutique luxury, design lovers","st":"Boutique village hotel","r":"Featured in my Milos guide","vis":"Visited June 2026","fh":1,"so":[["The Honeymoon Suite is the room I'd book.","Beautiful sea views with the simplicity and understated design that define White Pebble."],["The location does half the work.","Some of Milos' best restaurants are a short stroll away."],["The easiest day trip in the Cyclades.","Pollonia is the departure point for the ferry to Kimolos, a perfect low-effort day out."]],"k":[["This is a village hotel.","If total privacy is the priority, look at Erēma or Skinopi Lodge instead."],["Walk into Pollonia every evening.","The restaurants and promenade are the reason to stay here, so use them."],["Save an afternoon for the waterfront.","Grab a drink, wander the promenade, and settle into the slower rhythm that makes Pollonia so appealing."],["Transfers and private boats, arranged.","I arrange private transfers from the port or airport, private boat days to Kleftiko and the west coast, which you can only reach by water, and private boat transfers from Sifnos or Santorini."]],"img":"img/white-pebble-suites-milos.jpg","u":"https://suiteswithkeith.com/hotels/white-pebble-suites-milos.html"},{"s":"zannier-ile-de-bendor-france","n":"Zannier Hôtels Île de Bendor","c":"France","a":"Provence","w":"Bandol, France","v":"A one-of-a-kind private island on the Côte d'Azur. It's the featured property I reach for when clients want the Riviera without the scene.","p":"Couples, Riviera romantics, slow travel","st":"Private island resort","r":"My featured-property page","vis":"","fh":0,"so":[["Three rooms worth knowing.","The Delos Pavilion Suite, with arched windows opening straight onto the sea; the warmer, residential Soukana Terrace Junior Suite in the gardens; and The Delos Suite, which has the island's most private terrace and an outdoor soaking tub under the lemon trees."],["The Rēsonance Wellness Centre.","A spiral stone staircase drops straight into a plunge pool, with a second courtyard pool, treatment rooms, and a tea room above."],["Sunset at Le Grand Large, apéro at Bar Patrick.","Cliffside tables for sunset, a yacht-club dining room at La Table Delos for everything else, and a hand-tiled bar built for a slow pastis at golden hour."],["No cars, by design.","Electric 'Mini Kate' buggies shuttle guests between villages, the harbor, and the pools."]],"k":[["Pick your village deliberately.","Delos puts you on the water; Soukana is quieter, tucked into the gardens near the pine groves. Couples who want to wake up to water on both sides should ask me for the Delos Pavilion Suite."],["The perks are specific here.","Booking through me adds an upgrade on arrival and early check-in/late check-out (both subject to availability), plus a $100 USD equivalent food & beverage credit. Breakfast is already included in the property's rates."],["It's a boat-access island.","Five minutes from Bandol. It's easy, but build your Riviera routing around it instead of treating it like a drive-up hotel."]],"img":"img/zannier-ile-de-bendor-france.jpg","u":"https://suiteswithkeith.com/hotels/zannier-ile-de-bendor-france.html"}];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const REAL_TODAY = new Date(); REAL_TODAY.setHours(0,0,0,0);
let TODAY = REAL_TODAY;
const D = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = (s,o={month:"short",day:"numeric"}) => D(s).toLocaleDateString("en-US",o);
const range = t => `${fmt(t.start)} to ${fmt(t.end,{month:"short",day:"numeric",year:"numeric"})}`;
const nights = (a,b) => Math.round((D(b)-D(a))/864e5);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const upcomingTrips = () => TRIPS.filter(t=>D(t.end)>=TODAY).sort((a,b)=>D(a.start)-D(b.start));
const pastTrips = () => TRIPS.filter(t=>D(t.end)<TODAY);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isTraveling = t => D(t.start)<=TODAY && TODAY<=D(t.end);
const shortName = n => String(n||"").split(/ - | – |, | by | at /)[0].replace(/ Hotel$/,"");
function allDays(t){ // every date of the trip, with plans and where they're staying
  const out=[]; for(let d=D(t.start); d<=D(t.end); d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    const k=iso(d), plan=t.days.find(x=>x.d===k);
    const stay=t.reservations.find(r=>r.type==="Hotel"&&r.out&&D(r.in)<=d&&d<D(r.out));
    let items = plan?.items || [];
    if(!items.length){ // no written plan for this day: show what's booked
      const ev=[];
      t.reservations.forEach(r=>{
        const lodging = r.type==="Hotel" || r.type==="Villa";
        if(r.out===k && lodging) ev.push(["", "Check out", r.name, ""]);
        if(r.in===k) ev.push(["", lodging ? "Check in" : r.type, r.name, lodging ? (r.room||"") : (r.guests||"")]);
      });
      items = ev;
    }
    const firstIn = items.find(x=>x[1]==="Check in");
    out.push({d:k, n:out.length+1, title:plan?.title||(firstIn?`Check in at ${shortName(firstIn[2])}`:items.find(x=>x[1]!=="Check out")?shortName(items.find(x=>x[1]!=="Check out")[2]):stay?`${stay.place||shortName(stay.name)}, at leisure`:items.find(x=>x[1]==="Check out")?`Check out of ${shortName(items.find(x=>x[1]==="Check out")[2])}`:"Travel day"), items, stay});
  } return out; }

  return `<svg viewBox="0 0 400 ${h}" preserveAspectRatio="none" aria-hidden="true">
    <rect width="400" height="${h}" fill="${p[0]}"/>
    <rect y="${h*.58}" width="400" height="${h*.42}" fill="${p[1]}"/>
    <rect x="250" y="${h*.30}" width="70" height="${h*.28}" fill="${p[2]}"/>

}

const HBY = Object.fromEntries(H.map(h=>[h.s,h]));
const norm = x => String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const HBN = Object.fromEntries(H.map(h=>[norm(h.n),h]));
const findHotel = name => HBN[norm(name)] || H.find(h=>norm(h.n).startsWith(norm(name))||norm(name).startsWith(norm(h.n)));
const photo = (src,alt="") => src?`<img src="${src}" alt="${esc(alt)}" loading="lazy">`:"";
const countryOf = id => COUNTRIES.find(c=>c.id===id);
const inCountry = c => H.filter(h=>h.c===c.name);
const coverOf = c => (HBY[c.cover]&&HBY[c.cover].img) || (inCountry(c).find(h=>h.img)||{}).img || "";

function tripPhoto(t){
  const hh = t.reservations.map(r=>findHotel(r.name)).find(x=>x&&x.img);   // a hotel on this trip I've reviewed
  if(hh) return hh.img;
  const c = COUNTRIES.find(c=>(t.name||"").includes(c.name) || (c.name==="England" && /United Kingdom|London/.test(t.name+t.places)));
  if(c && coverOf(c)) return coverOf(c);                                     // the destination guide's cover
  return null;                                                              // no photo of this place: no photo
}
function tripArt(t,h){ const src=tripPhoto(t); return src ? photo(src, t.name) : `<div class="mono">${esc((t.name||"").trim().charAt(0))}</div>`; }

function hotelRow(h){ return `<button class="hrow" onclick="go('hotel',{hotel:'${h.s}',prev:null,from:null})">

function searchHotels(q){
  state.q=q; const box=document.getElementById("results"), br=document.getElementById("browse");

  const hits=H.filter(h=>norm(h.n+h.w+h.a+h.c+h.p).includes(t)).slice(0,40);
  br.style.display="none";
  box.innerHTML = hits.length ? hits.map(h=>hotelRow(h).replace("prev:null,from:null})","prev:null,from:'search'})")).join("") : `<div class="pad" style="color:var(--ash);padding-top:10px">No hotels match "${esc(q)}". Ask me, I may know it anyway.</div>`;

     <li>Pay the hotel directly, same as booking with them</li>
     <li>Shows up in your Trips tab once it's confirmed</li></ul>
  </div>`+tabbar();
}

function vContact(){
  return `<div class="screen" style="padding-bottom:0"><div class="contact">
   <div class="label eyebrow">While you travel</div>
   <h1>Something <em>wrong?</em> Reach me.</h1>
   <p>Missed connection, a room that isn't right, a driver who didn't show. Call or text and I'll handle it with the hotel or partner directly.</p>
   <a class="big" href="tel:${KEITH.tel}" onclick="toast('Calling Keith: ${KEITH.phone}')"><span class="label">Call Keith</span><span>&rsaquo;</span></a>
   <a class="big alt" href="sms:${KEITH.tel}" onclick="toast('Texting Keith: ${KEITH.phone}')"><span class="label">Text Keith</span><span>&rsaquo;</span></a>
   <div class="num">${KEITH.phone}</div>
   <div class="list">
     <div><span class="label">Best for urgent issues</span>Call. If I don't pick up, text and I'll call you back.</div>
     <div><span class="label">Medical or safety emergency</span>Call local emergency services first: 112 in Europe, 911 in the US.</div>
     <div><span class="label">Not urgent</span>Questions or changes before the trip: text or email anytime.</div>
   </div></div></div>`+tabbar();
}

const showErr = m => { const e=document.getElementById('err'); if(e) e.textContent=m; };
let busy=false;
async function sendCode(f){
  if(busy) return; const email=f.e.value.trim().toLowerCase(); if(!email) return;
  busy=true; const b=document.getElementById('go'); if(b){ b.disabled=true; b.textContent="Sending..."; }
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
  busy=false; if(b){ b.disabled=false; b.textContent="Email me a code"; }
  state.email=email;
  if(!error) return go('signin',{step:1});
  const m=(error.message||"").toLowerCase();
  if(error.status===403 || m.includes("not on file")) showErr("We don't have that email on file. Use the email you booked with, or text Keith at "+KEITH.phone+".");
  else if(error.status===429 || m.includes("rate")) showErr("Too many tries. Wait a minute, then try again.");
  else showErr("Something went wrong. Check your connection and try again.");
}
async function resend(btn){
  btn.disabled=true; btn.textContent="Sending...";
  const { error } = await sb.auth.signInWithOtp({ email:state.email, options:{ shouldCreateUser:true } });
  btn.disabled=false; btn.textContent="Send a new code";
  if(error) showErr(error.status===429?"Please wait a minute before asking for another code.":"Couldn't send a new code. Try again in a minute.");
  else toast("New code sent to "+state.email);
}
async function checkCode(f){
  if(busy) return;
  if(!/^\d{6,8}$/.test(f.value)) return showErr('Enter the code from your email.');
  busy=true; showErr("");
  const { error } = await sb.auth.verifyOtp({ email:state.email, token:f.value, type:'email' });
  busy=false;
  if(error){ f.value=""; return showErr("That code didn't work. Use the newest email, or send a new code."); }
  await afterSignIn();
}
async function afterSignIn(){
  go('loading');
  try { await loadData(); go('home'); }
  catch(e){ go('loading',{loadErr:true}); }
}
async function signOut(){ closeSheet(); await sb.auth.signOut(); TRIPS=[]; CLIENT={first:"",last:"",email:""}; go('signin',{step:0}); }
function vLoading(){
  return `<div class="signin"><div class="wordmark">Suites <em>with</em> Keith</div>
    <h1>${state.loadErr?"We couldn't load <em>your trips.</em>":"Loading <em>your trips.</em>"}</h1>
    ${state.loadErr?`<p>Check your connection and try again. If it keeps happening, text Keith at ${KEITH.phone}.</p>
      <button class="btn" onclick="state.loadErr=false;afterSignIn()">Try again</button>`:"<p>One moment.</p>"}</div>`;
}
async function boot(){
  go('loading');
  const { data } = await sb.auth.getSession();
  if(data.session){ state.email=data.session.user.email; await afterSignIn(); }
  else go('signin',{step:0});
}
let codeTimer; function codeTyped(f){ clearTimeout(codeTimer); if(f.value.length>=8) return checkCode(f); if(f.value.length>=6) codeTimer=setTimeout(()=>checkCode(f),900); }
/* ---------- sheet / toast ---------- */
function openSheet(kind){
  const s = $("#sheet");
  s.innerHTML = `<div class="label eyebrow">Signed in</div><h3>${esc(CLIENT.first)} ${esc(CLIENT.last)}</h3>
    <div style="color:var(--ash)">${esc(state.email||CLIENT.email)}</div>
    <button class="btn ghost" style="margin-top:18px" onclick="signOut()">Sign out</button>
    <button class="btn" onclick="closeSheet()">Close</button>`;
  $("#scrim").style.display="block"; requestAnimationFrame(()=>s.classList.add("open"));
}
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").style.display="none"; }
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(tt); tt=setTimeout(()=>t.style.display="none",2600); }
function copy(txt,msg){ try{ navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>toast(txt)); }catch(e){ toast(txt); } }

/* ---------- render ---------- */
function render(){
  const v = {loading:vLoading,signin:vSignin,home:vHome,trip:vTrip,book:vBook,contact:vContact,guides:vGuides,guide:vGuide,hotel:vHotel}[state.view]();
  $("#phone").innerHTML = v + `<div class="scrim" id="scrim" onclick="closeSheet()"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>`;
  const sc = document.querySelector(".screen"); if(sc) sc.scrollTop=0;
  if(state.view==="trip" && state.seg==="itinerary"){
    const t=TRIPS.find(x=>x.id===state.trip);
    if(state.jump==="today" || (isTraveling(t) && state.jump!=="none")) requestAnimationFrame(()=>jumpDay(iso(TODAY),true));
    state.jump=null; watchStrip();
  }
}
function jumpDay(d,instant){
  const sc=document.querySelector(".screen"), el=document.getElementById("day-"+d), strip=document.getElementById("strip");
  if(!sc||!el) return;
  holdMark=Date.now()+900;
  sc.scrollTo({top:el.offsetTop-(strip?strip.offsetHeight:0)-4, behavior:instant?"auto":"smooth"});
  markChip(d);
}
let holdMark=0;
function markChip(d){
  document.querySelectorAll(".chip").forEach(c=>{ const on=c.dataset.d===d; c.classList.toggle("on",on);
    if(on){ const s=c.parentNode; s.scrollTo({left:c.offsetLeft-s.clientWidth/2+c.offsetWidth/2,behavior:"smooth"}); } });
}
function watchStrip(){
  const sc=document.querySelector(".screen"), strip=document.getElementById("strip"); if(!sc||!strip) return;
  let last=null; sc.addEventListener("scroll",()=>{ let cur=null;
    document.querySelectorAll(".day").forEach(el=>{ if(el.offsetTop-strip.offsetHeight-10<=sc.scrollTop) cur=el.id.slice(4); });
    if(Date.now()<holdMark) return; if(cur&&cur!==last){ last=cur; markChip(cur); } },{passive:true});
}
boot();
</script>
